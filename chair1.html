<!--
  THE CHAIRSIDE WELCOME SCREEN.

  A separate file on purpose, like the mobile companion. The machine driving
  the operatory display is in the room with the patient, and Nexus shows that
  patient's money, their history and everybody else's. This shows a greeting
  and nothing else, so there is nothing on that screen to leak.

  READ ONLY. It opens the same clinic folder and never writes to it — no
  visit is created, no status changed. Reception marks somebody "in chair" in
  Nexus and this notices within a few seconds.

  WHOSE NAME IT SHOWS: the patient most recently moved into the chair today.
  A clinic with two chairs would need a chair number in the visit record to
  do better than that, and the app does not record one.
-->

  :root{
    --cream:#FBF7EF; --gold-pale:#F3E6CE; --gold-deep:#8A5F26; --gold-light:#C9B896;
    --ink:#1A1410; --muted:#8a7a63; --line:#E7DCC5; --white:#fff; --body:#5F5E5A;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:'Jost','Poppins',system-ui,-apple-system,sans-serif;
    /* Warmth from the top-left corner rather than a flat wash — a single
       gradient is what stops a pale screen reading as blank paper. */
    background:radial-gradient(120% 90% at 18% 0%, #FFFDF8 0%, #F8F1E3 45%, #EFE2C7 100%);
    color:var(--ink);
    /* STRETCH, not centre. The stage was centred as a block and so sized to
       its content: the screen filled to about half and the rest sat empty,
       which is what made it read as a document rather than a display. */
    display:flex; align-items:stretch;
    font-size:clamp(14px, 1.15vw, 22px);
    overflow:hidden;
  }
  .stage{
    /* The whole window, always. */
    width:100%; height:100vh; padding:4.4vh 4vw;
    display:flex; flex-direction:column; position:relative;
  }
  /* A hairline inset from the edge: it makes the screen a composed panel
     rather than a page that happens to end where the glass does. */
  .stage::after{
    content:''; position:absolute; inset:1.8vh 1.6vw;
    border:1px solid rgba(138,95,38,0.22); border-radius:4px;
    pointer-events:none;
  }
  /* One soft bloom in the corner opposite the name. Decoration, and the
     only ornament on the page. */
  .ring{ position:absolute; border-radius:50%; pointer-events:none; }
  .ring-a{
    width:52vh; height:52vh; right:-14vh; top:-16vh;
    background:radial-gradient(circle, rgba(201,184,150,0.20), transparent 70%);
  }
  .ring-b{ display:none; }

  .brandbar{ display:flex; align-items:center; gap:0.7em; position:relative; padding:0 1.4vw; }
  .brandmark{
    width:2.6em; height:2.6em; border-radius:50%; overflow:hidden;
    background:#fff; box-shadow:0 2px 10px rgba(90,62,23,0.14); flex:0 0 auto;
  }
  .brandmark img{ width:100%; height:100%; object-fit:cover; display:block; }
  .brandtext{ text-align:left; }
  .brandname{ font-size:1.05em; font-weight:500; letter-spacing:0.1em; line-height:1.2; }
  .brandsub{
    font-size:0.6em; letter-spacing:0.26em; text-transform:uppercase;
    color:var(--gold-deep);
  }

  .centre{
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    position:relative; padding:0 4vw;
  }
  .greet{
    font-size:0.86em; letter-spacing:0.34em; text-transform:uppercase;
    color:var(--gold-deep);
  }
  /* A rule with a point in the middle, rather than a plain dash. */
  .rule{ display:flex; align-items:center; gap:0.7em; margin:1.5em 0 1.6em; }
  .rule i{ display:block; width:2.6em; height:1px; background:var(--gold-light); }
  .rule i:first-child{ background:linear-gradient(90deg,transparent,var(--gold-light)); }
  .rule i:last-child{ background:linear-gradient(90deg,var(--gold-light),transparent); }
  .rule b{ display:block; width:4px; height:4px; border-radius:50%; background:var(--gold-light); }
  .who{
    /* Light, not bold. Weight reads as loud; a large light face reads as
       expensive, and this is the only thing on the screen. */
    font-size:4.6em; font-weight:300; line-height:1.06; letter-spacing:-0.015em;
    overflow-wrap:anywhere;
  }
  .ji{ color:var(--gold-deep); font-weight:400; }

  .footrow{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:1.5em; position:relative; padding:0 1.4vw;
  }
  .facts{ display:flex; align-items:baseline; gap:2.2em; }
  .fact-k{
    font-size:0.56em; letter-spacing:0.24em; text-transform:uppercase; color:#b3a289;
  }
  .fact-v{ font-size:1.05em; font-weight:500; color:#3A2E20; margin-top:0.25em; }
  .foot{ font-size:0.72em; letter-spacing:0.06em; color:#b3a289; }

  /* Nobody in the chair: the mark, centred, and the date. */
  .idle .centre, .idle .facts{ display:none; }
  .idle .brandbar{ flex:1; justify-content:center; }
  .idle .brandmark{ width:5em; height:5em; }
  .idle .brandname{ font-size:1.7em; }
  .idle .footrow{ justify-content:center; }
  /* HIDING BY CLASS, NOT BY INLINE STYLE. Showing the stage with
     style.display='block' overrode .stage{display:flex} — inline wins — so
     the stage stopped being a flex column, .centre{flex:1} did nothing, and
     every element stacked at the top with the bottom half of the screen
     empty. That is what "not looking premium" actually was. */
  .is-hidden{ display:none !important; }
  .gate{ text-align:center; }
  .gate p{ color:var(--body); font-size:1em; max-width:26em; margin:0 auto 1.4em; line-height:1.7; }
  .gate button{
    font-family:inherit; font-size:1em; cursor:pointer;
    background:var(--gold-deep); color:#fff; border:none;
    border-radius:0.6em; padding:0.7em 1.6em;
  }
  .err{ color:#B14A3D; font-size:0.9em; margin-top:1em; min-height:1.2em; }
  .chairpick{
    margin-top:1.6em; display:flex; align-items:center; justify-content:center;
    gap:0.5em; flex-wrap:wrap; font-size:0.8em; color:var(--muted);
  }
  .chairpick button{
    font-family:inherit; font-size:1em; cursor:pointer;
    background:#fff; color:var(--brown);
    border:1px solid var(--line); border-radius:0.5em; padding:0.45em 1em;
  }
  .chairpick button.on{ background:var(--gold-deep); border-color:var(--gold-deep); color:#fff; }
  /* Once running, the chair is a whisper in the corner — there to confirm
     the panel is set up right, not to be read from across the room. */
  .chairtag{
    position:fixed; left:1em; bottom:0.7em;
    font-size:0.62em; letter-spacing:0.14em; text-transform:uppercase;
    color:#cabfa8; cursor:pointer;
  }
  /* Only visible while testing on a laptop; harmless on the panel. */
  .hint{ position:fixed; bottom:0.6em; right:0.9em; font-size:0.7em; color:#c9bda6; }
</style>
</head>
<body>
<div class="stage is-hidden" id="gate">
  <div class="gate">
    <div class="brandbar" style="border-bottom:none;">
      <div class="brandmark">🦷</div>
      <div class="brandtext">
        <div class="brandname">ECHO DENTAL CLINIC</div>
        <div class="brandsub">&amp; Implant Center</div>
      </div>
    </div>
    <p style="margin-top:2em;">Choose the clinic folder once. This screen only reads it — it never changes anything.</p>
    <button type="button" id="pickBtn">Connect the clinic folder</button>
    <div class="err" id="gateErr"></div>
    <!-- WHICH CHAIR THIS PANEL IS. Asked on the gate rather than buried in a
         setting: the two operatories run the same file, and a panel that has
         not been told will show the other room's patient. -->
    <div class="chairpick">
      <span>This screen is for</span>
      <button type="button" onclick="setMyChair('1')" id="cp1">Chair 1</button>
      <button type="button" onclick="setMyChair('2')" id="cp2">Chair 2</button>
      <button type="button" onclick="setMyChair('')" id="cp0">Either</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ================= READING THE CLINIC FOLDER =========================
   The same File System Access handle the main app uses, kept in IndexedDB so
   the panel comes back after a power cut without anybody clicking anything.
   Read-only: every call here opens a file, never creates one. */
const DB = 'echo-welcome', STORE = 'handle';
let dir = null;

function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function saveHandle(h){
  const db = await idb();
  await new Promise((res, rej) => {
    const t = db.transaction(STORE, 'readwrite');
    t.objectStore(STORE).put(h, 'dir');
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}
async function loadHandle(){
  try{
    const db = await idb();
    return await new Promise((res, rej) => {
      const t = db.transaction(STORE, 'readonly');
      const q = t.objectStore(STORE).get('dir');
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => rej(q.error);
    });
  }catch(e){ return null; }
}
async function readJson(path){
  /* path is folder/file. Missing is not an error: a day with no arrivals has
     no visits file at all, which is simply an empty day. */
  try{
    let h = dir;
    const parts = path.split('/');
    for(let i = 0; i < parts.length - 1; i++) h = await h.getDirectoryHandle(parts[i]);
    const fh = await h.getFileHandle(parts[parts.length - 1]);
    return JSON.parse(await (await fh.getFile()).text());
  }catch(e){ return null; }
}
async function readText(path){
  try{
    let h = dir;
    const parts = path.split('/');
    for(let i = 0; i < parts.length - 1; i++) h = await h.getDirectoryHandle(parts[i]);
    const fh = await h.getFileHandle(parts[parts.length - 1]);
    return await (await fh.getFile()).text();
  }catch(e){ return null; }
}

/* ================= WHO IS IN THE CHAIR ================================ */
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
/* The visit record keeps every status change with its own time, so "most
   recently moved into the chair" is a fact in the file rather than a guess.
   A removed visit is struck and does not count. */
/* WHICH CHAIR THIS PANEL BELONGS TO. Chosen once, on the machine, and kept
   there — the two operatories run the same file and must not show each
   other's patient. With none chosen the screen shows whoever was seated most
   recently, which is what it did before chairs existed. */
/* FIXED BY THE FILE, when there is one file per chair. Two panels running
   one file had to be told apart by a setting on each machine — one more
   thing to get right at the wall, and nothing on screen says loudly which
   chair a panel thinks it is. A file per chair removes the question: copy
   chair 1's file to chair 1's machine and it cannot be wrong.

   Left empty, the panel falls back to the setting and the picker on the
   gate, which is how a single shared file still works. */
const FIXED_CHAIR = '1';
function myChair(){
  if(FIXED_CHAIR) return FIXED_CHAIR;
  try{ return localStorage.getItem('echo-welcome-chair') || ''; }
  catch(e){ return ''; }
}
function setMyChair(c){
  try{
    if(c) localStorage.setItem('echo-welcome-chair', String(c));
    else localStorage.removeItem('echo-welcome-chair');
  }catch(e){}
  location.reload();
}
function inChairNow(visits){
  const mine = myChair();
  let best = null, bestAt = '';
  (visits || []).forEach(v => {
    if(!v || v.removedAt) return;
    if(v.status !== 'ongoing') return;
    /* A visit seated without a chair named — or recorded before chairs
       existed — belongs to no panel. Showing it on both would put the same
       patient on two walls, and on the wrong one half the time. */
    if(mine && String(v.chair || '') !== mine) return;
    const log = Array.isArray(v.statusLog) ? v.statusLog : [];
    let at = v.arrivedAt || '';
    for(let i = log.length - 1; i >= 0; i--){
      if(log[i] && log[i].status === 'ongoing'){ at = log[i].at || at; break; }
    }
    if(!best || String(at) > bestAt){ best = v; bestAt = String(at); }
  });
  return best;
}
/* Age is stored as it was typed, against the date it was recorded \u2014 so it is
   carried forward by the years since, exactly as the app does it. */
function ageNow(rec){
  if(!rec) return '';
  const a = Number(rec.age);
  if(!a) return '';
  if(!rec.ageAt) return String(a);
  const then = new Date(rec.ageAt), now = new Date();
  let years = now.getFullYear() - then.getFullYear();
  const m = now.getMonth() - then.getMonth();
  if(m < 0 || (m === 0 && now.getDate() < then.getDate())) years--;
  return String(a + Math.max(0, years));
}
/* "ji" is a courtesy for an adult. On a child it reads as a joke, so it is
   left off below eighteen \u2014 and used when the age is unknown, since the
   greater risk is dropping it from somebody's elder. */
function honorific(ageText){
  const a = Number(ageText);
  if(a && a < 18) return '';
  return ' <span class="ji">ji</span>';
}
function greeting(){
  const h = new Date().getHours();
  if(h < 12) return 'Good morning';
  if(h < 17) return 'Good afternoon';
  return 'Good evening';
}
function longDate(){
  return new Date().toLocaleDateString('en-GB',
    { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

let lastShown = '';
async function tick(){
  const screen = document.getElementById('screen');
  const visits = await readJson('visits/' + todayStr() + '.json');
  const v = inChairNow(visits);

  if(!v){
    screen.classList.add('idle');
    document.getElementById('foot').textContent = longDate();
    lastShown = '';
    return;
  }
  /* Nothing is redrawn while the same patient is in the chair: a screen that
     flickers every few seconds in front of somebody lying under it is worse
     than one that is a few seconds stale. */
  const key = v.id + '|' + v.patientId;
  document.getElementById('foot').textContent = longDate();
  if(key === lastShown){ screen.classList.remove('idle'); return; }

  const dirMap = await readJson('settings/patients.json') || {};
  const contacts = await readJson('settings/patient-contacts.json') || {};
  const rec = contacts[String(v.patientId)] || null;
  const name = dirMap[String(v.patientId)] || '';
  const age = ageNow(rec);
  const sex = (rec && rec.sex) || '';

  document.getElementById('greet').textContent = greeting();
  document.getElementById('who').innerHTML = escapeHtml(name || 'Welcome') + (name ? honorific(age) : '');

  /* Labelled fields in the corner, and only the ones that are known — a
     record with no sex should not leave an empty column captioned "Sex". */
  const field = (k, val) =>
    '<div><div class="fact-k">' + k + '</div><div class="fact-v">' + escapeHtml(val) + '</div></div>';
  const bits = [ field('Patient', 'EDC/' + String(v.patientId)) ];
  if(age) bits.push(field('Age', age));
  if(sex) bits.push(field('Sex', sex));
  document.getElementById('facts').innerHTML = bits.join('');

  screen.classList.remove('idle');
  lastShown = key;
}
function escapeHtml(t){
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* THE CLINIC'S LOGO, from the folder when one has been uploaded there — the
   same picture the bills, receipts and prescriptions use, so changing it
   changes every surface at once. The copy built into this file is the
   fallback, so the screen is never blank and never waits on a file read.

   (An earlier version read settings/clinic-stamp.txt, which is the SIGNATURE
   stamp that goes at the foot of a bill: the wrong image entirely.) */
async function paintLogo(){
  const data = await readText('settings/clinic-logo.txt');
  if(data && data.indexOf('data:image') === 0){
    const img = document.querySelector('.brandmark img');
    if(img) img.src = data;
  }
}
/* A FULL RELOAD, ON A 30-SECOND CADENCE — BUT NEVER IN A PATIENT'S FACE.

   The data is already re-read every five seconds, so a reload is not how the
   screen stays current. It is how a panel left running for weeks stays
   healthy: it drops whatever the page has accumulated, re-reads the logo,
   and re-establishes the folder handle if the machine has been asleep.

   A reload blanks the screen for a moment. Doing that every thirty seconds
   above somebody lying in the chair would be worse than anything it fixes,
   so it waits: the cadence is checked every thirty seconds and the reload
   happens the first time NOBODY is in the chair. On a busy afternoon that
   may be several minutes late, which costs nothing. */
const RELOAD_AFTER_MS = 30000;
let reloadDueAt = Date.now() + RELOAD_AFTER_MS;
function startReloadWatch(){
  setInterval(async () => {
    if(Date.now() < reloadDueAt) return;
    /* Read fresh rather than trusting what is on screen: the last tick may
       be up to five seconds old, and reloading over somebody who has just
       sat down is exactly what this avoids. */
    let busy = false;
    try{ busy = !!inChairNow(await readJson('visits/' + todayStr() + '.json')); }
    catch(e){ busy = true; }   /* cannot tell: assume occupied and wait */
    if(busy) return;
    location.reload();
  }, RELOAD_AFTER_MS);
}
function paintChairUi(){
  const c = myChair();
  /* A file that already knows its chair should not offer to change it — the
     buttons would write a setting the file then ignores. */
  if(FIXED_CHAIR){
    /* By class, not by an inline style: an inline display beats the
       stylesheet, and that is precisely the bug that flattened this screen's
       layout once already. */
    const pick = document.querySelector('.chairpick');
    if(pick) pick.classList.add('is-hidden');
  }
  ['0','1','2'].forEach(k => {
    const b = document.getElementById('cp' + k);
    if(b) b.classList.toggle('on', (k === '0' ? '' : k) === c);
  });
  const tag = document.getElementById('chairTag');
  if(tag) tag.textContent = c ? ('Chair ' + c) : 'Either chair';
}
async function start(handle){
  dir = handle;
  paintChairUi();
  document.getElementById('gate').classList.add('is-hidden');
  document.getElementById('screen').classList.remove('is-hidden');
  await paintLogo();
  await tick();
  /* Five seconds: reception marks somebody in the chair and walks them
     through, so the screen should have changed before they sit down. */
  setInterval(tick, 5000);
  startReloadWatch();
}
document.getElementById('pickBtn').onclick = async () => {
  try{
    const h = await window.showDirectoryPicker({ mode:'read' });
    await saveHandle(h);
    await start(h);
  }catch(e){
    document.getElementById('gateErr').textContent = 'That folder could not be opened.';
  }
};
(async () => {
  const saved = await loadHandle();
  if(saved){
    const perm = await saved.queryPermission({ mode:'read' });
    if(perm === 'granted'){ await start(saved); return; }
    /* Chrome forgets permission across a restart; the button asks again and
       the folder is already remembered, so it is one click. */
  }
  document.getElementById('gate').classList.remove('is-hidden');
  paintChairUi();
})();
</script>
</body>
</html>
