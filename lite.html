<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Echo Nexus Lite</title>
<link rel="manifest" href="lite.webmanifest">
<meta name="theme-color" content="#FDFAF3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Echo Lite">
<link rel="apple-touch-icon" href="icon-192.png"><style>:root{
    --gold-deep:#8A5F26;
    --gold:#AF7933;
    --muted:#8a7a63;
    --shadow: 0 8px 24px rgba(74,59,40,0.10);
    --radius: 14px;
    --gold-light:#D7B47B;
    --gold-pale:#F3E6CE;
    --brown:#4A3B28;
    --ink:#2E2419;
    --cream:#FBF7EF;
    --white:#FFFFFF;
    --success:#3E7D5A;
    --success-bg:#E4F1E9;
    --danger:#B14A3D;
    --danger-bg:#FBEAE6;
    --line:#E7DCC5;
  }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; background:var(--cream); color:var(--brown);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
body{ padding-bottom:28px; }
.wrap{ max-width:760px; margin:0 auto; padding:0 14px 24px; }
.topbar{ position:sticky; top:0; z-index:20; background:var(--white); border-bottom:1px solid var(--line);
  padding:12px 14px 0; }
.hd-row{ display:flex; align-items:center; gap:12px; }
/* Both ends take equal share, so what sits between them lands in the middle
   however long the name or the clinic line runs. */
.hd-hello{ flex:1; cursor:pointer; }
.hd-logo{ flex:none; display:block; width:26px; height:26px; border-radius:6px; }
.hd-greet{ font-size:0.78rem; color:var(--muted); }
.hd-who{ font-size:1.12rem; font-weight:700; color:var(--ink); margin-top:1px; }
.hd-mark{ flex:1; text-align:right; white-space:nowrap; }
.hd-title{ font-size:0.92rem; font-weight:700; color:var(--gold-deep); }
.hd-v{ font-size:0.62rem; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted);
  font-weight:500; margin-top:3px; }
.hd-v b{ background:var(--gold-pale); color:var(--gold-deep); border-radius:5px; padding:0 5px; }
/* The pull cue takes no room at rest. */
.signin-bar{ margin:10px 14px 0; padding:9px 12px; border-radius:10px; cursor:pointer;
  background:var(--gold-pale); border:1px solid var(--gold-light); color:var(--gold-deep);
  font-size:0.8rem; text-align:center; }
.signin-bar:active{ filter:brightness(0.96); }
.pull-cue{ height:0; opacity:0; overflow:hidden; display:flex; align-items:center; justify-content:center;
  font-size:0.74rem; letter-spacing:0.05em; color:var(--gold-deep); font-weight:600; }
.tabbar{ display:flex; gap:6px; margin-top:10px; }
.tab-btn{ flex:1; border:0; background:transparent; font-family:inherit; font-weight:600;
  font-size:0.82rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted);
  padding:10px 6px; border-bottom:2px solid transparent; cursor:pointer; }
.tab-btn{ transition:color .12s ease, border-color .12s ease; }
.tab-btn.active{ color:var(--gold-deep); border-bottom-color:var(--gold-deep); }
.tab-btn:active{ color:var(--gold); }
.sec-head{ display:flex; align-items:baseline; justify-content:space-between; margin:18px 0 8px; }
.sec-title{ font-family:inherit; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--gold-deep); font-weight:600; }
.count-badge{ font-family:inherit; font-weight:700; color:var(--brown); }
.row{ background:var(--white); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  margin-bottom:8px; }
.row.tappable{ cursor:pointer; }
.row{ transition:transform .09s ease, background .09s ease; }
.row.tappable:active{ background:var(--gold-pale); transform:translateY(1px); }
.row-name{ font-weight:700; font-size:0.98rem; color:#1A1410; }
.row-sub{ font-size:0.8rem; color:var(--muted); margin-top:2px; }
.row-when{ font-size:0.78rem; color:var(--gold-deep); font-weight:600; }
.row-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.pill{ display:inline-block; background:var(--gold-pale); color:var(--gold-deep); border-radius:6px;
  padding:1px 8px; font-size:0.72rem; font-weight:700; margin-left:6px; }
.struck{ opacity:0.55; }
.struck .row-name{ text-decoration:line-through; }
.empty-state{ text-align:center; color:var(--muted); padding:22px 8px; font-size:0.86rem; }
/* ---- the patient card ------------------------------------------------
   Colour and weight only: no images, no fonts, nothing to download. The
   press feel is a 1px shift and a shade change, which the phone renders on
   the compositor and costs nothing to run. */
.pt-card{ position:relative; background:var(--white); border:1px solid var(--line);
  border-radius:14px; padding:12px 14px 12px 16px; margin-bottom:9px; overflow:hidden;
  transition:transform .09s ease, box-shadow .09s ease, border-color .09s ease; }
.pt-card::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--gold-light); opacity:.55; }
.pt-card.tappable{ cursor:pointer; }
.pt-card.tappable:active{ transform:translateY(1px) scale(0.997); background:var(--cream); }
.pt-card.pt-open{ border-color:var(--gold-light); box-shadow:0 2px 10px rgba(74,59,40,0.07); }
.pt-card.pt-open::before{ background:var(--gold); opacity:1; }
.pt-top{ display:flex; align-items:flex-start; gap:9px; }
.pt-no{ flex:none; min-width:22px; height:22px; line-height:22px; text-align:center;
  border-radius:6px; background:var(--gold-pale); color:var(--gold-deep);
  font-size:0.72rem; font-weight:700; }
.pt-card.pt-open .pt-no{ background:var(--gold-deep); color:#fff; }
.pt-main{ flex:1; min-width:0; }
.pt-who{ font-weight:600; font-size:0.82rem; color:var(--muted); }
/* The column the time used to sit alone in. */
.pt-side{ flex:none; text-align:right; }
.pt-side .pt-f{ margin-top:6px; }
.pt-side .pt-f b{ display:block; font-size:0.85rem; font-weight:700; color:var(--brown); }
.pt-side .pt-f span{ font-size:0.62rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); }
.pt-name{ font-weight:700; font-size:1rem; color:var(--ink); }
.pt-time{ font-size:0.8rem; font-weight:600; color:var(--gold-deep); white-space:nowrap; }
.pt-sub{ font-size:0.78rem; color:var(--muted); margin-top:2px; }
.pt-tag{ display:inline-block; margin-top:6px; font-size:0.75rem; font-weight:600;
  padding:3px 9px; border-radius:7px; background:var(--gold-pale); color:var(--gold-deep); }
.pt-tag-today{ background:var(--success-bg); color:var(--success); }
.pt-tag-none{ background:transparent; color:var(--muted); padding-left:0; }
.pt-tag-wait{ background:var(--danger-bg); color:var(--danger); }
/* The two figures a card carries before it is opened. */


/* ---- prescriptions inside the card ---- */
.pt-body{ margin-top:11px; border-top:1px solid var(--line); }
.rx-line + .rx-line{ border-top:1px solid rgba(0,0,0,0.05); }
.rx-line-head{ display:flex; align-items:flex-start; gap:9px;
  padding:10px 0; cursor:pointer; transition:opacity .09s ease; }
.rx-mark{ flex:none; width:22px; height:22px; line-height:21px; text-align:center;
  border-radius:6px; border:1px solid var(--line); color:var(--gold-deep);
  font-size:0.82rem; font-weight:700; background:var(--cream); }
.rx-line-open .rx-mark{ background:var(--gold-pale); border-color:var(--gold-light); }
.rx-line-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.rx-line-meta{ font-size:0.72rem; color:var(--muted); }
.rx-chev{ flex:none; color:var(--muted); font-size:1rem; line-height:22px; width:14px; text-align:center; }
.rx-line-open .rx-chev{ color:var(--gold-deep); }
.rx-detail{ padding-left:31px; }
.rx-line-head:active{ opacity:.55; }
.rx-line-what{ font-weight:600; font-size:0.9rem; color:var(--brown); }
.rx-line-open .rx-line-what{ color:var(--gold-deep); }

.rx-line.struck .rx-line-what{ text-decoration:line-through; opacity:.6; }
.rx-detail{ padding:2px 0 12px; }
.rxs-when{ font-size:0.72rem; letter-spacing:0.06em; text-transform:uppercase;
  color:var(--muted); margin-bottom:6px; }
.pt-more{ display:block; width:100%; margin:4px 0 2px; border:1px dashed var(--line);
  background:transparent; color:var(--gold-deep); font-weight:600; font-size:0.78rem;
  padding:9px; border-radius:9px; cursor:pointer; transition:background .09s ease; }
.pt-more:active{ background:var(--gold-pale); }

.daynav{ display:flex; align-items:center; gap:6px; margin:14px 0 4px; }
.daynav-btn{ width:40px; height:40px; border:1px solid var(--line); background:var(--white);
  border-radius:11px; font-size:1.2rem; color:var(--gold-deep); cursor:pointer; line-height:1; }
.daynav-btn{ transition:transform .09s ease, background .09s ease; }
.daynav-btn:active{ background:var(--gold-pale); transform:translateY(1px); }
.daynav-label{ flex:1; text-align:center; font-weight:700; font-size:0.95rem; color:var(--brown); }
.daycal{ position:relative; display:inline-flex; align-items:center; justify-content:center;
  width:40px; height:40px; border:1px solid var(--line); border-radius:11px; background:var(--white);
  font-size:1rem; cursor:pointer; }
.daycal input{ position:absolute; inset:0; width:100%; height:100%; opacity:0; margin:0; padding:0; border:0; }
.search-input{ width:100%; border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  font-size:1rem; font-family:inherit; background:var(--white); color:var(--brown); margin:14px 0 4px; }
.search-input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
.hidden{ display:none !important; }
.muted{ color:var(--muted); }
.gate{ text-align:center; padding:60px 20px; }
.gate h1{ font-family:inherit; font-size:1.1rem; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--gold-deep); margin:0 0 6px; }
.gate p{ color:var(--muted); font-size:0.88rem; margin:0 0 20px; }
.btn{ transition:transform .09s ease, filter .09s ease; border:0; background:var(--gold-deep); color:#fff; font-family:inherit; font-weight:600;
  letter-spacing:0.06em; text-transform:uppercase; font-size:0.82rem; padding:12px 22px; border-radius:11px;
  cursor:pointer; }
.btn:active{ transform:translateY(1px); filter:brightness(0.94); }
.btn.ghost{ background:transparent; color:var(--gold-deep); border:1px solid var(--line); }
.status-bar{ padding:10px 14px; font-size:0.84rem; text-align:center; }
.status-bar.err{ background:var(--danger-bg); color:var(--danger); }
.spin{ text-align:center; padding:26px; color:var(--muted); font-size:0.86rem; }
/* The prescription itself, opened in place. */
.rx-sheet{ background:var(--white); border:1px solid var(--gold-light); border-radius:12px;
  padding:14px 16px; margin:0 0 10px; }
.rxs-h{ font-family:inherit; font-weight:700; color:var(--brown); margin-bottom:8px; }
.rxs-k{ font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold-deep);
  font-weight:600; margin-top:10px; }
.rxs-v{ font-size:0.9rem; color:var(--brown); white-space:pre-wrap; }
.rxs-med{ border-top:1px solid rgba(0,0,0,0.06); padding:6px 0 4px; font-size:0.9rem; font-weight:600; }
.rxs-dose{ font-size:0.8rem; color:var(--muted); font-weight:400; }
.rxs-close{ display:block; width:100%; margin-top:14px; border:1px solid var(--line); background:transparent;
  color:var(--gold-deep); font-family:inherit; font-weight:600; letter-spacing:0.06em;
  text-transform:uppercase; font-size:0.78rem; padding:10px; border-radius:10px; cursor:pointer; }

/* ---- v3.0 calendar ---- */
.cal-top{ text-align:center; margin:12px 0 6px; }
.cal-title{ font-size:1.05rem; font-weight:700; color:var(--ink); background:none; border:0; font-family:inherit; padding:2px 6px; cursor:pointer; }
.cal-title::after{ content:' \25BE'; font-size:0.7rem; color:var(--muted); }
.cal-rel{ font-size:0.78rem; color:var(--muted); margin-top:1px; }
.cal-today-word{ color:var(--gold-deep); font-weight:600; }
.link{ background:none; border:0; padding:0; font:inherit; color:var(--gold-deep); text-decoration:underline; cursor:pointer; }
#calPicker{ position:absolute; opacity:0; width:1px; height:1px; pointer-events:none; }
.cal-strip{ display:grid; grid-template-columns:14px repeat(7, 1fr) 14px; gap:3px; margin:8px -14px 2px; padding:0 0; touch-action:pan-y; }
.cal-d{ border:0; background:none; font-family:inherit; font-size:0.66rem; color:var(--muted); padding:6px 0; border-radius:10px; display:flex; flex-direction:column; align-items:center; gap:1px; cursor:pointer; }
.cal-d b{ font-size:0.86rem; color:var(--ink); font-weight:600; }
.cal-d.peek{ opacity:0.35; overflow:hidden; }
.cal-d.sel{ background:var(--gold-deep); color:#fff; }
.cal-d.sel b{ color:#fff; }
.cal-d.today{ box-shadow: inset 0 0 0 1px var(--gold-deep); }
.cal-d.today b{ color:var(--gold-deep); }
.cal-range{ text-align:center; font-size:0.7rem; color:var(--muted); }
.cal-fresh{ text-align:center; font-size:0.7rem; color:var(--muted); min-height:14px; margin:2px 0 10px; }
.cal-row{ display:grid; grid-template-columns:58px minmax(0,1fr) auto; gap:8px; align-items:center; background:var(--white); border:1px solid var(--line); border-left:4px solid #B4B2A9; border-radius:11px; padding:9px 10px; margin-bottom:6px; cursor:pointer; }
.cal-row:active{ transform:scale(0.99); }
.cal-row.is-rough{ border-left-style:dashed; opacity:0.85; }
.cal-row.is-struck{ opacity:0.7; }
.cal-row.is-struck .cal-name{ text-decoration:line-through; }
.cal-time{ font-size:0.8rem; font-weight:700; color:var(--ink); line-height:1.15; }
.cal-time small{ font-size:0.62rem; font-weight:600; margin-left:2px; color:var(--muted); }
.cal-time span{ display:block; font-size:0.66rem; font-weight:400; color:var(--muted); }
.cal-main{ min-width:0; }
.cal-name{ font-size:0.9rem; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cal-name span{ font-weight:400; font-size:0.74rem; color:var(--muted); }
.cal-sub{ font-size:0.74rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cal-chip{ font-size:0.66rem; font-weight:600; border-radius:10px; padding:2px 8px; white-space:nowrap; }
.st-wait{ background:#FAEEDA; color:#633806; } .st-chair{ background:#E6F1FB; color:#0C447C; }
.st-done{ background:#EAF3DE; color:#27500A; } .st-booked{ background:#F1EFE8; color:#444441; }
.st-noshow{ background:#FCEBEB; color:#791F1F; } .st-rough{ border:1px dashed #B4AB98; color:var(--muted); }
.cal-closed{ text-align:center; font-size:0.74rem; color:var(--muted); border-radius:11px; padding:7px 10px; margin-bottom:6px;
  background:repeating-linear-gradient(45deg, var(--cream), var(--cream) 6px, #F1EFE8 6px, #F1EFE8 12px); }
.cal-skel{ height:52px; border-radius:11px; margin-bottom:6px; background:linear-gradient(90deg,#F3EDE2,#FBF7EF,#F3EDE2); background-size:200% 100%; animation:skel 1.2s ease-in-out infinite; }
@keyframes skel{ 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }
/* ---- drawer ---- */
.drawer-wrap{ position:fixed; inset:0; background:rgba(46,36,25,0.45); z-index:50; display:flex; align-items:flex-end; }
.drawer{ background:var(--white); width:100%; max-width:760px; margin:0 auto; border-radius:18px 18px 0 0; padding:8px 16px calc(18px + env(safe-area-inset-bottom)); max-height:86vh; overflow-y:auto; }
.dr-grip{ width:38px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 10px; }
.dr-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.dr-head b{ font-size:1.02rem; color:var(--ink); }
.dr-head span{ font-size:0.78rem; color:var(--muted); }
.dr-x{ border:0; background:var(--cream); border-radius:50%; width:30px; height:30px; font-size:0.9rem; color:var(--brown); cursor:pointer; flex:none; }
.dr-line{ font-size:0.78rem; color:var(--muted); margin:3px 0 12px; }
.dr-panel{ border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px; }
.dr-rx{ font-size:0.9rem; color:var(--ink); font-weight:600; margin-top:4px; }
.dr-rx span{ display:block; font-size:0.72rem; font-weight:400; color:var(--muted); }
.dr-kvs{ border-top:1px solid var(--line); margin-bottom:12px; }
.dr-kv{ display:grid; grid-template-columns:72px 1fr; font-size:0.84rem; padding:8px 0; border-bottom:1px solid var(--line); }
.dr-kv span:first-child{ color:var(--muted); }
.dr-btn{ width:100%; margin-top:4px; }
/* ---- previous prescriptions ---- */
.prev-rx{ position:fixed; inset:0; background:var(--cream); z-index:60; overflow-y:auto; }
.prev-rx .wrap{ padding-top:12px; }
.pv-head{ margin:6px 0 12px; }
.pv-head b{ font-size:1.02rem; color:var(--ink); }
.pv-head span{ font-size:0.8rem; color:var(--muted); }
html, body{ overscroll-behavior-y: contain; }
/* ==== KIVI-STYLE CALENDAR (lite 3.2 / admin 4.2) ==== */
body{ padding-bottom:calc(76px + env(safe-area-inset-bottom)) !important; }
.topbar{ background:linear-gradient(160deg,#8A5F26,#6E4A1C) !important; border-bottom:0 !important; color:#fff; }
.topbar .hd-greet{ color:rgba(255,255,255,0.8) !important; }
.topbar .hd-who{ color:#fff !important; }
.topbar .hd-title{ color:#fff !important; }
.topbar .hd-v{ color:rgba(255,255,255,0.75) !important; }
.topbar .hd-v b{ background:rgba(255,255,255,0.22) !important; color:#fff !important; }
.topbar .admin-btn{ border-color:rgba(255,255,255,0.75) !important; color:#fff !important; background:transparent !important; }
.topbar .admin-btn.open{ background:#fff !important; color:#6E4A1C !important; }
/* the tabs live at the bottom, like KIVI */
.tabbar{ position:fixed !important; left:0; right:0; bottom:0; z-index:40; margin:0 !important; background:#fff; border-top:1px solid var(--line);
  padding:4px 4px calc(4px + env(safe-area-inset-bottom)) !important; display:flex !important; }
.tabbar .tab-btn{ color:var(--muted); border-bottom:0 !important; padding:6px 2px !important; }
.tabbar .tab-btn.active{ color:var(--gold-deep); }
.tabbar .tab-btn svg{ width:20px; height:20px; display:block; margin:0 auto 2px; }
.lite-tab-ico{ display:block; font-size:1.15rem; line-height:1; margin-bottom:2px; }
/* the band continues the header on the calendar */
.cal-band{ background:linear-gradient(160deg,#7C5421,#6E4A1C); color:#fff; margin:0 -14px 12px; padding:6px 14px 12px; border-radius:0 0 22px 22px; }
.cal-band-row{ display:flex; justify-content:space-between; align-items:center; }
.cal-month{ background:none; border:0; color:#fff; font:inherit; font-size:1rem; font-weight:700; padding:4px 0; cursor:pointer; }
.cal-month::after{ content:' \25BE'; font-size:0.7rem; opacity:0.8; }
.cal-total{ font-size:0.78rem; opacity:0.95; }
.cal-total b{ background:#fff; color:#6E4A1C; border-radius:10px; padding:1px 8px; margin-left:4px; }
#calPicker{ position:absolute; opacity:0; width:1px; height:1px; pointer-events:none; }
.cal-strip{ display:flex !important; gap:2px; overflow-x:auto; scroll-behavior:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  margin:10px -14px 0 !important; padding:0 8px; grid-template-columns:none !important; touch-action:pan-x; }
.cal-strip::-webkit-scrollbar{ display:none; }
.kv-d{ flex:0 0 46px; border:0; background:none; color:#fff; font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 0; cursor:pointer; }
.kv-d span{ font-size:0.7rem; opacity:0.85; }
.kv-d b{ width:32px; height:32px; line-height:32px; border-radius:50%; font-size:0.98rem; font-weight:600; }
.kv-d.is-today b{ box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.8); }
.kv-d.sel b{ background:#fff; color:#6E4A1C; box-shadow:none; }
.cal-sched-head{ display:flex; justify-content:space-between; align-items:baseline; margin:2px 2px 8px; }
#calDayWord{ font-size:0.88rem; color:var(--brown); font-weight:600; }
.kv-today{ font-size:0.8rem; margin-left:6px; }
.cal-sched-head .cal-fresh{ margin:0 !important; text-align:right; }
.cal-chips{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin:0 -2px 12px; padding:0 2px; }
.cal-chips::-webkit-scrollbar{ display:none; }
.kv-chip{ flex:none; border:1px solid transparent; border-radius:16px; padding:5px 11px; font:inherit; font-size:0.76rem; font-weight:600; cursor:pointer; white-space:nowrap; }
.kv-chip b{ display:inline-block; min-width:18px; margin-left:3px; background:rgba(255,255,255,0.7); border-radius:9px; padding:0 5px; }

  <button type="button" class="btn ghost" onclick="closePrevRx()" style="margin:4px 0 6px;">&lsaquo; Back</button>
  <div id="prevRxBody"></div>
</div></div>
<script>
/* ==========================================================================
   ECHO NEXUS — LITE  v3.0  (16 Sep 2026)

   For reception, staff and the associate doctor. Read-only. Two pages:
     CALENDAR  the day's bookings and visits together, latest first, any day
               past or future; tap one for the drawer.
     PATIENTS  a name, and every prescription on record.

   NO SIGN-IN (v3.0). The app reads through the clinic's relay (an Apps
   Script on the clinic Google account) with the key its setup link carried.
   The relay never gives this key phone numbers or money, whatever is asked.

   INSTANT (v3.0). Everything read is kept on the phone (IndexedDB) and drawn
   from there first; the relay is asked behind it and the page updates in
   place. A day already on the phone paints with no wait. Opening a day also
   reads its whole week and the next in one request, so the next tap is on
   the phone already.
   ========================================================================== */
/* One number for both phone apps from 4.6 (owner's call). */
const LITE_VERSION = '4.11';
const K_RELAY = 'echoLite_relay', K_KEY = 'echoLite_key', K_NAME = 'echoLite_name';

function pad2(n){ return String(n).padStart(2, '0'); }
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function jsArg(v){ return escapeHtml(JSON.stringify(String(v))); }
function dateOf(str){ const [y, m, d] = String(str).split('-').map(Number); return new Date(y, m - 1, d); }
function ymd(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function addDays(str, n){ const d = dateOf(str); d.setDate(d.getDate() + n); return ymd(d); }
function daysBetween(a, b){ return Math.round((dateOf(b) - dateOf(a)) / 86400000); }
function weekStart(str){ const d = dateOf(str); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return ymd(d); }
function shortDate(str, withYear){
  return dateOf(str).toLocaleDateString('en-IN', withYear ? { day:'2-digit', month:'short', year:'numeric' } : { day:'numeric', month:'short' });
}
function dayTitle(str){ return dateOf(str).toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short' }); }
function minsOf(t){ const m = /^(\d{1,2}):(\d{2})/.exec(String(t || '')); return m ? Number(m[1]) * 60 + Number(m[2]) : NaN; }
function clock(mins){
  if(!Number.isFinite(mins)) return '';
  const h = Math.floor(mins / 60), m = mins % 60, h12 = ((h + 11) % 12) + 1;
  return h12 + ':' + pad2(m) + (h < 12 ? ' am' : ' pm');
}
function localMinsOfIso(iso){ const d = new Date(iso); return isNaN(d) ? NaN : d.getHours() * 60 + d.getMinutes(); }

/* ---------------------------------------------------------------- setup -- */
function takeSetupFromLink(){
  const h = String(location.hash || '').replace(/^#/, '');
  if(!h) return;
  const p = new URLSearchParams(h);
  const r = p.get('relay'), k = p.get('key');
  if(r && k){
    try{ localStorage.setItem(K_RELAY, r); localStorage.setItem(K_KEY, k); }catch(e){}
  }
  /* The key does not stay in the address bar, where a screenshot or a shared
     tab would carry it. */
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
}
function relayUrl(){ try{ return localStorage.getItem(K_RELAY) || ''; }catch(e){ return ''; } }
function relayKey(){ try{ return localStorage.getItem(K_KEY) || ''; }catch(e){ return ''; } }
function isSetUp(){ return !!(relayUrl() && relayKey()); }

/* ---------------------------------------------------------------- relay -- */
function RelayError(msg, body){ this.name = 'RelayError'; this.message = msg; this.body = body || {}; }
async function relay(params){
  const url = new URL(relayUrl());
  url.searchParams.set('key', relayKey());
  Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
  let res;
  try{ res = await fetch(url.toString(), { redirect: 'follow', cache: 'no-store' }); }
  catch(e){ throw new RelayError('offline'); }
  let body = null;
  try{ body = await res.json(); }catch(e){ throw new RelayError('unreadable'); }
  if(!body || !body.ok){
    if(body && body.error === 'bad key') keyRejected();
    throw new RelayError((body && body.error) || 'relay', body);
  }
  return body;
}
function keyRejected(){
  /* A changed key is not a fault to retry: the phone needs the new link. */
  document.getElementById('setupMsg').textContent =
    'This phone\u2019s link is no longer valid. Open the new setup link you were sent.';
  showSetup();
}

/* ------------------------------------------------------------ the store -- */
/* IndexedDB, so weeks of days fit (localStorage holds ~5 MB and blocks the
   page while it writes). Falls back to memory if the browser refuses it. */
let _db = null;
function idb(){
  if(_db) return _db;
  _db = new Promise((resolve) => {
    try{
      const req = indexedDB.open('echo-lite', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('kv');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    }catch(e){ resolve(null); }
  });
  return _db;
}
async function idbAll(){
  const db = await idb();
  if(!db) return {};
  return new Promise((resolve) => {
    const out = {};
    try{
      const tx = db.transaction('kv', 'readonly');
      const req = tx.objectStore('kv').openCursor();
      req.onsuccess = () => { const c = req.result; if(c){ out[c.key] = c.value; c.continue(); } else resolve(out); };
      req.onerror = () => resolve(out);
    }catch(e){ resolve(out); }
  });
}
async function idbPut(key, value){
  const db = await idb();
  if(!db) return;
  try{ db.transaction('kv', 'readwrite').objectStore('kv').put(value, key); }catch(e){}
}
async function idbDel(key){
  const db = await idb();
  if(!db) return;
  try{ db.transaction('kv', 'readwrite').objectStore('kv').delete(key); }catch(e){}
}
async function idbClear(){
  const db = await idb();
  if(!db) return;
  try{ db.transaction('kv', 'readwrite').objectStore('kv').clear(); }catch(e){}
}

/* What the page draws from. Filled from IndexedDB at boot, before anything
   is asked of the relay. */
const mem = { settings: {}, days: {} };
const SETTINGS = ['patients.json', 'patient-contacts.json', 'prescriptions-index.json', 'doctors.json', 'calendar-blocks.json'];
const KEEP_PAST_DAYS = 60, KEEP_FUTURE_DAYS = 30;

async function hydrate(){
  const all = await idbAll();
  const today = todayStr();
  Object.keys(all).forEach(k => {
    if(k.indexOf('set:') === 0) mem.settings[k.slice(4)] = all[k];
    else if(k.indexOf('day:') === 0){
      const d = k.slice(4);
      const age = daysBetween(d, today);
      if(age > KEEP_PAST_DAYS || -age > KEEP_FUTURE_DAYS) idbDel(k);   // pruned, quietly
      else mem.days[d] = all[k];
    }
  });
}
function S(name){ const r = mem.settings[name]; return r ? r.value : null; }

let settingsFreshThisOpen = false;
/* ONE REQUEST FOR ALL FIVE (relay r2.0), told which versions this phone holds
   so unchanged ones are not sent again. A relay from before r2.0 answers
   "unknown action", and the five are asked for one at a time as before. */
async function refreshSettings(force){
  if(settingsFreshThisOpen && !force) return;
  settingsFreshThisOpen = true;
  const sinceMap = {};
  SETTINGS.forEach(n => { if(!force && mem.settings[n] && mem.settings[n].modified) sinceMap[n] = mem.settings[n].modified; });
  try{
    const params = { action: 'settingsAll', sinceMap: JSON.stringify(sinceMap) };
    if(force) params.fresh = '1';
    const r = await relay(params);
    Object.keys(r.values || {}).forEach(name => {
      const v = r.values[name];
      if(!v || v.error || v.notModified) return;
      mem.settings[name] = { value: v.value, modified: v.modified, at: Date.now() };
      idbPut('set:' + name, mem.settings[name]);
    });
  }catch(e){
    if(!(e && e.message === 'unknown action')){ repaint(); return; }
    await Promise.all(SETTINGS.map(async name => {
      try{
        const r = await relay({ action: 'settings', name });
        mem.settings[name] = { value: r.value, modified: r.modified, at: Date.now() };
        idbPut('set:' + name, mem.settings[name]);
      }catch(err){}
    }));
  }
  repaint();
}

/* ------------------------------------------------------------- the week -- */
const weekAsked = {};   // range -> ms asked, so a tap-tap-tap does not re-ask
const WEEK_RECHECK_MS = 60 * 1000;
let lastWeekError = '';
async function ensureWeek(anyDay, force){
  const from = weekStart(anyDay), to = addDays(from, 13);   // this week and the next
  const today = todayStr();
  const range = from + '|' + to;
  const allHeld = Array.from({ length: 14 }, (_, i) => addDays(from, i)).every(d => mem.days[d]);
  const allPast = to < today;
  if(!force){
    if(allHeld && allPast) return;                                        // a finished fortnight never changes
    if(weekAsked[range] && Date.now() - weekAsked[range] < WEEK_RECHECK_MS) return;
  }
  weekAsked[range] = Date.now();
  setFreshness('updating');
  try{
    const r = await relay(force ? { action: 'week', from, to, fresh: '1' } : { action: 'week', from, to });
    Object.keys(r.days || {}).forEach(d => {
      mem.days[d] = { appointments: r.days[d].appointments || [], visits: r.days[d].visits || [], modified: r.days[d].modified, at: Date.now() };
      idbPut('day:' + d, mem.days[d]);
    });
    lastWeekError = '';
    setFreshness('fresh');
  }catch(e){
    lastWeekError = e.message || 'offline';
    setFreshness('failed');
  }
  if(currentTab === 'calendar') renderCalendar();
}

let freshness = '';
function setFreshness(state){ freshness = state; paintFreshness(); }
function paintFreshness(){
  const el = document.getElementById('calFresh');
  if(!el) return;
  const held = mem.days[viewDay];
  const at = held && held.at ? new Date(held.at).toLocaleTimeString('en-IN', { hour:'numeric', minute:'2-digit' }) : '';
  if(freshness === 'updating') el.textContent = held ? 'Showing saved copy' + (at ? ' from ' + at : '') + ' \u00b7 updating\u2026' : 'Reading\u2026';
  else if(freshness === 'failed') el.textContent = held ? 'No connection \u00b7 saved copy' + (at ? ' from ' + at : '') + (lastWeekError && lastWeekError !== 'offline' ? ' \u00b7 ' + lastWeekError : '')
    : (lastWeekError && lastWeekError !== 'offline' ? 'Could not read: ' + lastWeekError : 'Not read yet \u2014 needs a connection');
  else el.textContent = at ? 'Updated ' + at : '';
}

/* ------------------------------------------------------------ people -- */
function nameOf(pid){ const d = S('patients.json') || {}; return d[String(pid)] || ''; }
function ageSexOf(pid){
  const rec = (S('patient-contacts.json') || {})[String(pid)];
  if(!rec) return '';
  let age = (rec.age === undefined || rec.age === null || rec.age === '') ? '' : String(rec.age);
  const yr = rec.ageRecordedOn ? String(rec.ageRecordedOn).slice(0, 4) : '';
  if(age && yr && yr !== todayStr().slice(0, 4)) age = age + ' (' + yr + ')';
  const sx = rec.sex ? String(rec.sex).trim()[0].toUpperCase() : '';
  return [age, (sx === 'M' || sx === 'F') ? sx : ''].filter(Boolean).join('/');
}
const DOC_COLORS = ['#C0533C','#3E7D5A','#3D5FA6','#7B4FA6','#B4802C','#2C8484','#A63D6F','#7A7F2C','#4C57A8','#A64D4D','#2C7BA6','#8A5F2C'];
function doctorColor(name){
  if(!name || name === 'NEW') return '#B4B2A9';
  const list = S('doctors.json') || [];
  const d = (Array.isArray(list) ? list : []).find(x => x && (x.name === name || x === name));
  return (d && typeof d.colorIdx === 'number' && DOC_COLORS[d.colorIdx]) || '#B4B2A9';
}
function doctorLabel(name){ return !name ? '' : (name === 'NEW' ? 'doctor not assigned' : name); }

/* ------------------------------------------------------ prescriptions -- */
function rxAll(){ const idx = S('prescriptions-index.json'); return (idx && Array.isArray(idx.list)) ? idx.list : []; }
function rxIsStruck(rec){ return !!(rec && rec.struckAt); }
function rxFor(patientId){
  const byDate = (a, b) => String(b.date || b.createdAt || '').localeCompare(String(a.date || a.createdAt || ''));
  return rxAll().filter(r => r && String(r.patientId) === String(patientId))
    .sort((a, b) => (rxIsStruck(a) ? 1 : 0) - (rxIsStruck(b) ? 1 : 0) || byDate(a, b));
}
function rxWhat(rec){
  const said = String((rec && rec.treatment) || '').trim() || String((rec && rec.advice) || '').trim();
  if(said) return said;
  const meds = ((rec && rec.medicines) || []).map(m => m && m.name).filter(Boolean);
  if(meds.length) return meds.join(', ');
  return String((rec && rec.complaints) || '').trim() || 'Consultation';
}
function rxMedCount(rec){
  const n = ((rec && rec.medicines) || []).filter(m => m && m.name).length;
  return n ? (n + (n === 1 ? ' medicine' : ' medicines')) : 'no medicines';
}
function rxDayLabel(rec){ const d = String((rec && (rec.date || rec.createdAt)) || '').slice(0, 10); return /^\d{4}-\d{2}-\d{2}$/.test(d) ? shortDate(d, true) : '\u2014'; }
function agoWords(dateStr){
  const d = String(dateStr || '').slice(0, 10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return '';
  const days = daysBetween(d, todayStr());
  if(days < 0) return 'later';
  if(days === 0) return 'today';
  if(days === 1) return 'yesterday';
  if(days < 7) return days + ' days ago';
  if(days < 14) return 'last week';
  if(days < 31) return Math.floor(days / 7) + ' weeks ago';
  const months = Math.round(days / 30.4);
  if(months < 12) return months + (months === 1 ? ' month ago' : ' months ago');
  const years = Math.floor(days / 365), rem = Math.round((days - years * 365) / 30.4);
  return years + (years === 1 ? ' year' : ' years') + (rem ? ' ' + rem + 'm' : '') + ' ago';
}
function rxDetailHtml(rec){
  const row = (k, v) => v ? '<div class="rxs-k">' + k + '</div><div class="rxs-v">' + escapeHtml(v) + '</div>' : '';
  const meds = ((rec.medicines) || []).filter(m => m && m.name);
  return '<div class="rx-detail">'
    + (rxIsStruck(rec) ? '<div class="muted" style="font-size:0.8rem;">Struck' + (rec.struckReason ? ' \u00b7 ' + escapeHtml(rec.struckReason) : '') + '</div>' : '')
    + row('Complaints', rec.complaints) + row('Investigations', rec.investigations) + row('Treatment', rec.treatment)
    + (meds.length ? '<div class="rxs-k">Medicines</div>' + meds.map(m =>
        '<div class="rxs-med">' + escapeHtml(m.name) + '<div class="rxs-dose">'
        + escapeHtml([m.dose, m.duration, m.food ? m.food + ' food' : ''].filter(Boolean).join(' \u00b7 ') || '\u2014')
        + '</div></div>').join('') : '')
    + row('Advice', rec.advice)
    + (!meds.length && !rec.treatment && !rec.advice && !rec.complaints && !rec.investigations
        ? '<div class="muted" style="font-size:0.86rem;">Nothing was written on this one.</div>' : '')
    + '</div>';
}

/* --------------------------------------------------------- the day list -- */
/* On a day that is not today nobody is still in a chair: an unfinished visit
   is done. The desk's rule, one line. */
function effectiveStatus(v, day){
  const raw = (v && v.status) || 'waiting';
  if(day === todayStr() || raw === 'done') return raw;
  return 'done';
}
function blocksOn(day){
  const list = S('calendar-blocks.json') || [];
  const dow = dateOf(day).getDay();
  return (Array.isArray(list) ? list : []).filter(b => {
    if(!b) return false;
    if(b.repeat === 'weekly'){
      if(Number(b.weekday) !== dow) return false;
      if(b.from && day < b.from) return false;
      if(b.until && day > b.until) return false;
      if(Array.isArray(b.skip) && b.skip.indexOf(day) !== -1) return false;
      return true;
    }
    return b.date === day;
  });
}
const STATUS_CHIP = {
  waiting:  ['Waiting',  'st-wait'],
  ongoing:  ['In chair', 'st-chair'],
  done:     ['Done',     'st-done'],
  booked:   ['Booked',   'st-booked'],
  noshow:   ['No show',  'st-noshow'],
  rough:    ['Rough',    'st-rough'],
  came:     ['Came',     'st-done']
};
/* Every booking and every visit once, latest first. */
function rowsFor(day){
  const held = mem.days[day];
  if(!held) return null;
  const visits = (held.visits || []).filter(v => v && !v.removedAt);
  const byVisitId = {};
  visits.forEach(v => { byVisitId[String(v.id)] = v; });
  const used = {};
  const rows = [];
  (held.appointments || []).forEach(a => {
    if(!a) return;
    const st = a.status || 'scheduled';
    if(st === 'cancelled') return;
    const v = a.visitId ? byVisitId[String(a.visitId)] : null;
    if(v) used[String(v.id)] = true;
    const t = minsOf(a.time);
    let status;
    if(a.rough) status = 'rough';
    else if(v) status = effectiveStatus(v, day);
    else if(st === 'visited') status = 'came';
    else if(st === 'noshow') status = 'noshow';
    else status = 'booked';
    rows.push({ kind: 'appt', id: a.id, visitId: v ? v.id : '', patientId: a.patientId || '', name: a.patientId ? (nameOf(a.patientId) || ('ID ' + a.patientId)) : (a.newName || (a.rough ? 'no name yet' : 'New patient')),
      mins: t, len: Number(a.mins) || 15, doctor: a.doctor || '', reason: (v && v.cameFor) || a.cameFor || a.note || '',
      status, struck: status === 'noshow', rough: !!a.rough, bookedAt: a.createdAt || '', chair: v && v.chair });
  });
  bkPendingFor(day).forEach(a => {
    rows.push({ kind: 'appt', id: a.id, visitId: '', patientId: a.patientId || '', name: a.patientId ? (nameOf(a.patientId) || ('ID ' + a.patientId)) : (a.newName || 'no name yet'),
      mins: minsOf(a.time), len: Number(a.mins) || 15, doctor: a.doctor || '', reason: a.cameFor || '',
      status: a.rough ? 'rough' : 'booked', struck: false, rough: !!a.rough, bookedAt: '', pending: true, sent: !!a.sent });
  });
  visits.forEach(v => {
    if(used[String(v.id)]) return;
    rows.push({ kind: 'walkin', id: v.id, visitId: v.id, patientId: v.patientId, name: nameOf(v.patientId) || ('ID ' + v.patientId),
      mins: localMinsOfIso(v.arrivedAt), len: 0, doctor: v.doctor || '', reason: v.cameFor || '',
      status: effectiveStatus(v, day), struck: false, rough: false, chair: v.chair });
  });
  blocksOn(day).forEach(b => {
    rows.push({ kind: b.kind === 'leave' ? 'leave' : 'block', id: b.id, mins: b.allDay ? 24 * 60 : minsOf(b.start),
      end: minsOf(b.end), allDay: !!b.allDay, title: b.title || '' });
  });
  /* EARLIEST FIRST (owner's call, a4.1 / lite 3.1 - latest-first undone). An
     all-day closure leads the day; a booking with no time closes it. */
  const sortKey = (r) => r.allDay ? -1 : (Number.isFinite(r.mins) ? r.mins : 24 * 60 + 1);
  rows.sort((x, y) => sortKey(x) - sortKey(y));
  return rows;
}
const AV_TONES = [['#EEEDFE','#3C3489'],['#E1F5EE','#085041'],['#FBEAF0','#72243E'],['#E6F1FB','#0C447C'],['#EAF3DE','#27500A']];
/* OPTION A (owner's pick, lite 3.4 / admin 4.5): a coloured band down the left
   says the status at a glance; time and status pill on top; the name large;
   doctor, reason and prescriptions on one quiet line beneath. */
const BAND = { booked:'#EF9F27', waiting:'#BA7517', ongoing:'#378ADD', done:'#639922', came:'#639922', noshow:'#E24B4A', rough:'#B4B2A9' };
function rowHtml(r, day){
  if(r.kind === 'block' || r.kind === 'leave'){
    const when = r.allDay ? 'all day' : (Number.isFinite(r.mins) ? clock(r.mins) + (Number.isFinite(r.end) ? ' \u2013 ' + clock(r.end) : '') : '');
    return '<div class="cal-closed">' + (r.kind === 'leave' ? 'Away' : 'Closed') + (when ? ' ' + escapeHtml(when) : '')
      + (r.title ? ' \u00b7 ' + escapeHtml(r.title) : '') + '</div>';
  }
  const chip = STATUS_CHIP[r.status] || STATUS_CHIP.booked;
  const rxN = r.patientId ? rxFor(r.patientId).length : 0;
  const as = r.patientId ? ageSexOf(r.patientId) : '';
  let when;
  if(r.kind === 'walkin') when = 'walk-in' + (Number.isFinite(r.mins) ? ' \u00b7 ' + clock(r.mins) : '');
  else if(Number.isFinite(r.mins)) when = clock(r.mins) + (r.len && !r.rough ? ' \u2013 ' + clock(r.mins + r.len) : '');
  else when = 'any time';
  const meta = [
    '<span><i style="background:' + doctorColor(r.doctor) + ';"></i>' + escapeHtml(doctorLabel(r.doctor) || (r.rough ? 'rough slot' : 'no doctor yet')) + '</span>',
    r.reason ? '<span>' + escapeHtml(r.reason) + '</span>' : '',
    rxN ? '<span class="ka-rx">\u211e ' + rxN + '</span>' : ''
  ].filter(Boolean).join('');
  return '<div class="ka-card' + (r.rough ? ' is-rough' : '') + (r.struck ? ' is-struck' : '') + (r.pending ? ' is-pending' : '') + '"'
    + ' onclick="openDrawer(' + jsArg(day) + ',' + jsArg(r.kind) + ',' + jsArg(r.id) + ')">'
    + '<div class="ka-band" style="background:' + (BAND[r.status] || BAND.booked) + ';"></div>'
    + '<div class="ka-in">'
      + '<div class="ka-top"><span class="ka-when ' + chip[1] + '-t">' + escapeHtml(when) + '</span><span>'
        + (r.pending ? '<span class="ka-pend">\u23F3 ' + (r.sent ? 'Sent to desk' : 'Waiting for signal') + '</span>' : '<span class="cal-chip ' + chip[1] + '">' + chip[0] + '</span>')
      + '</span></div>'
      + '<div class="ka-name">' + escapeHtml(r.name) + (as ? ' <span>' + escapeHtml(as) + '</span>' : '') + '</div>'
      + '<div class="ka-meta">' + meta + '</div>'
    + '</div></div>';
}

/* THE PRINTED SLIP (drawer option 2). Coloured dots for what was found and
   done, the medicines as a table, advice in its own box. */
function slipHtml(rec, title){
  const line = (color, label, v) => v ? '<div class="sl-line"><i style="background:' + color + ';"></i><span><b>' + label + '</b> \u00b7 ' + escapeHtml(v) + '</span></div>' : '';
  const meds = ((rec && rec.medicines) || []).filter(m => m && m.name);
  const empty = !meds.length && !rec.treatment && !rec.advice && !rec.complaints && !rec.investigations;
  return '<div class="sl' + (rxIsStruck(rec) ? ' is-struck' : '') + '">'
    + (title ? '<div class="sl-head"><b>' + escapeHtml(title) + '</b><span>' + escapeHtml(rxDayLabel(rec)) + '</span></div>' : '')
    + '<div class="sl-body">'
      + (rxIsStruck(rec) ? '<div class="sl-struck">Struck' + (rec.struckReason ? ' \u00b7 ' + escapeHtml(rec.struckReason) : '') + '</div>' : '')
      + line('#E24B4A', 'Complaint', rec.complaints)
      + line('#7F77DD', 'Test', rec.investigations)
      + line('#1D9E75', 'Treatment', rec.treatment)
      + (meds.length ? '<div class="sl-meds"><div class="sl-mh"><span>Medicine</span><span>Dose</span><span>Days</span></div>'
          + meds.map(m => '<div class="sl-mr"><span>' + escapeHtml(m.name) + (m.food ? '<small>' + escapeHtml(m.food) + ' food</small>' : '') + '</span>'
            + '<span>' + escapeHtml(m.dose || '\u2014') + '</span><span>' + escapeHtml(String(m.duration || '\u2014').replace(/\s*days?$/i, '')) + '</span></div>').join('')
          + '</div>' : '')
      + (rec.advice ? '<div class="sl-advice">\uD83D\uDCA1 ' + escapeHtml(rec.advice) + '</div>' : '')
      + (empty ? '<div class="muted" style="font-size:0.84rem;">Nothing was written on this one.</div>' : '')
    + '</div></div>';
}

/* HISTORY 1: month headings, a timeline, a dot coloured by how recent. The
   newest opens with its slip; any other opens on a tap. No money here, in
   either app (owner's call) - money is Full history's. */
function ageDot(dateStr){
  const days = daysBetween(String(dateStr || '').slice(0, 10) || todayStr(), todayStr());
  return days <= 31 ? '#1D9E75' : days <= 92 ? '#378ADD' : days <= 365 ? '#BA7517' : '#B4B2A9';
}
function historyHtml(pid, openIdx, toggleCall){
  const mine = rxFor(pid).slice().sort((a, b) => String(b.date || b.createdAt || '').localeCompare(String(a.date || a.createdAt || '')));
  const as = ageSexOf(pid);
  let h = '<div class="hs-head"><b>' + escapeHtml(nameOf(pid) || ('ID ' + pid)) + '</b>'
    + '<span>' + escapeHtml(String(pid)) + (as ? ' \u00b7 ' + escapeHtml(as) : '') + ' \u00b7 ' + mine.length + ' prescription' + (mine.length === 1 ? '' : 's') + '</span></div>';
  if(!mine.length) return h + '<div class="empty-state">No prescriptions on record</div>';
  let month = '';
  mine.forEach((r, i) => {
    const d = String(r.date || r.createdAt || '').slice(0, 10);
    const m = /^\d{4}-\d{2}/.test(d) ? dateOf(d).toLocaleDateString('en-IN', { month:'long', year:'numeric' }).toUpperCase() : 'UNDATED';
    if(m !== month){ if(month) h += '</div>'; month = m; h += '<div class="hs-month">' + escapeHtml(m) + '</div><div class="hs-line">'; }
    const open = i === openIdx;
    const dot = ageDot(d);
    h += '<div class="hs-item' + (open ? ' open' : '') + (rxIsStruck(r) ? ' is-struck' : '') + '">'
      + '<i class="hs-dot" style="background:' + dot + ';"></i>'
      + '<div class="hs-top" onclick="' + toggleCall + '(' + i + ')">'
        + '<div class="hs-date"><b style="color:' + dot + ';">' + (d ? escapeHtml(shortDate(d)) : '\u2014') + '</b> \u00b7 ' + escapeHtml(agoWords(d))
          + (r.doctor ? ' \u00b7 ' + escapeHtml(r.doctor) : '') + '<span>' + escapeHtml(rxMedCount(r)) + '</span></div>'
        + '<div class="hs-what">' + escapeHtml(rxWhat(r)) + '</div>'
      + '</div>'
      + (open ? slipHtml(r, '') : '')
      + '</div>';
  });
  return h + '</div>';
}

/* ---------------------------------------------------------- the calendar -- */
let currentTab = 'calendar';
let viewDay = todayStr();
let statusFilter = '';
const STRIP_BACK = 90, STRIP_AHEAD = 120;
let stripFrom = '', stripTo = '';
const CHIP_DEFS = [
  ['booked', 'Booked', r => r.status === 'booked'],
  ['waiting', 'Waiting', r => r.status === 'waiting'],
  ['ongoing', 'In chair', r => r.status === 'ongoing'],
  ['done', 'Done', r => r.status === 'done' || r.status === 'came']
];
function setStatusFilter(k){ statusFilter = (statusFilter === k) ? '' : k; renderCalendar(); }

/* THE STRIP IS BUILT ONCE and scrolled, not rebuilt on every tap - that is
   what made it jump. Three months back, four ahead; a date picked outside
   that simply rebuilds it around the new day. */
function buildStrip(centerDay){
  const el = document.getElementById('calStrip');
  if(!el) return;
  stripFrom = addDays(centerDay, -STRIP_BACK); stripTo = addDays(centerDay, STRIP_AHEAD);
  const today = todayStr();
  let h = '';
  for(let d = stripFrom; d <= stripTo; d = addDays(d, 1)){
    const dt = dateOf(d);
    h += '<button type="button" class="kv-d' + (d === today ? ' is-today' : '') + '" data-d="' + d + '" onclick="goDay(' + jsArg(d) + ')">'
      + '<span>' + dt.toLocaleDateString('en-IN', { weekday:'short' }) + '</span><b>' + dt.getDate() + '</b></button>';
  }
  el.innerHTML = h;
  markStrip(false);
}
function markStrip(smooth){
  const el = document.getElementById('calStrip');
  if(!el) return;
  el.querySelectorAll('.kv-d.sel').forEach(b => b.classList.remove('sel'));
  const b = el.querySelector('.kv-d[data-d="' + viewDay + '"]');
  if(!b) return;
  b.classList.add('sel');
  const left = b.offsetLeft - (el.clientWidth - b.offsetWidth) / 2;
  try{ el.scrollTo({ left, behavior: smooth ? 'smooth' : 'auto' }); }catch(e){ el.scrollLeft = left; }
}
function paintMonth(){
  const el = document.getElementById('calStrip'), label = document.getElementById('calMonth');
  if(!el || !label) return;
  const mid = el.scrollLeft + el.clientWidth / 2;
  let hit = null;
  el.querySelectorAll('.kv-d').forEach(b => { if(!hit && b.offsetLeft + b.offsetWidth >= mid) hit = b; });
  const d = hit ? hit.getAttribute('data-d') : viewDay;
  label.textContent = dateOf(d).toLocaleDateString('en-IN', { month:'short', year:'numeric' });
}
function renderCalendar(){
  const today = todayStr();
  const strip = document.getElementById('calStrip');
  if(strip && (!strip.children.length || viewDay < stripFrom || viewDay > stripTo)) buildStrip(viewDay);
  paintMonth();
  const all = rowsFor(viewDay);
  const people = (all || []).filter(r => r.kind === 'appt' || r.kind === 'walkin');
  document.getElementById('calTotal').textContent = String(people.filter(r => r.kind === 'appt' && !r.rough).length);
  const head = document.getElementById('calDayWord');
  head.innerHTML = viewDay === today ? 'Today\u2019s schedule'
    : escapeHtml(dayTitle(viewDay)) + ' <button type="button" class="link kv-today" onclick="goDay(todayStr())">Today</button>';
  document.getElementById('calChips').innerHTML = CHIP_DEFS.map(([k, label, f]) =>
    '<button type="button" class="kv-chip kv-chip-' + k + (statusFilter === k ? ' on' : '') + '" onclick="setStatusFilter(' + jsArg(k) + ')">'
    + label + ' <b>' + people.filter(f).length + '</b></button>').join('');
  const list = document.getElementById('calList');
  if(all === null){
    list.innerHTML = '<div class="cal-skel"></div><div class="cal-skel"></div><div class="cal-skel"></div>';
  } else {
    const def = CHIP_DEFS.find(c => c[0] === statusFilter);
    /* DONE IS OUT OF THE WAY (owner's call, lite 3.3 / admin 4.4): with no
       chip picked the list is who is still to come or still in; the finished
       ones show only under Done. */
    const isDone = r => r.status === 'done' || r.status === 'came';
    const shown = def ? all.filter(r => (r.kind === 'appt' || r.kind === 'walkin') && def[2](r))
                      : all.filter(r => !((r.kind === 'appt' || r.kind === 'walkin') && isDone(r)));
    const doneCount = people.filter(isDone).length;
    const doneHint = (!def && doneCount)
      ? '<button type="button" class="kv-done-hint" onclick="setStatusFilter(\'done\')">' + doneCount + ' done \u00b7 tap Done to see ' + (doneCount === 1 ? 'them' : 'them') + '</button>' : '';
    list.innerHTML = (shown.length ? shown.map(r => rowHtml(r, viewDay)).join('')
      : '<div class="empty-state">' + (def ? 'Nobody ' + def[1].toLowerCase() : (doneCount ? 'Everyone is done' : (viewDay < today ? 'Nobody booked or came' : 'Nothing booked yet'))) + '</div>') + doneHint;
  }
  paintFreshness();
  if(typeof paintAdminExtras === 'function') paintAdminExtras();
  { const fab = document.getElementById('bkFab'); if(fab) fab.style.display = (currentTabName() === 'calendar') ? '' : 'none'; }
}
function goDay(d){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(d || ''))) return;
  viewDay = d;
  statusFilter = '';
  const strip = document.getElementById('calStrip');
  const inRange = strip && strip.children.length && d >= stripFrom && d <= stripTo;
  renderCalendar();
  if(inRange) markStrip(true); else markStrip(false);
  ensureWeek(d, false);
}
function openDatePicker(){
  const inp = document.getElementById('calPicker');
  inp.value = viewDay;
  try{ if(inp.showPicker){ inp.showPicker(); return; } }catch(e){}
  inp.focus(); inp.click();
}
function wireStripSwipe(){
  const el = document.getElementById('calStrip');
  if(!el) return;
  let raf = 0;
  el.addEventListener('scroll', () => { if(raf) return; raf = requestAnimationFrame(() => { raf = 0; paintMonth(); }); }, { passive: true });
}

function closeDrawer(){
  document.getElementById('drawerWrap').classList.add('hidden');

function wireDrawer(){
  const wrap = document.getElementById('drawerWrap');
  wrap.addEventListener('click', e => { if(e.target === wrap) closeDrawer(); });
  const sheet = document.getElementById('drawer');
  let y0 = null;
  sheet.addEventListener('touchstart', e => { if(sheet.scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive: true });
  sheet.addEventListener('touchend', e => { if(y0 !== null && e.changedTouches[0].clientY - y0 > 80) closeDrawer(); y0 = null; }, { passive: true });
}

/* ================= BOOK FROM THE PHONE (4.10) =================
   Appointment (existing patients only) or Rough (free name allowed), today
   onwards. The relay checks again and drops the booking into the inbox;
   Nexus on the clinic PC files it. Until it appears in the day's own file,
   this phone shows it dashed, "Sent to desk". Unsent (no signal) bookings
   wait on the phone and go when the signal does. */
const BK_SLOT_FROM = 9 * 60, BK_SLOT_TO = 22 * 60;
let bk = null;          // the open form
let bkPending = [];     // this phone's bookings not yet seen in a day file
async function bkLoad(){
  try{ const all = await idbAll(); bkPending = all['bk:pending'] || []; }catch(e){ bkPending = []; }
}
function bkSave(){ idbPut('bk:pending', bkPending); }
function bkPendingFor(day){
  const held = mem.days[day];
  const ids = new Set(((held && held.appointments) || []).map(a => a && String(a.id)));
  bkPending = bkPending.filter(p => !(mem.days[p.date] && ids.has(p.id) && p.date === day) && p.date >= todayStr());
  return bkPending.filter(p => p.date === day && !ids.has(p.id));
}
function bkDocs(){ const d = S('doctors.json'); return (Array.isArray(d) ? d : []).map(x => x && (x.name || x)).filter(Boolean); }
function bkOpen(){
  const today = todayStr();
  bk = { mode: 'appt', date: viewDay < today ? today : viewDay, q: '', pid: '', name: '', doctor: bkDocs()[0] || '', time: '', mins: 15, reason: '', lookup: [], msg: '' };
  document.getElementById('bkWrap').classList.remove('hidden');
  bkRender();
}
function bkClose(){ bk = null; document.getElementById('bkWrap').classList.add('hidden'); }
function bkSet(k, v){ if(!bk) return; bk[k] = v; if(k === 'mode'){ bk.doctor = (v === 'rough') ? '' : (bkDocs()[0] || ''); } if(k === 'mode' || k === 'doctor' || k === 'mins' || k === 'date'){ bk.time = ''; } bk.msg = ''; bkRender(); }
let bkLookupTimer = null;
function bkSearch(v){
  if(!bk) return;
  bk.q = v; bk.pid = ''; if(bk.mode === 'rough') bk.name = v;
  clearTimeout(bkLookupTimer);
  const digits = String(v).replace(/\D/g, '');
  if(digits.length >= 4){
    bkLookupTimer = setTimeout(async () => {
      try{ const r = await relay({ action: 'lookup', q: digits }); if(bk && bk.q === v){ bk.lookup = r.ids || []; bkRenderHits(); } }catch(e){}
    }, 350);
  } else bk.lookup = [];
  bkRenderHits();
}
function bkPick(pid){ if(!bk) return; bk.pid = String(pid); bk.q = nameOf(pid) || pid; bk.name = ''; bkRender(); }
function bkHits(){
  const q = String(bk.q || '').trim().toLowerCase();
  if(bk.pid || q.length < 2) return [];
  const dir = S('patients.json') || {};
  const ids = new Set(bk.lookup || []);
  Object.keys(dir).forEach(pid => { if(ids.size < 40 && (String(dir[pid] || '').toLowerCase().includes(q) || pid.includes(q))) ids.add(pid); });
  return [...ids].slice(0, 8);
}
function bkRenderHits(){
  const el = document.getElementById('bkHits');
  if(!el || !bk) return;
  const hits = bkHits();
  el.innerHTML = hits.map(pid => '<button type="button" onclick="bkPick(' + jsArg(pid) + ')"><b>' + escapeHtml(nameOf(pid) || 'Unknown') + '</b> <span>' + escapeHtml(pid) + (ageSexOf(pid) ? ' \u00b7 ' + escapeHtml(ageSexOf(pid)) : '') + '</span></button>').join('');
  el.style.display = hits.length ? '' : 'none';
}
/* A slot for the chosen doctor: booked (overlaps a real booking), closed
   (a closure, or that doctor away), past, or free. Rough never blocks, and
   a rough booking may take any of them but past. */
function bkSlotState(t){
  const day = bk.date, today = todayStr();
  const now = new Date(); const nowM = now.getHours() * 60 + now.getMinutes();
  if(day === today && t + bk.mins <= nowM) return 'past';
  const held = mem.days[day];
  const appts = ((held && held.appointments) || []).concat(bkPendingFor(day));
  const busy = appts.some(a => a && !a.rough && (a.status || 'scheduled') !== 'cancelled' && a.status !== 'noshow'
    && bk.doctor && a.doctor === bk.doctor && (() => { const s1 = minsOf(a.time); return Number.isFinite(s1) && t < s1 + (Number(a.mins) || 15) && t + bk.mins > s1; })());
  if(busy) return 'booked';
  const closed = blocksOn(day).some(b => {
    if(b.kind === 'leave' && (!bk.doctor || b.doctor !== bk.doctor)) return false;
    if(b.allDay) return true;
    const s0 = minsOf(b.start), e0 = minsOf(b.end);
    return Number.isFinite(s0) && Number.isFinite(e0) && t < e0 && t + bk.mins > s0;
  });
  return closed ? 'closed' : 'free';
}
function bkRender(){
  if(!bk) return;
  const rough = bk.mode === 'rough';
  const docs = bkDocs();
  const today = todayStr();
  const dayOpts = Array.from({ length: 30 }, (_, i) => addDays(today, i));
  let slots = '';
  for(let t = BK_SLOT_FROM; t < BK_SLOT_TO; t += 15){
    const st = bkSlotState(t);
    const hhmm = String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
    const can = rough ? st !== 'past' : st === 'free';
    const cls = 'bk-slot bk-' + st + (bk.time === hhmm ? ' sel' : '');
    slots += '<button type="button" class="' + cls + '"' + (can ? ' onclick="bkSet(\'time\',' + jsArg(hhmm) + ')"' : ' disabled') + '>'
      + clock(t).replace(/ (am|pm)$/, '<small>$1</small>') + (st === 'booked' ? '<i>Booked</i>' : '') + '</button>';
  }
  const who = rough
    ? '<div class="bk-f">Who <span>optional \u2014 a patient, a name as a note, or empty</span></div>'
    : '<div class="bk-f">Patient <span>name, ID or mobile</span></div>';
  document.getElementById('bkSheet').innerHTML =
    '<div class="bk-head"><div class="bk-title">Book</div><button type="button" class="dr-x" onclick="bkClose()">\u2715</button></div>'
    + '<div class="bk-switch"><button type="button" class="' + (rough ? '' : 'on') + '" onclick="bkSet(\'mode\',\'appt\')">Appointment</button>'
    + '<button type="button" class="' + (rough ? 'on' : '') + '" onclick="bkSet(\'mode\',\'rough\')">Rough</button></div>'
    + (rough ? '<div class="bk-note">A note that someone may come. It does not hold the time; a real booking can go over it.</div>' : '')
    + '<div class="bk-f">Day</div><select class="bk-in" onchange="bkSet(\'date\', this.value)">'
      + dayOpts.map(d => '<option value="' + d + '"' + (d === bk.date ? ' selected' : '') + '>' + escapeHtml(dayTitle(d)) + (d === today ? ' \u00b7 today' : '') + '</option>').join('') + '</select>'
    + who
    + '<input class="bk-in" id="bkQ" autocomplete="off" value="' + escapeHtml(bk.q) + '" oninput="bkSearch(this.value)" placeholder="' + (rough ? 'e.g. Mr Verma' : 'Search') + '">'
    + (bk.pid ? '<div class="bk-picked">\u2713 ' + escapeHtml(nameOf(bk.pid)) + ' \u00b7 ' + escapeHtml(bk.pid) + '</div>' : '')
    + '<div class="bk-hits" id="bkHits"></div>'
    + '<div class="bk-f">Doctor' + (rough ? ' <span>optional</span>' : '') + '</div>'
    + '<div class="bk-seg">' + docs.map(d => '<button type="button" class="' + (bk.doctor === d ? 'on' : '') + '" onclick="bkSet(\'doctor\',' + jsArg(d) + ')"><i style="background:' + doctorColor(d) + ';"></i>' + escapeHtml(d.replace(/^Dr\.?\s*/i, '')) + '</button>').join('')
      + (rough ? '<button type="button" class="' + (!bk.doctor ? 'on' : '') + '" onclick="bkSet(\'doctor\',\'\')">None</button>' : '') + '</div>'
    + '<div class="bk-f">Length</div><div class="bk-seg">' + [15, 30, 45, 60].map(m => '<button type="button" class="' + (bk.mins === m ? 'on' : '') + '" onclick="bkSet(\'mins\',' + m + ')">' + m + 'm</button>').join('') + '</div>'
    + '<div class="bk-f">Time</div><div class="bk-slots">' + slots + '</div>'
    + '<div class="bk-f">Reason <span>optional</span></div><input class="bk-in" id="bkReason" value="' + escapeHtml(bk.reason) + '" oninput="bkReason(this.value)" placeholder="e.g. RCT second sitting">'
    + '<div class="bk-msg">' + escapeHtml(bk.msg || '') + '</div>'
    + '<button type="button" class="bk-go' + (rough ? ' rough' : '') + '" onclick="bkSubmit()">'
      + (rough ? 'Add rough' : 'Book') + (bk.time ? ' \u00b7 ' + escapeHtml(dayTitle(bk.date)) + ' ' + clock(minsOf(bk.time)) : '') + '</button>';
  bkRenderHits();
}
function bkReason(v){ if(bk) bk.reason = v; }
function bkId(){ return 'ph-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
function bkWho(){ try{ return localStorage.getItem('echoLite_name') || localStorage.getItem('echoAdmin_name') || ''; }catch(e){ return ''; } }
async function bkSubmit(){
  if(!bk) return;
  const rough = bk.mode === 'rough';
  if(!rough && !bk.pid){ bk.msg = 'Choose a patient from the list \u2014 new patients are registered at the desk.'; return bkRender(); }
  if(!rough && !bk.doctor){ bk.msg = 'Choose a doctor.'; return bkRender(); }
  if(!bk.time){ bk.msg = 'Pick a time.'; return bkRender(); }
  const rec = { id: bkId(), date: bk.date, time: bk.time, mins: bk.mins, patientId: bk.pid, newName: rough && !bk.pid ? String(bk.q || '').trim() : '',
    doctor: bk.doctor, cameFor: bk.reason, rough, bookedBy: bkWho() || (typeof ADMIN_VERSION !== 'undefined' ? 'admin phone' : 'lite phone'),
    status: 'scheduled', pending: true, sent: false };
  bkPending.push(rec); bkSave();
  bkClose();
  toast(rough ? 'Rough slot added \u00b7 sending to the desk' : 'Booked \u00b7 sending to the desk');
  renderCalendar();
  await bkSend();
  if(bkPending.some(p => !p.sent)) bkQuickRetry();
}
let bkSending = false;
async function bkSend(){
  if(bkSending) return;
  bkSending = true;
  try{
    for(const p of bkPending.filter(x => !x.sent)){
      try{
        await relay({ action: 'book', booking: JSON.stringify(p) });
        p.sent = true; bkSave();
      }catch(e){
        if(e && e.message !== 'offline' && e.message !== 'unreadable' && e.body && e.body.error){
          bkPending = bkPending.filter(x => x.id !== p.id); bkSave();
          alert('Not booked: ' + e.body.error);
        }
      }
    }
  }finally{ bkSending = false; }
  if(currentTab === 'calendar') renderCalendar();
}
function toast(t){
  let el = document.getElementById('bkToast');
  if(!el){ el = document.createElement('div'); el.id = 'bkToast'; el.className = 'bk-toast'; document.body.appendChild(el); }
  el.textContent = t; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 3500);
}
window.addEventListener('online', () => bkSend());
setInterval(() => { if(bkPending.some(p => !p.sent)) bkSend(); }, 30000);

/* FASTER HAND-OFF (4.11). A booking that did not go through is retried every
   5 seconds for its first minute (then every 30 as before), and at once when
   the app comes back to the screen. One that went through but is not yet in
   the day's file has that day read fresh from Drive every 20 seconds -
   skipping the relay's 5-minute ready copy - until Nexus has filed it. */
let bkQuickLeft = 0;
function bkQuickRetry(){
  bkQuickLeft = 12;
  const tick = async () => {
    if(!bkPending.some(p => !p.sent) || bkQuickLeft-- <= 0) return;
    await bkSend();
    setTimeout(tick, 5000);
  };
  setTimeout(tick, 5000);
}
setInterval(() => {
  const waiting = bkPending.find(p => p.sent);
  if(waiting) ensureWeek(waiting.date, true);
}, 20000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && bkPending.some(p => !p.sent)) bkSend(); });


/* ------------------------------------------------------------ patients -- */
let patientQuery = '', selectedPatient = null, searchTimer = null;
function onSearch(v){ patientQuery = String(v || '').trim(); selectedPatient = null; clearTimeout(searchTimer); searchTimer = setTimeout(renderPatients, 180); }
function openPatient(pid){ selectedPatient = String(pid); prevOpen = null; renderPatients(); }
function backToSearch(){ selectedPatient = null; renderPatients(); }
function togglePatientRx(i){ prevOpen = (prevOpen === i ? -1 : i); renderPatients(); }
function renderPatients(){
  const list = document.getElementById('patientList');
  const dir = S('patients.json') || {};
  if(selectedPatient){
    const pid = selectedPatient;
    list.innerHTML = '<button type="button" class="btn ghost" onclick="backToSearch()" style="margin:4px 0 12px;">&lsaquo; Back</button>'
      + historyHtml(pid, prevOpen === null ? 0 : prevOpen, 'togglePatientRx');
    return;
  }
  const q = patientQuery.toLowerCase();
  if(q.length < 2){ list.innerHTML = '<div class="empty-state">Type a name or an ID</div>'; return; }
  const hits = Object.keys(dir)
    .filter(pid => String(dir[pid] || '').toLowerCase().includes(q) || String(pid).includes(q))
    .sort((a, b) => {
      const na = String(dir[a] || '').toLowerCase(), nb = String(dir[b] || '').toLowerCase();
      return (na.startsWith(q) ? 0 : 1) - (nb.startsWith(q) ? 0 : 1) || na.localeCompare(nb);
    });
  if(!hits.length){ list.innerHTML = '<div class="empty-state">No one by that name</div>'; return; }
  list.innerHTML = hits.slice(0, 30).map(pid => {
    const as = ageSexOf(pid);
    return '<div class="row tappable" onclick="openPatient(' + jsArg(pid) + ')">'
      + '<div class="row-head"><div class="row-name">' + escapeHtml(dir[pid] || 'Unknown patient') + '</div><div class="row-when">&rsaquo;</div></div>'
      + '<div class="row-sub">' + escapeHtml(pid) + (as ? ' \u00b7 ' + escapeHtml(as) : '') + '</div></div>';
  }).join('') + (hits.length > 30 ? '<div class="empty-state">' + (hits.length - 30) + ' more \u2014 type a little further</div>' : '');
}

/* --------------------------------------------------------------- shell -- */
function currentTabName(){ return currentTab; }
function setTab(t){
  { const fab = document.getElementById('bkFab'); if(fab) fab.style.display = (t === 'calendar' ? '' : 'none'); }
  currentTab = t;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === t));
  document.getElementById('viewCalendar').classList.toggle('hidden', t !== 'calendar');
  document.getElementById('viewPatients').classList.toggle('hidden', t !== 'patients');
  closeDrawer(); closePrevRx();
  repaint();
}
function repaint(){
  if(currentTab === 'calendar') renderCalendar(); else renderPatients();
  if(drawerCtx) openDrawer(drawerCtx.day, drawerCtx.kind, drawerCtx.id);
}
function greetingWord(){ const h = new Date().getHours(); return h < 12 ? 'Good morning,' : h < 17 ? 'Good afternoon,' : 'Good evening,'; }
function paintGreeting(){
  const g = document.getElementById('hdGreet'), n = document.getElementById('hdWho');
  if(g) g.textContent = greetingWord();
  if(n) n.textContent = (localStorage.getItem(K_NAME) || 'Doctor');
}
function askName(){
  const v = window.prompt('Name to greet you by', localStorage.getItem(K_NAME) || '');
  if(v === null) return;
  const clean = String(v).trim().slice(0, 28);
  try{ if(clean) localStorage.setItem(K_NAME, clean); else localStorage.removeItem(K_NAME); }catch(e){}
  paintGreeting();
}
let pullStartY = null, pullArmed = false, pullBusy = false;
function wirePull(){
  const cue = document.getElementById('pullCue'), txt = document.getElementById('pullText');
  const reset = () => { pullStartY = null; pullArmed = false; pullBusy = false; cue.style.height = '0px'; cue.style.opacity = '0'; txt.textContent = 'Pull to refresh'; };
  document.addEventListener('touchstart', e => {
    if(pullBusy || window.scrollY > 0 || e.touches.length !== 1) return;
    if(!document.getElementById('drawerWrap').classList.contains('hidden')) return;
    if(e.target.closest && e.target.closest('#calStrip')) return;
    pullStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if(pullStartY === null || pullBusy) return;
    const d = e.touches[0].clientY - pullStartY;
    if(d <= 0){ reset(); return; }
    cue.style.height = Math.min(d * 0.5, 64) + 'px'; cue.style.opacity = Math.min(d / 70, 1);
    pullArmed = d > 70; txt.textContent = pullArmed ? 'Release to refresh' : 'Pull to refresh';
  }, { passive: true });
  document.addEventListener('touchend', async () => {
    if(pullStartY === null || pullBusy) return;
    if(!pullArmed){ reset(); return; }
    pullBusy = true; txt.textContent = 'Reading\u2026';
    await Promise.all([refreshSettings(true), ensureWeek(viewDay, true)]);
    reset();
  }, { passive: true });
}
function showSetup(){ document.getElementById('setupScreen').classList.remove('hidden'); document.getElementById('appScreen').classList.add('hidden'); }
function showApp(){ document.getElementById('setupScreen').classList.add('hidden'); document.getElementById('appScreen').classList.remove('hidden'); }

/* A day that turns over while the app is open, or an app brought back after
   an hour: re-ask for this fortnight. */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && isSetUp()){ settingsFreshThisOpen = false; refreshSettings(false); ensureWeek(viewDay, false); }
});

let booted = false;
async function boot(){
  takeSetupFromLink();
  if(!isSetUp()){ showSetup(); return; }
  showApp();
  if(!booted){ booted = true; wireStripSwipe(); wireDrawer(); wirePull(); }
  await hydrate();          // the phone's own copy - no network
  await bkLoad();
  setTab('calendar');       // painted from it
  refreshSettings(true);    // then the relay, behind
  ensureWeek(viewDay, true);
  bkSend();
}
window.addEventListener('load', () => {
  document.getElementById('appVer').textContent = LITE_VERSION;
  paintGreeting();
  boot();
});
/* A setup link opened while the app is already on screen (the same page,
   a new #relay=...) is taken at once rather than after a reload. */
window.addEventListener('hashchange', () => { if(/relay=/.test(location.hash)) boot(); });


/* PASTED, NOT OPENED (iPhone). An app added to the Home Screen does not share
   storage with Safari, so a link opened in Safari never reaches it. The same
   link pasted here does. */
function pasteSetupLink(){
  const raw = String((document.getElementById('setupPaste') || {}).value || '').trim();
  const msg = document.getElementById('setupPasteMsg');
  const i = raw.indexOf('#');
  const p = new URLSearchParams(i === -1 ? '' : raw.slice(i + 1));
  if(!p.get('relay') || !p.get('key')){ if(msg) msg.textContent = 'That is not a setup link \u2014 copy the whole link, from https to the end.'; return; }
  location.hash = raw.slice(i + 1);
  if(typeof boot === 'function') boot();
}

/* NEW VERSION CHECK AND TAP-TO-UPDATE (4.9). A slow clinic network let the
   2.5-second fuse hand out the saved page on nearly every open, so the phone
   never moved on. Now, a few seconds after opening, the app quietly fetches
   the page from GitHub itself (?fresh - the worker waits for it and saves
   it). If the version there is newer, a bar offers to load it; tapping the
   version number does the same fetch and reloads. */
const VERSION_RE = /const (?:LITE|ADMIN)_VERSION = '([^']+)'/;
function versionNewer(a, b){
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for(let i = 0; i < Math.max(pa.length, pb.length); i++){
    const x = pa[i] || 0, y = pb[i] || 0;
    if(x !== y) return x > y;
  }
  return false;
}
async function fetchLatestPage(){
  try{
    const res = await fetch(location.pathname + '?fresh=' + Date.now(), { cache: 'no-store' });
    if(!res || !res.ok) return null;
    const text = await res.text();
    const m = VERSION_RE.exec(text);
    return m ? m[1] : null;
  }catch(e){ return null; }
}
function currentVersion(){ return (typeof ADMIN_VERSION !== 'undefined') ? ADMIN_VERSION : LITE_VERSION; }
function showUpdateBar(v){
  if(document.getElementById('updBar')) return;
  const bar = document.createElement('button');
  bar.id = 'updBar'; bar.type = 'button'; bar.className = 'upd-bar';
  bar.textContent = 'New version ' + v + ' is ready \u00b7 tap to load';
  bar.onclick = () => { bar.textContent = 'Loading\u2026'; location.reload(); };
  document.body.appendChild(bar);
}
async function checkForUpdate(){
  const latest = await fetchLatestPage();
  if(latest && versionNewer(latest, currentVersion())) showUpdateBar(latest);
}
async function hardRefresh(){
  const ver = document.getElementById('appVer');
  if(ver) ver.textContent = 'updating\u2026';
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    if(reg) await Promise.race([reg.update(), new Promise(r => setTimeout(r, 3000))]);
  }catch(e){}
  const latest = await fetchLatestPage();   // waits for GitHub and saves the newest page
  if(!latest && ver){ ver.textContent = 'no connection'; setTimeout(() => { ver.textContent = currentVersion(); }, 2500); return; }
  location.reload();
}
window.addEventListener('load', () => { setTimeout(checkForUpdate, 4000); });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') setTimeout(checkForUpdate, 1500); });
/* THE SAVED COPY OF THIS PAGE (v48 service worker). Registered here so the
   page itself opens with no network wait, not only its data. */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
