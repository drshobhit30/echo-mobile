</style></head><body>
<div class="topbar">
  <!-- The greeting leads and the mark sits quietly beside it: this is her app
       before it is the clinic's system. Tapping the name sets it. -->
  <div class="hd-row">
    <div class="hd-hello" onclick="askName()">
      <div class="hd-greet" id="hdGreet">Good day,</div>
      <div class="hd-who" id="hdWho">Doctor</div>
    </div>
    <div class="hd-mark">Echo Nexus <b>L</b><span class="hd-v" id="appVer"></span></div>
  </div>
  <div class="tabbar">
    <!-- "Visits", not "Today": the day can be moved back, so the tab that
         said Today was lying the moment somebody used the arrows. -->
    <button class="tab-btn active" data-tab="visits" onclick="setTab('visits')">Visits</button>
    <button class="tab-btn" data-tab="patients" onclick="setTab('patients')">Patients</button>
  </div>
</div>

<div id="pullCue" class="pull-cue"><span id="pullText">Pull to refresh</span></div>

<div class="wrap">
  <!-- ================= SETUP ================= -->
  <div id="setupScreen" class="gate">
    <h1>Echo Nexus Lite</h1>
    <p>Today's visits and every prescription on record. Read only.</p>
    <button class="btn" id="signInBtn">Sign in with Google</button>
    <div id="signInStatus" class="status-bar"></div>
    <div id="folderCard" class="hidden" style="margin-top:22px;">
      <input type="text" class="search-input" id="folderIdInput" placeholder="Drive folder ID">
      <button class="btn" id="saveFolderBtn" style="margin-top:10px;">Connect</button>
      <div id="folderStatus" class="status-bar"></div>
    </div>
  </div>

  <!-- ================= APP ================= -->
  <div id="appScreen" class="hidden">
    <div id="viewVisits">
      <div class="daynav">
        <button type="button" class="daynav-btn" onclick="stepDay(-1)">&lsaquo;</button>
        <div class="daynav-label" id="visitDate">&mdash;</div>
        <button type="button" class="daynav-btn" id="nextDayBtn" onclick="stepDay(1)">&rsaquo;</button>
        <label class="daycal" title="Pick a date">&#128197;
          <input type="date" id="dayPicker" onchange="pickDay(this.value)">
        </label>
      </div>
      <div class="sec-head">
        <span class="sec-title">Visited</span>
        <span class="count-badge" id="visitCount">0</span>
      </div>
      <div id="visitList"><div class="spin">Reading&hellip;</div></div>
    </div>

    <div id="viewPatients" class="hidden">
      <input type="text" class="search-input" id="patientSearch" placeholder="Search a name or patient ID"
             oninput="onSearch(this.value)" autocomplete="off">
      <div id="patientList"><div class="empty-state">Type a name or an ID</div></div>
    </div>
  </div>
</div>
<script>
const GOOGLE_CLIENT_ID = '792126159558-tm5nu32d1pgni6c4h955ab7bu8s0ja2s.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.readonly';

/* ---------------- Small helpers (mirrors the desktop app's own) ---------------- */
function pad2(n){ return String(n).padStart(2, '0'); }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
/* ---- Rolling figures --------------------------------------------------
   The desktop app counts its totals up rather than snapping them in, and
   the phone should not feel more static than the machine at the desk. The
   last value is kept ON the element (__rollVal) rather than parsed back
   out of the text — ₹1,20,000 does not parse, and a re-render must roll
   from what is actually on screen, not from zero.

   Three deliberate guards: a cancelled frame if a second render lands
   mid-roll (otherwise two animations fight over one element and the
   figure flickers); an instant set when the value has not changed, so an
   idle refresh does not re-animate the whole screen; and an instant set
   when the phone asks for reduced motion or when there is no animation
   frame to use at all — the number being RIGHT never depends on the
   animation running. Intermediate frames are rounded to whole rupees so
   paise do not flicker; the final frame prints the exact value. */
/* Figures roll AFTER the screen clears, not behind the blur.

   A render paints its numbers and the overlay is still up, so the count-up
   happened underneath it: by the time the blur lifted the roll was over or
   most of the way through, and what the eye caught was a smear of digits
   settling. The animation existed and nobody ever saw it.

   Deferred rolls queue here and are released the moment loading ends. The
   element still gets its FINAL value immediately, so nothing is left blank
   or stale if the release never comes — the roll is decoration, the figure
   is not. */
let _loadingUp = false;
let _pendingRolls = [];

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const ITEM_MODE_LABELS = { cash:'Cash', upi:'UPI', card:'Card', bank:'Bank', refund:'Refund', writeoff:'Write-off' };

/* ---------------- Money doctrine, ported verbatim from the desktop app ----
   The phone must never disagree with the screen at the clinic, so these
   four functions mirror isVoidedItem / reversalExcludesFromDayTotals /
   computeItemTotals / entryModeTotals exactly. Before this, the mobile page
   read entry.cash/upi/card/bank straight — the LEGACY stored fields — so a
   normal item-based day showed a ₹0 header above a list of real payments.
   Keep these in step with the desktop's versions if those ever change. */

/* ---------------- Auth state ---------------- */
let accessToken = null;
let tokenClient = null;
let driveFolderId = localStorage.getItem('echoDental_driveFolderId') || '';
let currentDate = todayStr();

/* The token used to live only in memory, so EVERY open — and every pull to
   refresh — threw the person back to a sign-in tap. Google's tokens last
   about an hour, so keeping one until it actually expires means most opens
   need no interaction at all; and when it has expired, we ask Google for a
   fresh one SILENTLY (prompt:'') first, which works without any tap while
   the phone still has a live Google session and the earlier consent stands.
   A visible sign-in is now the last resort rather than the routine.

   A 2-minute safety margin is subtracted so a token can't expire mid-load.
   What is stored is a read-only Drive token on the owner's own phone —
   it can view the clinic backup and nothing else, and it dies within the
   hour. Sign Out below clears it. */
const TOKEN_KEY = 'echoDental_driveToken';
function saveToken(token, expiresInSec){
  try{
    localStorage.setItem(TOKEN_KEY, JSON.stringify({
      token: token,
      expiresAt: Date.now() + ((Number(expiresInSec) || 3600) - 120) * 1000
    }));
  }catch(e){ /* private mode / storage full — the session still works */ }
}
function loadStoredToken(){
  try{
    const raw = localStorage.getItem(TOKEN_KEY);
    if(!raw) return null;
    const rec = JSON.parse(raw);
    if(!rec || !rec.token || !rec.expiresAt) return null;
    if(Date.now() >= rec.expiresAt){ localStorage.removeItem(TOKEN_KEY); return null; }
    return rec.token;
  }catch(e){ return null; }
}
function clearStoredToken(){
  accessToken = null;
  try{ localStorage.removeItem(TOKEN_KEY); }catch(e){}
}

function setStatus(elId, text, isError){
  const el = document.getElementById(elId);
  el.textContent = text;
  el.style.color = isError ? 'var(--danger)' : '#9a8362';
}

/* ---------------- Google sign-in ---------------- */
function initGoogleAuth(){
  if(typeof google === 'undefined' || !google.accounts){
    setStatus('signInStatus', 'Google sign-in script did not load — check your connection and reload.', true);
    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp) => {
      if(resp.error){
        // A silent attempt that fails is normal and must stay quiet: it just
        // means a tap is needed after all.
        if(silentAttemptInFlight){
          silentAttemptInFlight = false;
          setStatus('signInStatus', 'Tap to sign in.', false);
          return;
        }
        setStatus('signInStatus', 'Sign-in failed: ' + resp.error, true);
        return;
      }
      silentAttemptInFlight = false;
      accessToken = resp.access_token;
      saveToken(resp.access_token, resp.expires_in);
      setStatus('signInStatus', 'Signed in.', false);
      document.getElementById('folderCard').classList.remove('hidden');
      if(driveFolderId){
        document.getElementById('folderIdInput').value = driveFolderId;
        connectAndLoad();
      }
    },
    error_callback: () => {   // popup blocked or silent attempt declined
      silentAttemptInFlight = false;
      setStatus('signInStatus', 'Tap to sign in.', false);
    }
  });

  /* Straight back in, no tap: a stored token that is still good. */
  const stored = loadStoredToken();
  if(stored && driveFolderId){
    accessToken = stored;
    document.getElementById('folderIdInput').value = driveFolderId;
    connectAndLoad();
    return;
  }
  /* Otherwise try to get one WITHOUT any interaction before showing a button. */
  if(driveFolderId) requestTokenSilently();
}

let silentAttemptInFlight = false;
function requestTokenSilently(){
  if(!tokenClient) return false;
  silentAttemptInFlight = true;
  setStatus('signInStatus', 'Reconnecting…', false);
  try{ tokenClient.requestAccessToken({ prompt: '' }); return true; }
  catch(e){ silentAttemptInFlight = false; return false; }
}

document.getElementById('signInBtn').addEventListener('click', () => {
  if(!tokenClient){ setStatus('signInStatus', 'Still loading Google sign-in — try again in a moment.', true); return; }
  silentAttemptInFlight = false;
  tokenClient.requestAccessToken();
});
document.getElementById('saveFolderBtn').addEventListener('click', () => {
  const val = document.getElementById('folderIdInput').value.trim();
  if(!val){ setStatus('folderStatus', 'Paste your folder ID first.', true); return; }
  driveFolderId = val;
  localStorage.setItem('echoDental_driveFolderId', val);
  connectAndLoad();
});

/* ---------------- Drive REST helpers ---------------- */
/* A stored token can expire mid-session, and an expired token looks exactly
   like a permissions error (401/403) to the code below. Every Drive call
   goes through here so that case is handled ONCE: throw a marked error the
   loader recognises, rather than showing the person a bare status code for
   something that is really just "your hour is up". */
class TokenExpiredError extends Error {
  constructor(){ super('Session expired'); this.name = 'TokenExpiredError'; }
}
async function driveFetch(url, whatFailed){
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
  if(res.status === 401 || res.status === 403){
    clearStoredToken();
    throw new TokenExpiredError();
  }
  if(!res.ok) throw new Error(whatFailed + ' (' + res.status + ')');
  return res;
}
/* modifiedTime comes back in the same request as the id — one extra field,
   no extra round trip — and it is what tells us how old the CLINIC's data
   is, as opposed to how recently this phone fetched it. */
let lastFoundModifiedTime = null;
async function driveFindChild(parentId, name, isFolder){
  const mimeQ = isFolder ? " and mimeType='application/vnd.google-apps.folder'" : "";
  const q = encodeURIComponent(`'${parentId}' in parents and name='${name}'${mimeQ} and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)`,
                               'Drive lookup failed');
  const data = await res.json();
  const hit = data.files && data.files[0];
  lastFoundModifiedTime = hit ? (hit.modifiedTime || null) : null;
  return hit ? hit.id : null;
}
/* ONE listing instead of a lookup per file.

   Day files are named YYYY-MM-DD.json, so sorting by name descending is
   sorting by date descending: a single request returns the newest N days
   with their ids AND modifiedTimes. Everything that used to cost a
   round-trip-per-day now reads from this — today's file, the catch-up
   sweep, and the freshness footer.

   Before: the catch-up loop alone made 14 sequential requests (a lookup
   then a read, seven times) to fetch at most seven small files. On mobile
   data that was seconds of blur before anything was readable.

   Revalidated on the same rule as the money caches: the listing is how we
   learn that today's file changed, so it cannot be cached for the session. */
const DAY_LIST_SIZE = 40;
let dayListCache = null;          // { 'YYYY-MM-DD': {id, modifiedTime} }
let dayListOldest = null;         // the earliest date the listing covers
let dayListInFlight = null;
let dayListRevalidate = true;
/* One place to ask "where is this day's file?", listing first, lookup only
   for dates older than the listing reaches. */
async function driveReadJson(fileId){
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
                               'File read failed');
  return await res.json();
}

/* ---------------- Data loading ---------------- */
let cachedDataFolderId = null;
/* The settings folder was looked up separately by bills, entries and ortho —
   three identical round trips per refresh cycle, while the data folder next
   to it was cached. Folder ids do not change. */
let cachedSettingsFolderId = null;
async function getSettingsFolderId(){
  if(cachedSettingsFolderId) return cachedSettingsFolderId;
  cachedSettingsFolderId = await driveFindChild(driveFolderId, 'settings', true);
  return cachedSettingsFolderId;
}

function shortDateMobile(dateStr){
  const [y, m, d] = String(dateStr).split('-').map(Number);
  if(!y || !m || !d) return String(dateStr);
  return new Date(y, m - 1, d).toLocaleDateString('en-IN',
    { day:'2-digit', month:'short', year:'numeric' });
}
function rxIsStruck(rec){ return !!(rec && rec.struckAt); }
function rxDayLabel(rec){
  const d = String((rec && (rec.date || rec.createdAt)) || '').slice(0, 10);
  const [y, m, dd] = d.split('-').map(Number);
  if(!y || !m || !dd) return '\u2014';
  return new Date(y, m - 1, dd).toLocaleDateString('en-IN',
    { day:'2-digit', month:'short', year:'numeric' });
}
function rxWhat(rec){
  const said = String((rec && rec.treatment) || '').trim()
            || String((rec && rec.advice) || '').trim();
  if(said) return said;
  const meds = ((rec && rec.medicines) || []).map(m => m && m.name).filter(Boolean);
  if(meds.length) return meds.join(', ');
  return String((rec && rec.complaints) || '').trim() || 'Consultation';
}
function rxMedCount(rec){
  const n = ((rec && rec.medicines) || []).filter(m => m && m.name).length;
  return n ? (n + (n === 1 ? ' medicine' : ' medicines')) : 'no medicines';
}
function rxDayLabel(rec){
  const d = String((rec && (rec.date || rec.createdAt)) || '').slice(0, 10);
  const [y, m, dd] = d.split('-').map(Number);
  if(!y || !m || !dd) return '\u2014';
  return new Date(y, m - 1, dd).toLocaleDateString('en-IN',
    { day:'2-digit', month:'short', year:'numeric' });
}
function visitWasRemoved(v){ return !!(v && v.removedAt); }
/* A visit removed at the desk keeps its last status in the file — it is
   struck, not deleted — so the raw status of a removed visit still says what
   the patient was doing when somebody took them off the day. It must never
   be read as their state.

   And a day that is not today is CLOSED: by the next morning nobody is in a
   chair, so an unfinished visit is done, marked auto because nobody said so.
   Without this the phone showed last Tuesday's half-finished visit as still
   in the chair. visitDayIsOpen is one line on the desktop — the day is open
   if it is today — and is inlined here for the same reason. */
function effectiveVisitStatusM(v, dateStr){
  const raw = (v && v.status) || 'waiting';
  if(!v || v.removedAt) return { status: raw, auto: false };
  if(dateStr === todayStr()) return { status: raw, auto: false };
  if(raw === 'done') return { status: 'done', auto: false };
  return { status: 'done', auto: true };
}
/* THE STATE THE BORROWED LOADERS KEEP. These were declared elsewhere in the
   phone app and did not travel with the functions, so both loaders threw on
   their first line — and the throw was swallowed by their own catch, which
   is why it showed as empty data rather than an error. */
let directoryCache = null, directoryTried = false;
let rxIndexCache = null, rxIndexTried = false;
let cachedRxFolderId = null;

/* PUT BACK (v1.1). Stripping "unused" code from the borrowed layer took two
   functions that ARE used: loadSettingsMap, which loadPatientDirectory reads
   the patient names through, and driveListChildren, which loadPrescriptions
   uses to check the index against the folder. Without them every visit read
   "Unknown patient" and every prescription "waiting on the clinic PC" — the
   app looked broken in exactly the way a permissions problem looks, which is
   the wrong lesson to hand somebody on their first open. */
async function loadSettingsMap(fileName, state){
  try{
    const settingsId = await getSettingsFolderId();
    if(!settingsId) return {};
    const fileId = await driveFindChild(settingsId, fileName, false);
    if(!fileId) return {};
    const m = await driveReadJson(fileId);
    return (m && typeof m === 'object' && !Array.isArray(m)) ? m : {};
  }catch(err){
    if(err && err.name === 'TokenExpiredError') throw err;
    return {};
  }
}
async function driveListChildren(parentId){
  let files = [];
  let pageToken = null;
  do{
    const q = encodeURIComponent(`'${parentId}' in parents and trashed=false`);
    let url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=nextPageToken,files(id,name)&pageSize=1000`;
    if(pageToken) url += '&pageToken=' + pageToken;
    const res = await driveFetch(url, 'Drive listing failed');
    const data = await res.json();
    files = files.concat(data.files || []);
    pageToken = data.nextPageToken || null;
  } while(pageToken);
  return files;
}
/* The check that used to block the first paint. It compares what the index
   claims against what is on the folder, and only speaks up when they differ. */
/* ONCE A DAY, NOT EVERY OPEN (v1.5). This lists every prescription file the
   clinic has ever written — the single heaviest request the app makes. It
   guards against an index the desktop failed to update, which is rare; run
   it once in twelve hours rather than on every open, and the cost stops
   being paid for a fault that is usually not there. */
const CACHE_KEY_VERIFIED = 'echoLite_verified';
let rxVerifyDone = false;
async function verifyRxIndexLater(idx){
  if(rxVerifyDone) return;
  rxVerifyDone = true;
  const last = Number(localStorage.getItem(CACHE_KEY_VERIFIED) || 0);
  if(last && (Date.now() - last) < 12 * 60 * 60 * 1000) return;
  try{
    if(!cachedRxFolderId) cachedRxFolderId = await driveFindChild(driveFolderId, 'prescriptions', true);
    if(!cachedRxFolderId) return;
    const files = await driveListChildren(cachedRxFolderId);
    const onDisk = files.map(f => String(f.name || '').replace(/\.json$/, ''))
                        .filter(Boolean).map(x => 'rx:' + x).sort();
    const inIndex = (idx.keys || []).slice().sort();
    let same = onDisk.length === inIndex.length;
    if(same) for(let i = 0; i < onDisk.length; i++) if(onDisk[i] !== inIndex[i]){ same = false; break; }
    try{ localStorage.setItem(CACHE_KEY_VERIFIED, String(Date.now())); }catch(e){}
    if(same) return;
    /* The index is behind the folder: say so rather than show a record that
       may be missing someone's latest prescription. */
    rxIndexCache = null;
    repaint();
  }catch(err){ /* a failed check leaves what was already shown alone */ }
}
/* AGE AND SEX (v2.0). They live in patient-contacts.json beside the names —
   one more small file from settings/, kept on the device like the rest, so
   the cost is one read on a cold start and nothing afterwards.

   The file also holds phone numbers. They are not read here and not shown:
   this app answers "who is this and what have they had", and a number on
   screen turns it into something else. */
let contactsCache = null, contactsTried = false;
const CACHE_KEY_CON = 'echoLite_con';
async function loadPatientContacts(){
  if(contactsTried) return contactsCache;
  contactsTried = true;
  const held = cacheRead(CACHE_KEY_CON);
  if(held && Object.keys(held).length){ contactsCache = held; scheduleRefreshBehind(); return contactsCache; }
  contactsCache = await loadSettingsMap('patient-contacts.json');
  if(contactsCache && Object.keys(contactsCache).length) cacheWrite(CACHE_KEY_CON, contactsCache);
  return contactsCache;
}
/* An age recorded years ago is not today's age, so the year it was taken is
   said rather than quietly adding the difference — the desk does the same. */
function ageTextOf(contacts, patientId){
  const rec = contacts && contacts[String(patientId)];
  if(!rec || rec.age === undefined || rec.age === null || rec.age === '') return '';
  const yr = rec.ageRecordedOn ? String(rec.ageRecordedOn).slice(0, 4) : '';
  const thisYear = todayStr().slice(0, 4);
  if(!yr || yr === thisYear) return String(rec.age);
  return rec.age + ' (' + yr + ')';
}
function sexTextOf(contacts, patientId){
  const rec = contacts && contacts[String(patientId)];
  const v = rec && rec.sex ? String(rec.sex).trim() : '';
  if(!v) return '';
  const c = v[0].toUpperCase();
  return (c === 'M' || c === 'F') ? c : v;
}
function whoLine(contacts, patientId){
  const a = ageTextOf(contacts, patientId), x = sexTextOf(contacts, patientId);
  return [x, a].filter(Boolean).join(' \u00b7 ');
}
async function loadPatientDirectory(){
  if(directoryTried) return directoryCache;
  directoryTried = true;
  const held = cachedDirectory();
  if(held && Object.keys(held).length){
    /* Answer from the device now; the wire catches up behind. */
    directoryCache = held;
    scheduleRefreshBehind();
    return directoryCache;
  }
  directoryCache = await loadSettingsMap('patients.json');
  if(directoryCache && Object.keys(directoryCache).length) cacheWrite(CACHE_KEY_DIR, directoryCache);
  return directoryCache;
}
async function loadPrescriptions(){
  if(rxIndexTried) return rxIndexCache;
  rxIndexTried = true;
  const heldRx = cachedRxIndex();
  if(heldRx && heldRx.length){
    rxIndexCache = heldRx;
    scheduleRefreshBehind();
    return rxIndexCache;
  }
  try{
    const settingsId = await getSettingsFolderId();
    if(!settingsId) return (rxIndexCache = null);
    const fileId = await driveFindChild(settingsId, 'prescriptions-index.json', false);
    if(!fileId) return (rxIndexCache = null);
    const idx = await driveReadJson(fileId);
    if(!idx || !Array.isArray(idx.list) || !Array.isArray(idx.keys)) return (rxIndexCache = null);
    /* USE IT NOW, CHECK IT AFTER (v1.3). The index was verified against the
       prescriptions folder before a single record was shown — a listing of
       every prescription file the clinic has ever written, on the critical
       path, every cold start. The index is used immediately and the check
       runs behind it; if the folder turns out to disagree, the index is
       dropped and the page repaints. Correct either way, but only slow in
       the rare case where it was actually wrong. */
    rxIndexCache = idx.list;
    cacheWrite(CACHE_KEY_RX, idx.list);
    verifyRxIndexLater(idx);
  }catch(err){
    if(err && err.name === 'TokenExpiredError') throw err;
    rxIndexCache = null;
  }
  return rxIndexCache;
}

/* ==========================================================================
   ECHO DENTAL — LITE. A second, read-only app for reception, staff and an
   associate doctor. Two pages and nothing else:

     VISITS    who was marked as visited today, and the prescription written
               for each — the full record, as the desk shows it.
     PATIENTS  a name, and every prescription ever recorded for that person,
               newest first, each with its age in words.

   It carries no money, no lab, no stock and no dashboard, because the people
   who read it have no reason to see any of that. And it writes nothing: the
   Drive scope is drive.readonly, so there is no path from this app back to
   the clinic's files even if one were coded by mistake.
   ========================================================================== */
/* The build, on screen. When somebody says it is behaving oddly, the first
   question is which copy they are holding — a phone can sit on a cached one
   for days. */
const LITE_VERSION = 'v2.3';
let currentTab = 'visits';
let openRx = null;
/* Which patient, if any, has had their older prescriptions unfolded. */
let openAllFor = null;
/* Which prescription inside the open card is expanded. null means "the
   newest one", which is what a freshly opened card shows. */
let openLine = null;
function showAllFor(pid){ openAllFor = String(pid); repaint(); }
function toggleLine(k){ openLine = (openLine === k) ? '' : k; repaint(); }

/* WHOSE APP THIS IS. The name is kept on the device, so the same file greets
   whoever is holding it — the associate by name, reception by theirs. Tapping
   the greeting sets it; until then it says "Doctor", which is true of the
   person it was built for and harmless for anyone else. */
const CACHE_KEY_NAME = 'echoLite_name';
function greetingWord(){
  const h = new Date().getHours();
  if(h < 12) return 'Good morning,';
  if(h < 17) return 'Good afternoon,';
  return 'Good evening,';
}
function paintGreeting(){
  const g = document.getElementById('hdGreet'), n = document.getElementById('hdWho');
  if(g) g.textContent = greetingWord();
  if(n) n.textContent = (localStorage.getItem(CACHE_KEY_NAME) || 'Doctor');
}
function askName(){
  const now = localStorage.getItem(CACHE_KEY_NAME) || '';
  const v = window.prompt('Name to greet you by', now);
  if(v === null) return;                       // cancelled: leave it alone
  const clean = String(v).trim().slice(0, 28);
  try{
    if(clean) localStorage.setItem(CACHE_KEY_NAME, clean);
    else localStorage.removeItem(CACHE_KEY_NAME);
  }catch(e){}
  paintGreeting();
}

/* PULL TO REFRESH (v2.2). The refresh button is gone, so the gesture has to
   do what it did: clear what the device holds and read Drive again. The
   browser's own pull would reload the page and keep the cache, which is the
   opposite of what somebody pulling down wants.

   It arms only at the very top of the page, so a pull halfway down a long
   list scrolls as normal. */
let pullStartY = null, pullDist = 0, pullArmed = false, pullBusy = false;
const PULL_TRIGGER = 70;
function pullSetText(t){ const el = document.getElementById('pullText'); if(el) el.textContent = t; }
function pullShow(px){
  const cue = document.getElementById('pullCue');
  if(!cue) return;
  cue.style.height = Math.min(px, 64) + 'px';
  cue.style.opacity = Math.min(px / PULL_TRIGGER, 1);
}
function pullReset(){
  pullStartY = null; pullDist = 0; pullArmed = false; pullBusy = false;
  const cue = document.getElementById('pullCue');
  if(cue){ cue.style.height = '0px'; cue.style.opacity = '0'; }
  pullSetText('Pull to refresh');
}
function wirePull(){
  document.addEventListener('touchstart', e => {
    if(pullBusy || window.scrollY > 0 || !e.touches || e.touches.length !== 1) return;
    pullStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if(pullStartY === null || pullBusy) return;
    pullDist = e.touches[0].clientY - pullStartY;
    if(pullDist <= 0){ pullReset(); return; }
    pullShow(pullDist * 0.5);
    const armed = pullDist > PULL_TRIGGER;
    if(armed !== pullArmed){ pullArmed = armed; pullSetText(armed ? 'Release to refresh' : 'Pull to refresh'); }
  }, { passive: true });
  document.addEventListener('touchend', () => {
    if(pullStartY === null || pullBusy) return;
    if(!pullArmed){ pullReset(); return; }
    pullBusy = true; pullSetText('Reading\u2026');
    doRefresh().then(pullReset).catch(pullReset);
  }, { passive: true });
}
/* Exactly what the button did: drop every layer the device holds, then read. */
async function doRefresh(){
  directoryCache = null; directoryTried = false;
  rxIndexCache = null; rxIndexTried = false;
  cachedRxFolderId = null; cachedSettingsFolderId = null;
  contactsCache = null; contactsTried = false;
  rxVerifyDone = false; refreshScheduled = false;
  openRx = null; selectedPatient = null; openLine = null; openAllFor = null;
  cacheClear(); forgetIds();
  setTab(currentTab);
  await new Promise(r => setTimeout(r, 400));
}
function setTab(t){
  /* Coming back to Patients starts at the search again: a name left open
     from an hour ago is not what the next question is about. */
  if(t !== currentTab && t === 'patients'){ selectedPatient = null; }
  currentTab = t;
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.classList.toggle('active', b.getAttribute('data-tab') === t));
  document.getElementById('viewVisits').classList.toggle('hidden', t !== 'visits');
  document.getElementById('viewPatients').classList.toggle('hidden', t !== 'patients');
  closeRx();
  if(t === 'visits') renderVisits();
}

/* HOW LONG AGO, in the words a person would use. The desktop says "2 days
   ago" and "3 months ago" rather than a date nobody subtracts in their head;
   this says the same, with the date underneath for anyone who wants it. */
function agoWords(dateStr){
  const d = String(dateStr || '').slice(0, 10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return '';
  const [y, m, dd] = d.split('-').map(Number);
  const then = new Date(y, m - 1, dd), now = new Date();
  const days = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - then) / 86400000);
  if(days < 0) return 'later today';
  if(days === 0) return 'today';
  if(days === 1) return 'yesterday';
  if(days < 7) return days + ' days ago';
  if(days < 14) return 'last week';
  if(days < 31) return Math.floor(days / 7) + ' weeks ago';
  const months = Math.round(days / 30.4);
  if(months < 12) return months + (months === 1 ? ' month ago' : ' months ago');
  const years = Math.floor(days / 365);
  const rem = Math.round((days - years * 365) / 30.4);
  return years + (years === 1 ? ' year' : ' years') + (rem ? ' ' + rem + 'm' : '') + ' ago';
}

/* One cache, not two. This used to keep its own copy on top of the loader's,
   so Refresh cleared the outer one and got the stale inner one back. */
async function getRxIndex(){
  try{ return await loadPrescriptions(); }
  catch(err){
    if(err && err.name === 'TokenExpiredError') throw err;
    return null;
  }
}
/* WHAT THE PHONE KEEPS (v1.4). Every open re-read the whole patient
   directory and prescriptions index before showing anything, over whatever
   signal the phone had. Both are now kept on the device: the page paints
   from what is already there and re-reads behind it, so a second open is
   immediate and a slow signal delays only the update, not the answer.

   Kept deliberately small in consequence: nothing is written that was not
   already on screen, and Refresh still clears it. If the browser refuses the
   write — the index can be large and storage is capped — the app carries on
   reading over the wire, which is exactly what it did before. */
const CACHE_KEY_DIR = 'echoLite_dir', CACHE_KEY_RX = 'echoLite_rx', CACHE_KEY_AT = 'echoLite_at';
function cacheRead(key){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function cacheWrite(key, value){
  try{
    localStorage.setItem(key, JSON.stringify(value));
    localStorage.setItem(CACHE_KEY_AT, String(Date.now()));
    return true;
  }catch(e){
    /* Out of room: drop the big one and keep the small one rather than lose
       both. Names alone still spare the slowest read on the search page. */
    try{ localStorage.removeItem(CACHE_KEY_RX); }catch(e2){}
    return false;
  }
}
function cacheClear(){
  [CACHE_KEY_DIR, CACHE_KEY_RX, CACHE_KEY_AT, CACHE_KEY_CON, 'echoLite_verified']
    .forEach(k => { try{ localStorage.removeItem(k); }catch(e){} });
  /* And every day that was kept, or Refresh could not correct one. */
  try{
    const doomed = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('echoLite_day_') === 0) doomed.push(k);
    }
    doomed.forEach(k => localStorage.removeItem(k));
  }catch(e){}
}
async function getDirectory(){
  try{ return (await loadPatientDirectory()) || {}; }catch(e){ return {}; }
}

/* EVERY LOOKUP, REMEMBERED (v1.5). A Drive id never changes, but the app was
   asking for the same ones on every open: which folder is 'settings', which
   file is 'patients.json', which is today's day file. Each question is a
   round trip. They are resolved once and kept on the device, so a second
   open spends its network on the data itself rather than on finding it
   again. An id that has gone stale simply fails to read, and the entry is
   dropped and asked for afresh. */
const CACHE_KEY_IDS = 'echoLite_ids';
let idMap = cacheRead(CACHE_KEY_IDS) || {};
let idInFlight = {};
const _findChildDirect = driveFindChild;
driveFindChild = async function(parentId, name, isFolder){
  if(!parentId) return null;
  const key = parentId + '/' + name;
  if(idMap[key]) return idMap[key];
  /* Two callers wanting the same folder at the same moment asked twice; they
     now share the one request. */
  if(idInFlight[key]) return idInFlight[key];
  idInFlight[key] = (async () => {
    const id = await _findChildDirect(parentId, name, isFolder);
    if(id){ idMap[key] = id; cacheWrite(CACHE_KEY_IDS, idMap); }
    delete idInFlight[key];
    return id;
  })();
  return idInFlight[key];
};
function forgetIds(){ idMap = {}; idInFlight = {}; try{ localStorage.removeItem(CACHE_KEY_IDS); }catch(e){} }
/* The cached pair, if the device has them. Used to paint; never trusted as
   the last word — a re-read always follows. */
function cachedDirectory(){ return cacheRead(CACHE_KEY_DIR); }
function cachedRxIndex(){ return cacheRead(CACHE_KEY_RX); }
/* Both loaders ask for the catch-up read; it should happen once a session,
   not once per loader. */
let refreshScheduled = false;
function scheduleRefreshBehind(){
  if(refreshScheduled) return;
  refreshScheduled = true;
  setTimeout(refreshBehind, 0);
}
let refreshingInBackground = false;
/* Straight to Drive, deliberately NOT through the loaders above — they would
   hand back the very cache this exists to replace. Only a real difference
   repaints, so a background check on unchanged data is invisible. */
async function refreshBehind(){
  if(refreshingInBackground) return;
  refreshingInBackground = true;
  try{
    const settingsId = await getSettingsFolderId();
    if(!settingsId) return;
    let changed = false;

    const dirId = await driveFindChild(settingsId, 'patients.json', false);
    if(dirId){
      const dir = await driveReadJson(dirId);
      if(dir && typeof dir === 'object' && Object.keys(dir).length
         && JSON.stringify(dir) !== JSON.stringify(cachedDirectory())){
        directoryCache = dir; cacheWrite(CACHE_KEY_DIR, dir); changed = true;
      }
    }

    const conId = await driveFindChild(settingsId, 'patient-contacts.json', false);
    if(conId){
      const con = await driveReadJson(conId);
      if(con && typeof con === 'object' && Object.keys(con).length
         && JSON.stringify(con) !== JSON.stringify(cacheRead(CACHE_KEY_CON))){
        contactsCache = con; cacheWrite(CACHE_KEY_CON, con); changed = true;
      }
    }

    const rxId = await driveFindChild(settingsId, 'prescriptions-index.json', false);
    if(rxId){
      const idx = await driveReadJson(rxId);
      if(idx && Array.isArray(idx.list)){
        const held = cachedRxIndex();
        if(!held || held.length !== idx.list.length
           || JSON.stringify(held[0] || null) !== JSON.stringify(idx.list[0] || null)){
          rxIndexCache = idx.list; cacheWrite(CACHE_KEY_RX, idx.list); changed = true;
        }
        verifyRxIndexLater(idx);
      }
    }
    if(changed) repaint();
  }catch(e){ /* offline or expired: what is on screen stays */ }
  finally{ refreshingInBackground = false; }
}
function rxFor(all, patientId){
  const byDate = (a, b) => String(b.date || b.createdAt || '').localeCompare(String(a.date || a.createdAt || ''));
  return (all || [])
    .filter(r => r && String(r.patientId) === String(patientId))
    /* Struck ones sink rather than vanish — the desk strikes, it does not
       erase, and a reader who cannot see the correction cannot trust it. */
    .sort((a, b) => (rxIsStruck(a) ? 1 : 0) - (rxIsStruck(b) ? 1 : 0) || byDate(a, b));
}

/* THE WHOLE PRESCRIPTION, opened where it was tapped rather than in a sheet
   that covers the list: on a phone the thing you were reading should still
   be on screen when you close what you opened. */
/* The contents of one prescription, with no box of its own — the card it
   sits in provides that. */
function rxDetailHtml(rec){
  const row = (k, v) => v ? '<div class="rxs-k">' + k + '</div><div class="rxs-v">' + escapeHtml(v) + '</div>' : '';
  const meds = ((rec.medicines) || []).filter(m => m && m.name);
  return '<div class="rx-detail">'
    + (rxIsStruck(rec) ? '<div class="muted" style="font-size:0.8rem;">Struck'
        + (rec.struckReason ? ' \u00b7 ' + escapeHtml(rec.struckReason) : '') + '</div>' : '')
    + row('Complaints', rec.complaints)
    + row('Investigations', rec.investigations)
    + row('Treatment', rec.treatment)
    + (meds.length
        ? '<div class="rxs-k">Medicines</div>' + meds.map(m =>
            '<div class="rxs-med">' + escapeHtml(m.name)
            + '<div class="rxs-dose">'
            + escapeHtml([m.dose, m.duration, m.food ? m.food + ' food' : ''].filter(Boolean).join(' \u00b7 ') || '\u2014')
            + '</div></div>').join('')
        : '')
    + row('Advice', rec.advice)
    + (!meds.length && !rec.treatment && !rec.advice && !rec.complaints && !rec.investigations
        ? '<div class="muted" style="font-size:0.86rem;">Nothing was written on this one.</div>' : '')
    + '</div>';
}
/* The Patients page still shows one prescription at a time in its own box. */
function rxSheetHtml(rec, key){
  return '<div class="rx-sheet">' + rxDetailHtml(rec)
    + '<button type="button" class="rxs-close" onclick="closeRx()">Close</button></div>';
}
function toggleRx(key){
  openRx = (openRx === key) ? null : key;
  openAllFor = null;          // closing a patient folds their history again
  openLine = null;            // and the next one opens on its newest again
  repaint();
}
function closeRx(){ openRx = null; repaint(); }
function repaint(){ if(currentTab === 'visits') renderVisits(); else renderPatients(); }

/* ---------------------------- VISITS ------------------------------------ */
/* WHICH DAY IS BEING READ. Today when the app opens; the arrows walk back a
   day at a time and the picker jumps. Never forward of today, because there
   are no visits in the future and a blank page is a worse answer than a
   control that will not go there. */
let viewDay = todayStr();
function stepDay(delta){
  const [y, m, d] = viewDay.split('-').map(Number);
  const dt = new Date(y, m - 1, d + delta);
  const cand = dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0')
             + '-' + String(dt.getDate()).padStart(2,'0');
  if(cand > todayStr()) return;
  viewDay = cand; openRx = null; renderVisits();
}
function pickDay(v){
  const d = String(v || '');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d) || d > todayStr()){
    const el = document.getElementById('dayPicker'); if(el) el.value = viewDay;
    return;
  }
  viewDay = d; openRx = null; renderVisits();
}
async function renderVisits(){
  const list = document.getElementById('visitList');
  const today = viewDay;
  const isToday = today === todayStr();
  document.getElementById('visitDate').textContent =
    shortDateMobile(today) + (isToday ? ' \u00b7 Today' : '');
  const pick = document.getElementById('dayPicker');
  if(pick){ pick.value = today; pick.max = todayStr(); }
  const nextBtn = document.getElementById('nextDayBtn');
  if(nextBtn) nextBtn.style.visibility = isToday ? 'hidden' : 'visible';
  /* The names and the day are independent reads, so they go together rather
     than one after the other: on a phone connection the two round trips were
     costing twice what they needed to. */
  /* The names and the index may already be on the device from last time; the
     day itself is always read, because that is what changed. */
  const dirPromise = getDirectory();
  const rxPromise = getRxIndex();
  const conPromise = loadPatientContacts().catch(() => null);
  /* A DAY THAT IS OVER CANNOT CHANGE. Yesterday's arrivals are read once and
     kept; only today is re-read, because only today is still happening. */
  const dayKey = 'echoLite_day_' + today;
  let rows = null;
  if(!isToday){
    const held = cacheRead(dayKey);
    if(Array.isArray(held)) rows = held;
  }
  if(rows === null){
    rows = [];
    try{
      const folder = await driveFindChild(driveFolderId, 'visits', true);
      if(folder){
        const fid = await driveFindChild(folder, today + '.json', false);
        if(fid){
          const l = await driveReadJson(fid);
          rows = Array.isArray(l) ? l : [];
          if(!isToday) cacheWrite(dayKey, rows);
        }
      }
    }catch(err){
      if(err && err.name === 'TokenExpiredError') throw err;
      rows = [];
    }
  }
  /* A struck visit is not an arrival. It is dropped here rather than shown
     greyed: this app is a list of who to see, and a cancelled arrival is not
     one of them. */
  rows = rows.filter(v => v && !visitWasRemoved(v));
  const [dir, all, contacts] = await Promise.all([dirPromise, rxPromise, conPromise]);
  document.getElementById('visitCount').textContent = String(rows.length);
  if(!rows.length){
    list.innerHTML = '<div class="empty-state">' + (isToday ? 'Nobody yet today' : 'Nobody came') + '</div>';
    return;
  }
  /* NEWEST FIRST (v1.6). The last person through the door is the one being
     asked about; the morning's arrivals are history by the evening. */
  rows.sort((a, b) => String(b.arrivedAt || '').localeCompare(String(a.arrivedAt || '')));
  /* NUMBERED (v1.8). The desk counts arrivals from the first of the day, so
     the phone counts the same way: newest first on screen, but the number is
     the order they came, which is the number the desk will say out loud. */
  const total = rows.length;
  list.innerHTML = rows.map((v, idx) => {
    const srNo = total - idx;
    const pid = String(v.patientId);
    const name = (dir && dir[pid]) || v.patientName || 'Unknown patient';
    const t = v.arrivedAt ? new Date(v.arrivedAt) : null;
    const stamp = (t && !isNaN(t.getTime()))
      ? t.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' }) : '';
    /* EVERY prescription this patient has, newest first — not only the one
       written on the day being viewed. Somebody in the chair is asked about
       in the light of what came before, and three is what fits on a phone
       without scrolling past the next patient. The rest are one tap away. */
    const mine = all === null ? [] : rxFor(all, pid);
    const onDay = mine.filter(r => String(r.date || '').slice(0, 10) === today);
    /* Everything written before the day being viewed — what "last seen"
       actually means. */
    const before = mine.filter(r => String(r.date || '').slice(0, 10) < today);
    const key = 'v:' + pid;
    const open = openRx === key && mine.length;
    const showAll = openAllFor === pid;
    const shown = showAll ? mine : mine.slice(0, 3);
    const hidden = mine.length - shown.length;
    /* ONE CARD PER PATIENT (v1.7). Each prescription used to be its own box,
       so an opened patient became a stack of loose panels and you could not
       see where one person ended and the next began. Everything about a
       person now sits inside their card, and the card is what opens.

       Inside it: the newest prescription OPEN, because that is the one being
       asked about; the two before it as closed lines you can tap; anything
       older folded behind a single count. */
    let body = '';
    if(open){
      body = '<div class="pt-body">' + shown.map((r, i) => {
        const rkey = key + ':' + i;
        /* The newest starts open. After that the reader decides. */
        const isOpen = (openLine === null) ? (i === 0) : (openLine === rkey);
        /* A PRESCRIPTION IS A RECORD, NOT A LINE (v1.8). It now carries the
           ℞ mark, its own date, how long ago, and how many medicines — so a
           closed one still says what it is, and an open one is plainly a
           document rather than an indented paragraph. */
        return '<div class="rx-line' + (isOpen ? ' rx-line-open' : '') + (rxIsStruck(r) ? ' struck' : '') + '">'
          + '<div class="rx-line-head" onclick="event.stopPropagation(); toggleLine(\'' + rkey + '\')">'
            + '<span class="rx-mark">\u211e</span>'
            + '<span class="rx-line-main">'
              + '<span class="rx-line-what">' + escapeHtml(rxWhat(r)) + '</span>'
              + '<span class="rx-line-meta">' + escapeHtml(rxDayLabel(r))
                + ' \u00b7 ' + escapeHtml(agoWords(r.date || r.createdAt))
                + ' \u00b7 ' + escapeHtml(rxMedCount(r))
                + (rxIsStruck(r) ? ' \u00b7 struck' : '') + '</span>'
            + '</span>'
            + '<span class="rx-chev">' + (isOpen ? '\u2013' : '+') + '</span>'
          + '</div>'
          + (isOpen ? rxDetailHtml(r) : '')
          + '</div>';
      }).join('')
      + (hidden > 0
          ? '<button type="button" class="pt-more" onclick="event.stopPropagation(); showAllFor('
            + JSON.stringify(pid).replace(/"/g,'&quot;') + ')">' + hidden + ' older</button>'
          : '')
      + '</div>';
    }
    /* THE RIGHT COLUMN EARNS ITS KEEP (v2.1). The time sat alone in the top
       corner with the whole column empty beneath it, while the two figures
       ran along the bottom. Time, last seen and the record count now stack
       down that column — the card is shorter and nothing is blank.

       Age and sex join the name as "(57/F)", where they read as part of who
       the person is rather than as another field on the ID line.

       "Last seen" is the newest prescription BEFORE the day being viewed —
       not the newest overall, or somebody prescribed for an hour ago would
       read as last seen today, which answers nothing. */
    const who = whoLine(contacts, pid);
    const lastSeen = before.length
      ? escapeHtml(agoWords(before[0].date || before[0].createdAt).replace(' ago', '')) : '\u2014';
    return '<div class="pt-card' + (open ? ' pt-open' : '') + (mine.length ? ' tappable' : '') + '"'
        + (mine.length ? ' onclick="toggleRx(\'' + key + '\')"' : '') + '>'
      + '<div class="pt-top">'
        + '<span class="pt-no">' + srNo + '</span>'
        + '<div class="pt-main">'
          + '<div class="pt-name">' + escapeHtml(name)
            + (who ? ' <span class="pt-who">(' + escapeHtml(who) + ')</span>' : '') + '</div>'
          + '<div class="pt-sub">' + escapeHtml(pid)
            + (v.cameFor ? ' \u00b7 ' + escapeHtml(v.cameFor) : '') + '</div>'
          + (all === null
              ? '<div class="pt-tag pt-tag-wait">waiting on the clinic PC</div>'
              : (onDay.length ? '<div class="pt-tag pt-tag-today">' + escapeHtml(rxWhat(onDay[0])) + '</div>' : ''))
        + '</div>'
        + '<div class="pt-side">'
          + '<div class="pt-time">' + escapeHtml(stamp) + '</div>'
          + (all === null ? ''
              : '<div class="pt-f"><b>' + lastSeen + '</b><span>last seen</span></div>'
                + '<div class="pt-f"><b>' + mine.length + ' \u211e</b><span>on record</span></div>')
        + '</div>'
      + '</div>'
      + body
      + '</div>';
  }).join('');
}

/* ---------------------------- PATIENTS ----------------------------------
   TWO STEPS, NOT ONE (v1.2). The search used to answer with every
   prescription of every match at once: on a common first name that is forty
   people and hundreds of rows, built on every keystroke, and it needed the
   whole prescriptions index before it could draw anything. Now the search
   answers with NAMES — which cost only the patient directory — and the
   prescriptions are read when one name is tapped. */
let patientQuery = '';
let selectedPatient = null;
let searchTimer = null;

function onSearch(v){
  patientQuery = String(v || '').trim();
  selectedPatient = null; openRx = null;
  /* A phone keyboard fires faster than a render; without this the list is
     rebuilt for every letter of a name and the typing itself stutters. */
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderPatients, 180);
}
function openPatient(pid){ selectedPatient = String(pid); openRx = null; renderPatients(); }
function backToSearch(){ selectedPatient = null; openRx = null; renderPatients(); }

async function renderPatients(){
  const list = document.getElementById('patientList');
  const dir = await getDirectory();

  /* ---- one patient, opened ---- */
  if(selectedPatient){
    const pid = selectedPatient;
    list.innerHTML = '<div class="spin">Reading&hellip;</div>';
    const all = await getRxIndex();
    if(selectedPatient !== pid) return;          // they tapped Back meanwhile
    if(all === null){ list.innerHTML = '<div class="empty-state">Waiting on the clinic PC</div>'; return; }
    const mine = rxFor(all, pid);
    const con = await loadPatientContacts().catch(() => null);
    const who = whoLine(con, pid);
    let h = '<button type="button" class="btn ghost" onclick="backToSearch()" style="margin:4px 0 14px;">&lsaquo; Back</button>'
      + '<div class="sec-head"><span class="sec-title">' + escapeHtml(dir[pid] || 'Unknown patient')
      + ' <span class="muted">' + escapeHtml(String(pid)) + (who ? ' \u00b7 ' + escapeHtml(who) : '') + '</span></span>'
      + '<span class="count-badge">' + mine.length + '</span></div>';
    if(!mine.length){ list.innerHTML = h + '<div class="empty-state">No prescriptions</div>'; return; }
    h += mine.map((r, i) => {
      const key = 'p:' + pid + ':' + i;
      const open = openRx === key;
      return '<div class="row tappable' + (rxIsStruck(r) ? ' struck' : '') + '"'
          + ' onclick="toggleRx(\'' + key + '\')">'
        + '<div class="row-head"><div class="row-name">' + escapeHtml(rxWhat(r)) + '</div>'
          + '<div class="row-when">' + escapeHtml(agoWords(r.date || r.createdAt)) + '</div></div>'
        + '<div class="row-sub">' + escapeHtml(rxDayLabel(r)) + ' \u00b7 ' + escapeHtml(rxMedCount(r))
          + (rxIsStruck(r) ? ' \u00b7 struck' : '') + '</div>'
        + '</div>'
        + (open ? rxSheetHtml(r, key) : '');
    }).join('');
    list.innerHTML = h;
    return;
  }

  /* ---- the search: names only ---- */
  const q = patientQuery.toLowerCase();
  if(q.length < 2){
    list.innerHTML = '<div class="empty-state">Type a name or an ID</div>';
    return;
  }
  /* Already on the device after the first open, so this costs nothing. */
  const searchContacts = contactsCache || cacheRead(CACHE_KEY_CON);
  const ids = Object.keys(dir || {});
  const hits = ids
    .filter(pid => String(dir[pid] || '').toLowerCase().includes(q) || String(pid).toLowerCase().includes(q))
    /* Names that START with what was typed are what people mean; the rest
       follow. */
    .sort((a, b) => {
      const na = String(dir[a]||'').toLowerCase(), nb = String(dir[b]||'').toLowerCase();
      const sa = na.startsWith(q) ? 0 : 1, sb = nb.startsWith(q) ? 0 : 1;
      return sa - sb || na.localeCompare(nb);
    });
  if(!hits.length){ list.innerHTML = '<div class="empty-state">No one by that name</div>'; return; }
  const shown = hits.slice(0, 30);
  list.innerHTML = shown.map(pid =>
      '<div class="row tappable" onclick="openPatient(' + JSON.stringify(String(pid)).replace(/"/g,'&quot;') + ')">'
    + '<div class="row-head"><div class="row-name">' + escapeHtml(dir[pid] || 'Unknown patient') + '</div>'
      + '<div class="row-when">&rsaquo;</div></div>'
    + '<div class="row-sub">' + escapeHtml(String(pid))
      + (whoLine(searchContacts, pid) ? ' \u00b7 ' + escapeHtml(whoLine(searchContacts, pid)) : '') + '</div>'
    + '</div>').join('')
    + (hits.length > shown.length
        ? '<div class="empty-state">' + (hits.length - shown.length) + ' more \u2014 type a little further</div>'
        : '');
}

/* ---- boot ---------------------------------------------------------------
   The same two gates as the main phone app: a Google token, and a folder id.
   Once both are in hand the two pages are readable; nothing else is fetched
   until a tab asks for it. */
let booted = false;
function showApp(){
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
}
function showSetup(){
  document.getElementById('setupScreen').classList.remove('hidden');
  document.getElementById('appScreen').classList.add('hidden');
}
async function connectAndLoad(){
  if(!accessToken || !driveFolderId){ showSetup(); return; }
  showApp();
  if(!booted){ booted = true; setTab(currentTab); }
  else setTab(currentTab);
}
window.addEventListener('load', () => {
  const ver = document.getElementById('appVer');
  if(ver) ver.textContent = LITE_VERSION;
  paintGreeting();
  wirePull();
  const saved = localStorage.getItem('echoDental_driveFolderId') || '';
  if(saved){ driveFolderId = saved; const el = document.getElementById('folderIdInput'); if(el) el.value = saved; }
  initGoogleAuth();
  if(loadStoredToken() && driveFolderId) connectAndLoad();
  else if(driveFolderId) requestTokenSilently();
});

/* The button is gone; the gesture does its work. */

</script></body></html>
