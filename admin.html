<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Echo Nexus Admin</title>
<link rel="manifest" href="admin.webmanifest">
<meta name="theme-color" content="#FDFAF3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Echo Admin">
<link rel="apple-touch-icon" href="icon-192.png"><style>:root{
    --gold-deep:#8A5F26;
    --gold:#AF7933;
    --muted:#8a7a63;
    --shadow: 0 8px 24px rgba(74,59,40,0.10);
    --radius: 14px;
    --gold-light:#D7B47B;
    --gold-pale:#F3E6CE;
    --brown:#4A3B28;
    --ink:#2E2419;
    --cream:#FBF7EF;
    --white:#FFFFFF;
    --success:#3E7D5A;
    --success-bg:#E4F1E9;
    --danger:#B14A3D;
    --danger-bg:#FBEAE6;
    --line:#E7DCC5;
  }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; background:var(--cream); color:var(--brown);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
body{ padding-bottom:28px; }
.wrap{ max-width:760px; margin:0 auto; padding:0 14px 24px; }
.topbar{ position:sticky; top:0; z-index:20; border-bottom:1px solid var(--line);
  padding:12px 14px 0;
  /* One static gradient and one inset edge, both painted once and never
     animated. Colour where the eye starts, without a band of it competing
     with the gold that carries meaning further down the page. */
  background:linear-gradient(180deg, #FFFFFF 0%, #FBF3E4 100%);
  box-shadow:inset 0 3px 0 var(--gold); }
.hd-row{ display:flex; align-items:center; gap:12px; }
/* Both ends take equal share, so what sits between them lands in the middle
   however long the name or the clinic line runs. */
.hd-hello{ flex:1; cursor:pointer; }
.hd-logo{ flex:none; display:block; width:26px; height:26px; border-radius:6px; }
.hd-greet{ font-size:0.78rem; color:var(--muted); }
.hd-who{ font-size:1.12rem; font-weight:700; color:var(--ink); margin-top:1px; }
.hd-mark{ flex:1; text-align:right; white-space:nowrap; }
.hd-title{ font-size:0.92rem; font-weight:700; color:var(--gold-deep); }
.hd-v{ font-size:0.62rem; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted);
  font-weight:500; margin-top:3px; }
.hd-v b{ background:var(--gold-pale); color:var(--gold-deep); border-radius:5px; padding:0 5px; }
/* The pull cue takes no room at rest. */
.signin-bar{ margin:10px 14px 0; padding:9px 12px; border-radius:10px; cursor:pointer;
  background:var(--gold-pale); border:1px solid var(--gold-light); color:var(--gold-deep);
  font-size:0.8rem; text-align:center; }
.signin-bar:active{ background:var(--gold-light); }
.pull-cue{ height:0; opacity:0; overflow:hidden; display:flex; align-items:center; justify-content:center;
  font-size:0.74rem; letter-spacing:0.05em; color:var(--gold-deep); font-weight:600; }
.tabbar{ display:flex; gap:6px; margin-top:10px; }
.tab-btn{ flex:1; border:0; background:transparent; font-family:inherit; font-weight:600;
  font-size:0.82rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted);
  padding:10px 6px; border-bottom:2px solid transparent; cursor:pointer; }
/* (a transition for .tab-btn was declared twice; the later one wins, so the
   first was only weight) */
.tab-btn.active{ color:var(--gold-deep); border-bottom-color:var(--gold-deep); }
/* Every tappable thing answers the finger. A phone gives no other
   confirmation that a tap landed. */
.tab-btn{ transition:color .12s ease, border-color .12s ease, transform .08s ease; }
.tab-btn:active{ color:var(--gold); transform:translateY(1px); }
.tc-row.tappable{ transition:background .09s ease, transform .08s ease; }
.tc-row.tappable:active{ background:var(--gold-pale); transform:translateY(1px); opacity:1; }
.fu-chip:active{ transform:translateY(1px) scale(0.985); }
.ptr-tel{ transition:transform .08s ease, filter .08s ease; }
.ptr-tel:active{ transform:translateY(1px); filter:brightness(0.95); }
.pt-more{ transition:background .09s ease, transform .08s ease; }
.pt-more:active{ transform:translateY(1px); }
.sec-head{ display:flex; align-items:baseline; justify-content:space-between; margin:18px 0 8px; }
.sec-title{ font-family:inherit; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--gold-deep); font-weight:600; }
.count-badge{ font-family:inherit; font-weight:700; color:var(--brown); }
.row{ background:var(--white); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  margin-bottom:8px; }
.row.tappable{ cursor:pointer; }
.row{ transition:transform .09s ease, background .09s ease; }
.row.tappable:active{ background:var(--gold-pale); transform:translateY(1px); }
.struck{ opacity:0.55; }
.struck .row-name{ text-decoration:line-through; }
.empty-state{ text-align:center; color:var(--muted); padding:22px 8px; font-size:0.86rem; }
/* ---- the patient card ------------------------------------------------
   Colour and weight only: no images, no fonts, nothing to download. The
   press feel is a 1px shift and a shade change, which the phone renders on
   the compositor and costs nothing to run. */
.pt-card{ position:relative; background:var(--white); border:1px solid var(--line);
  border-radius:14px; padding:12px 14px 12px 16px; margin-bottom:9px; overflow:hidden;
  /* box-shadow is NOT animated, deliberately. transform and opacity are handed
     to the compositor; a shadow must be repainted every frame — and this is
     the most repeated element in the app, forty of them down a list on
     Payment or Bills. The shadow still appears when a card opens; it appears
     rather than fades. */
  transition:transform .09s ease, border-color .09s ease; }
.pt-card::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--gold-light); opacity:.55; }
.pt-card.tappable{ cursor:pointer; }
.pt-card.tappable:active{ transform:translateY(1px) scale(0.997); background:var(--cream); }
.pt-card.pt-open{ border-color:var(--gold-light); box-shadow:0 2px 10px rgba(74,59,40,0.07); }
.pt-card.pt-open::before{ background:var(--gold); opacity:1; }
.pt-top{ display:flex; align-items:flex-start; gap:9px; }
.pt-no{ flex:none; min-width:22px; height:22px; line-height:22px; text-align:center;
  border-radius:6px; background:var(--gold-pale); color:var(--gold-deep);
  font-size:0.72rem; font-weight:700; }
.pt-card.pt-open .pt-no{ background:var(--gold-deep); color:#fff; }
.pt-main{ flex:1; min-width:0; }
.pt-who{ font-weight:600; font-size:0.82rem; color:var(--muted); }
/* The column the time used to sit alone in. */
.pt-side{ flex:none; text-align:right; }
.pt-side .pt-f{ margin-top:6px; }
.pt-side .pt-f b{ display:block; font-size:0.85rem; font-weight:700; color:var(--brown); }
.pt-side .pt-f span{ font-size:0.62rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); }
.pt-name{ font-weight:700; font-size:1rem; color:var(--ink); }
.pt-time{ font-size:0.8rem; font-weight:600; color:var(--gold-deep); white-space:nowrap; }
.pt-sub{ font-size:0.78rem; color:var(--muted); margin-top:2px; }
.pt-tag{ display:inline-block; margin-top:6px; font-size:0.75rem; font-weight:600;
  padding:3px 9px; border-radius:7px; background:var(--gold-pale); color:var(--gold-deep); }
.pt-tag-today{ background:var(--success-bg); color:var(--success); }
.pt-tag-none{ background:transparent; color:var(--muted); padding-left:0; }
.pt-tag-wait{ background:var(--danger-bg); color:var(--danger); }
/* The two figures a card carries before it is opened. */


/* ---- prescriptions inside the card ---- */
.pt-body{ margin-top:11px; border-top:1px solid var(--line); }
.rx-line + .rx-line{ border-top:1px solid rgba(0,0,0,0.05); }
.rx-line-head{ display:flex; align-items:flex-start; gap:9px;
  padding:10px 0; cursor:pointer; transition:opacity .09s ease; }
.rx-mark{ flex:none; width:22px; height:22px; line-height:21px; text-align:center;
  border-radius:6px; border:1px solid var(--line); color:var(--gold-deep);
  font-size:0.82rem; font-weight:700; background:var(--cream); }
.rx-line-open .rx-mark{ background:var(--gold-pale); border-color:var(--gold-light); }
.rx-line-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.rx-line-meta{ font-size:0.72rem; color:var(--muted); }
.rx-chev{ flex:none; color:var(--muted); font-size:1rem; line-height:22px; width:14px; text-align:center; }
.rx-line-open .rx-chev{ color:var(--gold-deep); }
.rx-detail{ padding-left:31px; }
.rx-line-head:active{ opacity:.55; }
.rx-line-what{ font-weight:600; font-size:0.9rem; color:var(--brown); }
.rx-line-open .rx-line-what{ color:var(--gold-deep); }

.rx-line.struck .rx-line-what{ text-decoration:line-through; opacity:.6; }
.rx-detail{ padding:2px 0 12px; }
.pt-more{ display:block; width:100%; margin:4px 0 2px; border:1px dashed var(--line);
  background:transparent; color:var(--gold-deep); font-weight:600; font-size:0.78rem;
  padding:9px; border-radius:9px; cursor:pointer; transition:background .09s ease; }
.pt-more:active{ background:var(--gold-pale); }

/* ---- the money pages ---- */
.period-row{ display:flex; gap:6px; margin:14px 0 4px; }
.per-chip{ flex:1; border:1px solid var(--line); background:var(--white); border-radius:10px;
  padding:9px 0; font-size:0.76rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase;
  color:var(--muted); cursor:pointer; transition:background .09s ease, transform .09s ease; }
.per-chip:active{ transform:translateY(1px) scale(0.985); }
.per-chip.on{ background:var(--gold-deep); border-color:var(--gold-deep); color:#fff; }
.tot{ margin:10px 0 2px; background:var(--gold-pale); border:1px solid var(--gold-light);
  border-radius:14px; padding:13px 16px; cursor:pointer;
  transition:transform .09s ease, filter .09s ease; }
/* brightness() builds a compositing layer for the length of the press; a
   background change gives the same feedback for nothing. */
.tot:active{ transform:translateY(1px); background:var(--gold-light); }
.tot-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.tot-v{ font-size:1.6rem; font-weight:700; color:var(--gold-deep); line-height:1.1;
  /* Never abbreviated: it is the number the page is for. */
  white-space:nowrap; }
.tot-k{ font-size:0.66rem; letter-spacing:0.09em; text-transform:uppercase;
  color:var(--muted); margin-top:3px; }
.tot-chev{ font-size:1.2rem; color:var(--gold-deep); width:16px; text-align:center; }
.tot-split{ display:flex; flex-wrap:wrap; gap:14px 22px; margin-top:12px; padding-top:11px;
  border-top:1px solid var(--gold-light); }
.tot-s{ display:flex; flex-direction:column; }
.tot-sv{ font-weight:700; font-size:1rem; color:var(--brown); white-space:nowrap; }
.tot-sk{ font-size:0.62rem; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted); }
/* ---- the patient record ---- */
.ptr-head{ background:var(--white); border:1px solid var(--line); border-radius:14px;
  padding:14px 16px; margin-bottom:12px; }
.ptr-name{ font-size:1.25rem; font-weight:700; color:var(--ink); }
.ptr-sub{ font-size:0.82rem; color:var(--muted); margin-top:2px; }
.ptr-tel{ display:inline-block; margin-top:9px; font-size:0.86rem; font-weight:600;
  color:var(--gold-deep); text-decoration:none; background:var(--gold-pale);
  border-radius:9px; padding:6px 11px; }
.ptr-chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
.ptr-chip{ font-size:0.7rem; font-weight:700; border-radius:7px; padding:3px 9px; }
.ptr-ortho{ background:var(--gold-pale); color:var(--gold-deep); }
.ptr-crm{ background:#EAEFF3; color:#5C6B77; }
.ptr-money{ display:flex; gap:16px; flex-wrap:wrap; margin-top:12px; padding-top:11px;
  border-top:1px solid var(--line); }
.ptr-m{ display:flex; flex-direction:column; }
.ptr-m b{ font-size:1rem; color:var(--ink); white-space:nowrap; }
.ptr-m b.neg{ color:var(--danger); }
.ptr-m b.adv{ color:var(--success); }
.ptr-m span{ font-size:0.62rem; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted); }
/* One group of one type. */
.tc{ background:var(--white); border:1px solid var(--line); border-radius:14px;
  padding:11px 14px; margin-bottom:9px; }
.tc-head{ display:flex; align-items:baseline; gap:8px; padding-bottom:7px;
  border-bottom:1px solid var(--line); }
.tc-icon{ font-size:0.95rem; }
.tc-label{ flex:1; font-size:0.74rem; letter-spacing:0.08em; text-transform:uppercase;
  font-weight:700; color:var(--gold-deep); }
.tc-count{ font-weight:700; color:var(--brown); font-size:0.85rem; }
.tc-row{ display:flex; gap:10px; align-items:baseline; padding:8px 0;
  border-top:1px solid rgba(0,0,0,0.04); font-size:0.86rem; }
.tc-row:first-of-type{ border-top:0; }
.tc-row.tappable{ cursor:pointer; }
.tc-row.tappable:active{ opacity:.6; }
.tc-row.struck .tc-what{ text-decoration:line-through; opacity:.6; }
.tc-when{ flex:none; width:84px; font-size:0.74rem; color:var(--muted); }
.tc-what{ flex:1; min-width:0; color:var(--brown); }
.tc-chev{ flex:none; color:var(--gold-deep); width:14px; text-align:center; }
.tc-body{ padding:2px 0 10px 84px; }
.imp-split{ display:flex; gap:10px; margin:2px 0 10px; }
.imp-s{ flex:1; background:var(--white); border:1px solid var(--line); border-radius:12px;
  padding:10px 12px; }
.imp-s b{ display:block; font-size:1.1rem; font-weight:700; color:var(--ink); }
.imp-s span{ font-size:0.62rem; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted); }
.pt-amt.adv{ color:var(--success); }
/* Six across a phone: a mark above a short word, no wrapping, no scrolling. */
.tabbar{ display:flex; gap:0; overflow:visible; }
.tab-btn{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center;
  gap:3px; padding:8px 1px 7px; font-size:0.58rem; letter-spacing:0.01em; }
/* IT WRAPS, IT DOES NOT SHRINK OR HIDE (a3.3). Ellipsis turned "Follow-ups"
   into "FOLLOW…" — a label you have to remember rather than read. Shrinking
   the type to fit the longest word made all six smaller for the sake of one.
   So it breaks onto a second line at its own hyphen, the type stays legible,
   and every tab reserves the same two lines' height so the row keeps its
   shape whether a label wraps or not. */
.tab-btn span{ white-space:normal; text-align:center; line-height:1.15;
  min-height:2.3em; display:flex; align-items:flex-start; justify-content:center; }
.ti{ width:20px; height:20px; display:block; }
.ptr-tellabel{ font-weight:500; opacity:.7; }
.ptr-nonum{ margin-top:9px; font-size:0.82rem; color:var(--muted); }

/* One bill, opened. */
.mm-why{ margin-top:6px; font-size:0.8rem; color:var(--brown); font-style:italic; }
.bill-body{ margin-top:11px; border-top:1px solid var(--line); padding-top:9px; }
.bl-row{ display:flex; justify-content:space-between; gap:12px; padding:4px 0; font-size:0.85rem; }
.bl-name{ color:var(--brown); min-width:0; }
.bl-amt{ font-weight:600; color:var(--ink); white-space:nowrap; }
.bl-foot{ margin-top:7px; padding-top:7px; border-top:1px solid rgba(0,0,0,0.07); }
.bl-foot .bl-row:last-child .bl-name,
.bl-foot .bl-row:last-child .bl-amt{ font-weight:700; color:var(--gold-deep); }
/* Follow-up statuses, in the colours the desk gives them. */
.fu-strip{ display:flex; gap:6px; flex-wrap:wrap; margin:12px 0 4px; }
.fu-chip{ border:1px solid var(--line); background:var(--white); border-radius:9px;
  padding:6px 10px; font-size:0.72rem; font-weight:600; color:var(--brown); cursor:pointer;
  transition:transform .09s ease; }
.fu-chip:active{ transform:translateY(1px); }
.fu-chip b{ font-weight:800; }
.fu-chip.on{ box-shadow:inset 0 0 0 2px currentColor; }
.fu-tag{ font-weight:700; }
.fu-urgent { color:#B14A3D; background:#FBEAE6; }
.fu-watch  { color:#8A5F26; background:#F3E6CE; }
.fu-warn   { color:#5C6B77; background:#EAEFF3; }
.fu-pend   { color:#7A5A28; background:#F6EEDF; }
.fu-ok     { color:#3E7D5A; background:#E4F1E9; }
.fu-neutral{ color:#8a7a63; background:#F1EDE6; }
.pt-amt{ font-weight:700; font-size:0.98rem; color:var(--ink); white-space:nowrap; }
.pt-amt.neg{ color:var(--danger); }
.pt-card.struck{ opacity:0.6; }
.pt-card.struck .pt-name{ text-decoration:line-through; }
/* Five tabs need to fit a narrow phone. */
.tabbar{ gap:2px; }
.tab-btn{ font-size:0.72rem; padding:10px 2px; letter-spacing:0.03em; }

.daynav{ display:flex; align-items:center; gap:6px; margin:14px 0 4px; }
.daynav-btn{ width:40px; height:40px; border:1px solid var(--line); background:var(--white);
  border-radius:11px; font-size:1.2rem; color:var(--gold-deep); cursor:pointer; line-height:1; }
.daynav-btn{ transition:transform .09s ease, background .09s ease; }
.daynav-btn:active{ background:var(--gold-pale); transform:translateY(1px); }
.daynav-label{ flex:1; text-align:center; font-weight:700; font-size:0.95rem; color:var(--brown); }
.daycal{ position:relative; display:inline-flex; align-items:center; justify-content:center;
  width:40px; height:40px; border:1px solid var(--line); border-radius:11px; background:var(--white);
  font-size:1rem; cursor:pointer; }
.daycal input{ position:absolute; inset:0; width:100%; height:100%; opacity:0; margin:0; padding:0; border:0; }
.search-input{ width:100%; border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  font-size:1rem; font-family:inherit; background:var(--white); color:var(--brown); margin:14px 0 4px; }
.search-input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
.hidden{ display:none !important; }
.muted{ color:var(--muted); }
.gate{ text-align:center; padding:60px 20px; }
.gate h1{ font-family:inherit; font-size:1.1rem; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--gold-deep); margin:0 0 6px; }
.gate p{ color:var(--muted); font-size:0.88rem; margin:0 0 20px; }
.btn{ transition:transform .09s ease, filter .09s ease; border:0; background:var(--gold-deep); color:#fff; font-family:inherit; font-weight:600;
  letter-spacing:0.06em; text-transform:uppercase; font-size:0.82rem; padding:12px 22px; border-radius:11px;
  cursor:pointer; }
.btn:active{ transform:translateY(1px); filter:brightness(0.94); }
.btn.ghost{ background:transparent; color:var(--gold-deep); border:1px solid var(--line); }
.status-bar{ padding:10px 14px; font-size:0.84rem; text-align:center; }
.status-bar.err{ background:var(--danger-bg); color:var(--danger); }
.spin{ text-align:center; padding:26px; color:var(--muted); font-size:0.86rem; }
.rxs-k{ font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold-deep);
  font-weight:600; margin-top:10px; }
.rxs-v{ font-size:0.9rem; color:var(--brown); white-space:pre-wrap; }
.rxs-med{ border-top:1px solid rgba(0,0,0,0.06); padding:6px 0 4px; font-size:0.9rem; font-weight:600; }
.rxs-dose{ font-size:0.8rem; color:var(--muted); font-weight:400; }/* ---- v3.0 calendar ---- */
.cal-top{ text-align:center; margin:12px 0 6px; }
.cal-title{ font-size:1.05rem; font-weight:700; color:var(--ink); background:none; border:0; font-family:inherit; padding:2px 6px; cursor:pointer; }
.cal-title::after{ content:' \25BE'; font-size:0.7rem; color:var(--muted); }
.cal-rel{ font-size:0.78rem; color:var(--muted); margin-top:1px; }
.cal-today-word{ color:var(--gold-deep); font-weight:600; }
.link{ background:none; border:0; padding:0; font:inherit; color:var(--gold-deep); text-decoration:underline; cursor:pointer; }
#calPicker{ position:absolute; opacity:0; width:1px; height:1px; pointer-events:none; }
.cal-strip{ display:grid; grid-template-columns:14px repeat(7, 1fr) 14px; gap:3px; margin:8px -14px 2px; padding:0 0; touch-action:pan-y; }
.cal-d{ border:0; background:none; font-family:inherit; font-size:0.66rem; color:var(--muted); padding:6px 0; border-radius:10px; display:flex; flex-direction:column; align-items:center; gap:1px; cursor:pointer; }
.cal-d b{ font-size:0.86rem; color:var(--ink); font-weight:600; }
.cal-d.peek{ opacity:0.35; overflow:hidden; }
.cal-d.sel{ background:var(--gold-deep); color:#fff; }
.cal-d.sel b{ color:#fff; }
.cal-d.today{ box-shadow: inset 0 0 0 1px var(--gold-deep); }
.cal-d.today b{ color:var(--gold-deep); }
.cal-range{ text-align:center; font-size:0.7rem; color:var(--muted); }
.cal-fresh{ text-align:center; font-size:0.7rem; color:var(--muted); min-height:14px; margin:2px 0 10px; }
.cal-row{ display:grid; grid-template-columns:58px minmax(0,1fr) auto; gap:8px; align-items:center; background:var(--white); border:1px solid var(--line); border-left:4px solid #B4B2A9; border-radius:11px; padding:9px 10px; margin-bottom:6px; cursor:pointer; }
.cal-row:active{ transform:scale(0.99); }
.cal-row.is-rough{ border-left-style:dashed; opacity:0.85; }
.cal-row.is-struck{ opacity:0.7; }
.cal-row.is-struck .cal-name{ text-decoration:line-through; }

<script>

/* ---------------- Small helpers (mirrors the desktop app's own) ---------------- */
function pad2(n){ return String(n).padStart(2, '0'); }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
/* ---- Rolling figures --------------------------------------------------
   The desktop app counts its totals up rather than snapping them in, and
   the phone should not feel more static than the machine at the desk. The
   last value is kept ON the element (__rollVal) rather than parsed back
   out of the text — ₹1,20,000 does not parse, and a re-render must roll
   from what is actually on screen, not from zero.

   Three deliberate guards: a cancelled frame if a second render lands
   mid-roll (otherwise two animations fight over one element and the
   figure flickers); an instant set when the value has not changed, so an
   idle refresh does not re-animate the whole screen; and an instant set
   when the phone asks for reduced motion or when there is no animation
   frame to use at all — the number being RIGHT never depends on the
   animation running. Intermediate frames are rounded to whole rupees so
   paise do not flicker; the final frame prints the exact value. */
/* Figures roll AFTER the screen clears, not behind the blur.

   A render paints its numbers and the overlay is still up, so the count-up
   happened underneath it: by the time the blur lifted the roll was over or
   most of the way through, and what the eye caught was a smear of digits
   settling. The animation existed and nobody ever saw it.

   Deferred rolls queue here and are released the moment loading ends. The
   element still gets its FINAL value immediately, so nothing is left blank
   or stale if the release never comes — the roll is decoration, the figure
   is not. */
let _loadingUp = false;
let _pendingRolls = [];

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const ITEM_MODE_LABELS = { cash:'Cash', upi:'UPI', card:'Card', bank:'Bank', refund:'Refund', writeoff:'Write-off' };

/* ---------------- Money doctrine, ported verbatim from the desktop app ----
   The phone must never disagree with the screen at the clinic, so these
   four functions mirror isVoidedItem / reversalExcludesFromDayTotals /
   computeItemTotals / entryModeTotals exactly. Before this, the mobile page
   read entry.cash/upi/card/bank straight — the LEGACY stored fields — so a
   normal item-based day showed a ₹0 header above a list of real payments.
   Keep these in step with the desktop's versions if those ever change. */

const Cal = (function(){

/* ==========================================================================
   ECHO NEXUS — LITE  v3.0  (16 Sep 2026)

   For reception, staff and the associate doctor. Read-only. Two pages:
     CALENDAR  the day's bookings and visits together, latest first, any day
               past or future; tap one for the drawer.
     PATIENTS  a name, and every prescription on record.

   NO SIGN-IN (v3.0). The app reads through the clinic's relay (an Apps
   Script on the clinic Google account) with the key its setup link carried.
   The relay never gives this key phone numbers or money, whatever is asked.

   INSTANT (v3.0). Everything read is kept on the phone (IndexedDB) and drawn
   from there first; the relay is asked behind it and the page updates in
   place. A day already on the phone paints with no wait. Opening a day also
   reads its whole week and the next in one request, so the next tap is on
   the phone already.
   ========================================================================== */

function pad2(n){ return String(n).padStart(2, '0'); }
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function jsArg(v){ return escapeHtml(JSON.stringify(String(v))); }
function dateOf(str){ const [y, m, d] = String(str).split('-').map(Number); return new Date(y, m - 1, d); }
function ymd(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function addDays(str, n){ const d = dateOf(str); d.setDate(d.getDate() + n); return ymd(d); }
function daysBetween(a, b){ return Math.round((dateOf(b) - dateOf(a)) / 86400000); }
function weekStart(str){ const d = dateOf(str); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return ymd(d); }
function shortDate(str, withYear){
  return dateOf(str).toLocaleDateString('en-IN', withYear ? { day:'2-digit', month:'short', year:'numeric' } : { day:'numeric', month:'short' });
}
function dayTitle(str){ return dateOf(str).toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short' }); }
function minsOf(t){ const m = /^(\d{1,2}):(\d{2})/.exec(String(t || '')); return m ? Number(m[1]) * 60 + Number(m[2]) : NaN; }
function clock(mins){
  if(!Number.isFinite(mins)) return '';
  const h = Math.floor(mins / 60), m = mins % 60, h12 = ((h + 11) % 12) + 1;
  return h12 + ':' + pad2(m) + (h < 12 ? ' am' : ' pm');
}
function localMinsOfIso(iso){ const d = new Date(iso); return isNaN(d) ? NaN : d.getHours() * 60 + d.getMinutes(); }

/* ------------------------------------------------------------ the store -- */
/* IndexedDB, so weeks of days fit (localStorage holds ~5 MB and blocks the
   page while it writes). Falls back to memory if the browser refuses it. */
let _db = null;
function idb(){
  if(_db) return _db;
  _db = new Promise((resolve) => {
    try{
      const req = indexedDB.open('echo-admin-cal', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('kv');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    }catch(e){ resolve(null); }
  });
  return _db;
}
async function idbAll(){
  const db = await idb();
  if(!db) return {};
  return new Promise((resolve) => {
    const out = {};
    try{
      const tx = db.transaction('kv', 'readonly');
      const req = tx.objectStore('kv').openCursor();
      req.onsuccess = () => { const c = req.result; if(c){ out[c.key] = c.value; c.continue(); } else resolve(out); };
      req.onerror = () => resolve(out);
    }catch(e){ resolve(out); }
  });
}
async function idbPut(key, value){
  const db = await idb();
  if(!db) return;
  try{ db.transaction('kv', 'readwrite').objectStore('kv').put(value, key); }catch(e){}
}
async function idbDel(key){
  const db = await idb();
  if(!db) return;
  try{ db.transaction('kv', 'readwrite').objectStore('kv').delete(key); }catch(e){}
}
async function idbClear(){
  const db = await idb();
  if(!db) return;
  try{ db.transaction('kv', 'readwrite').objectStore('kv').clear(); }catch(e){}
}

/* What the page draws from. Filled from IndexedDB at boot, before anything
   is asked of the relay. */
const mem = { settings: {}, days: {} };
const SETTINGS = ['patients.json', 'patient-contacts.json', 'prescriptions-index.json', 'doctors.json', 'calendar-blocks.json'];
const KEEP_PAST_DAYS = 60, KEEP_FUTURE_DAYS = 30;

async function hydrate(){
  const all = await idbAll();
  const today = todayStr();
  Object.keys(all).forEach(k => {
    if(k.indexOf('set:') === 0) mem.settings[k.slice(4)] = all[k];
    else if(k.indexOf('day:') === 0){
      const d = k.slice(4);
      const age = daysBetween(d, today);
      if(age > KEEP_PAST_DAYS || -age > KEEP_FUTURE_DAYS) idbDel(k);   // pruned, quietly
      else mem.days[d] = all[k];
    }
  });
}
function S(name){ const r = mem.settings[name]; return r ? r.value : null; }

let settingsFreshThisOpen = false;
async function refreshSettings(force){
  if(settingsFreshThisOpen && !force) return;
  settingsFreshThisOpen = true;
  await Promise.all(SETTINGS.map(async name => {
    try{
      const r = await relay({ action: 'settings', name });
      mem.settings[name] = { value: r.value, modified: r.modified, at: Date.now() };
      idbPut('set:' + name, mem.settings[name]);
    }catch(e){ /* the saved copy stands */ }
  }));
  repaint();
}

/* ------------------------------------------------------------- the week -- */
const weekAsked = {};   // range -> ms asked, so a tap-tap-tap does not re-ask
const WEEK_RECHECK_MS = 60 * 1000;
let lastWeekError = '';
async function ensureWeek(anyDay, force){
  const from = weekStart(anyDay), to = addDays(from, 13);   // this week and the next
  const today = todayStr();
  const range = from + '|' + to;
  const allHeld = Array.from({ length: 14 }, (_, i) => addDays(from, i)).every(d => mem.days[d]);
  const allPast = to < today;
  if(!force){
    if(allHeld && allPast) return;                                        // a finished fortnight never changes
    if(weekAsked[range] && Date.now() - weekAsked[range] < WEEK_RECHECK_MS) return;
  }
  weekAsked[range] = Date.now();
  setFreshness('updating');
  try{
    const r = await relay({ action: 'week', from, to });
    Object.keys(r.days || {}).forEach(d => {
      mem.days[d] = { appointments: r.days[d].appointments || [], visits: r.days[d].visits || [], modified: r.days[d].modified, at: Date.now() };
      idbPut('day:' + d, mem.days[d]);
    });
    lastWeekError = '';
    setFreshness('fresh');
  }catch(e){
    lastWeekError = e.message || 'offline';
    setFreshness('failed');
  }
  if(currentTab === 'calendar') renderCalendar();
}

let freshness = '';

function paintFreshness(){

  else if(freshness === 'failed') el.textContent = held ? 'No connection \u00b7 saved copy' + (at ? ' from ' + at : '') + (lastWeekError && lastWeekError !== 'offline' ? ' \u00b7 ' + lastWeekError : '')

/* ------------------------------------------------------------ people -- */
function nameOf(pid){ const d = S('patients.json') || {}; return d[String(pid)] || ''; }
function ageSexOf(pid){
  const rec = (S('patient-contacts.json') || {})[String(pid)];
  if(!rec) return '';
  let age = (rec.age === undefined || rec.age === null || rec.age === '') ? '' : String(rec.age);
  const yr = rec.ageRecordedOn ? String(rec.ageRecordedOn).slice(0, 4) : '';
  if(age && yr && yr !== todayStr().slice(0, 4)) age = age + ' (' + yr + ')';
  const sx = rec.sex ? String(rec.sex).trim()[0].toUpperCase() : '';
  return [age, (sx === 'M' || sx === 'F') ? sx : ''].filter(Boolean).join('/');
}
const DOC_COLORS = ['#C0533C','#3E7D5A','#3D5FA6','#7B4FA6','#B4802C','#2C8484','#A63D6F','#7A7F2C','#4C57A8','#A64D4D','#2C7BA6','#8A5F2C'];
function doctorColor(name){
  if(!name || name === 'NEW') return '#B4B2A9';
  const list = S('doctors.json') || [];
  const d = (Array.isArray(list) ? list : []).find(x => x && (x.name === name || x === name));
  return (d && typeof d.colorIdx === 'number' && DOC_COLORS[d.colorIdx]) || '#B4B2A9';
}
function doctorLabel(name){ return !name ? '' : (name === 'NEW' ? 'doctor not assigned' : name); }

/* ------------------------------------------------------ prescriptions -- */
function rxAll(){ const idx = S('prescriptions-index.json'); return (idx && Array.isArray(idx.list)) ? idx.list : []; }
function rxIsStruck(rec){ return !!(rec && rec.struckAt); }
function rxFor(patientId){
  const byDate = (a, b) => String(b.date || b.createdAt || '').localeCompare(String(a.date || a.createdAt || ''));
  return rxAll().filter(r => r && String(r.patientId) === String(patientId))
    .sort((a, b) => (rxIsStruck(a) ? 1 : 0) - (rxIsStruck(b) ? 1 : 0) || byDate(a, b));
}
function rxWhat(rec){
  const said = String((rec && rec.treatment) || '').trim() || String((rec && rec.advice) || '').trim();
  if(said) return said;
  const meds = ((rec && rec.medicines) || []).map(m => m && m.name).filter(Boolean);
  if(meds.length) return meds.join(', ');
  return String((rec && rec.complaints) || '').trim() || 'Consultation';
}
function rxMedCount(rec){
  const n = ((rec && rec.medicines) || []).filter(m => m && m.name).length;
  return n ? (n + (n === 1 ? ' medicine' : ' medicines')) : 'no medicines';
}
function rxDayLabel(rec){ const d = String((rec && (rec.date || rec.createdAt)) || '').slice(0, 10); return /^\d{4}-\d{2}-\d{2}$/.test(d) ? shortDate(d, true) : '\u2014'; }
function agoWords(dateStr){
  const d = String(dateStr || '').slice(0, 10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return '';
  const days = daysBetween(d, todayStr());
  if(days < 0) return 'later';
  if(days === 0) return 'today';
  if(days === 1) return 'yesterday';
  if(days < 7) return days + ' days ago';
  if(days < 14) return 'last week';
  if(days < 31) return Math.floor(days / 7) + ' weeks ago';
  const months = Math.round(days / 30.4);
  if(months < 12) return months + (months === 1 ? ' month ago' : ' months ago');
  const years = Math.floor(days / 365), rem = Math.round((days - years * 365) / 30.4);
  return years + (years === 1 ? ' year' : ' years') + (rem ? ' ' + rem + 'm' : '') + ' ago';
}
function rxDetailHtml(rec){
  const row = (k, v) => v ? '<div class="rxs-k">' + k + '</div><div class="rxs-v">' + escapeHtml(v) + '</div>' : '';
  const meds = ((rec.medicines) || []).filter(m => m && m.name);
  return '<div class="rx-detail">'
    + (rxIsStruck(rec) ? '<div class="muted" style="font-size:0.8rem;">Struck' + (rec.struckReason ? ' \u00b7 ' + escapeHtml(rec.struckReason) : '') + '</div>' : '')
    + row('Complaints', rec.complaints) + row('Investigations', rec.investigations) + row('Treatment', rec.treatment)
    + (meds.length ? '<div class="rxs-k">Medicines</div>' + meds.map(m =>
        '<div class="rxs-med">' + escapeHtml(m.name) + '<div class="rxs-dose">'
        + escapeHtml([m.dose, m.duration, m.food ? m.food + ' food' : ''].filter(Boolean).join(' \u00b7 ') || '\u2014')
        + '</div></div>').join('') : '')
    + row('Advice', rec.advice)
    + (!meds.length && !rec.treatment && !rec.advice && !rec.complaints && !rec.investigations
        ? '<div class="muted" style="font-size:0.86rem;">Nothing was written on this one.</div>' : '')
    + '</div>';
}

/* --------------------------------------------------------- the day list -- */
/* On a day that is not today nobody is still in a chair: an unfinished visit
   is done. The desk's rule, one line. */
function effectiveStatus(v, day){
  const raw = (v && v.status) || 'waiting';
  if(day === todayStr() || raw === 'done') return raw;
  return 'done';
}
function blocksOn(day){
  const list = S('calendar-blocks.json') || [];
  const dow = dateOf(day).getDay();
  return (Array.isArray(list) ? list : []).filter(b => {
    if(!b) return false;
    if(b.repeat === 'weekly'){
      if(Number(b.weekday) !== dow) return false;
      if(b.from && day < b.from) return false;
      if(b.until && day > b.until) return false;
      if(Array.isArray(b.skip) && b.skip.indexOf(day) !== -1) return false;
      return true;
    }
    return b.date === day;
  });
}
const STATUS_CHIP = {
  waiting:  ['Waiting',  'st-wait'],
  ongoing:  ['In chair', 'st-chair'],
  done:     ['Done',     'st-done'],
  booked:   ['Booked',   'st-booked'],
  noshow:   ['No show',  'st-noshow'],
  rough:    ['Rough',    'st-rough'],
  came:     ['Came',     'st-done']
};
/* Every booking and every visit once, latest first. */
function rowsFor(day){
  const held = mem.days[day];
  if(!held) return null;
  const visits = (held.visits || []).filter(v => v && !v.removedAt);
  const byVisitId = {};
  visits.forEach(v => { byVisitId[String(v.id)] = v; });
  const used = {};
  const rows = [];
  (held.appointments || []).forEach(a => {
    if(!a) return;
    const st = a.status || 'scheduled';
    if(st === 'cancelled') return;
    const v = a.visitId ? byVisitId[String(a.visitId)] : null;
    if(v) used[String(v.id)] = true;
    const t = minsOf(a.time);
    let status;
    if(a.rough) status = 'rough';
    else if(v) status = effectiveStatus(v, day);
    else if(st === 'visited') status = 'came';
    else if(st === 'noshow') status = 'noshow';
    else status = 'booked';
    rows.push({ kind: 'appt', id: a.id, visitId: v ? v.id : '', patientId: a.patientId || '', name: a.patientId ? (nameOf(a.patientId) || ('ID ' + a.patientId)) : (a.newName || (a.rough ? 'no name yet' : 'New patient')),
      mins: t, len: Number(a.mins) || 15, doctor: a.doctor || '', reason: (v && v.cameFor) || a.cameFor || a.note || '',
      status, struck: status === 'noshow', rough: !!a.rough, bookedAt: a.createdAt || '', chair: v && v.chair });
  });
  visits.forEach(v => {
    if(used[String(v.id)]) return;
    rows.push({ kind: 'walkin', id: v.id, visitId: v.id, patientId: v.patientId, name: nameOf(v.patientId) || ('ID ' + v.patientId),
      mins: localMinsOfIso(v.arrivedAt), len: 0, doctor: v.doctor || '', reason: v.cameFor || '',
      status: effectiveStatus(v, day), struck: false, rough: false, chair: v.chair });
  });
  blocksOn(day).forEach(b => {
    rows.push({ kind: b.kind === 'leave' ? 'leave' : 'block', id: b.id, mins: b.allDay ? 24 * 60 : minsOf(b.start),
      end: minsOf(b.end), allDay: !!b.allDay, title: b.title || '' });
  });
  /* EARLIEST FIRST (owner's call, a4.1 / lite 3.1 - latest-first undone). An
     all-day closure leads the day; a booking with no time closes it. */
  const sortKey = (r) => r.allDay ? -1 : (Number.isFinite(r.mins) ? r.mins : 24 * 60 + 1);
  rows.sort((x, y) => sortKey(x) - sortKey(y));
  return rows;
}
function rowHtml(r, day){
  if(r.kind === 'block' || r.kind === 'leave'){
    const when = r.allDay ? 'all day' : (Number.isFinite(r.mins) ? clock(r.mins) + (Number.isFinite(r.end) ? ' \u2013 ' + clock(r.end) : '') : '');
    return '<div class="cal-closed">' + (r.kind === 'leave' ? 'Away' : 'Closed') + (when ? ' ' + escapeHtml(when) : '')
      + (r.title ? ' \u00b7 ' + escapeHtml(r.title) : '') + '</div>';
  }
  const chip = STATUS_CHIP[r.status] || STATUS_CHIP.booked;
  const rxN = r.patientId ? rxFor(r.patientId).length : 0;
  const sub = [r.reason || (r.kind === 'walkin' ? 'no reason given' : ''), doctorLabel(r.doctor), rxN ? '\u211e ' + rxN : ''].filter(Boolean).join(' \u00b7 ');
  const as = r.patientId ? ageSexOf(r.patientId) : '';
  return '<div class="cal-row' + (r.rough ? ' is-rough' : '') + (r.struck ? ' is-struck' : '') + '" style="border-left-color:' + doctorColor(r.doctor) + ';"'
    + ' onclick="Cal.openDrawer(' + jsArg(day) + ',' + jsArg(r.kind) + ',' + jsArg(r.id) + ')">'
    + '<div class="cal-time">' + (Number.isFinite(r.mins)
        ? clock(r.mins).replace(/ (am|pm)$/, '<small>$1</small>') : 'Any')
      + '<span>' + (r.kind === 'walkin' ? 'walk-in' : (Number.isFinite(r.mins) ? r.len + ' min' : 'time')) + '</span>'
    + '</div>'
    + '<div class="cal-main"><div class="cal-name">' + escapeHtml(r.name) + (as ? ' <span>' + escapeHtml(as) + '</span>' : '') + '</div>'
      + '<div class="cal-sub">' + escapeHtml(sub) + '</div></div>'
    + '<span class="cal-chip ' + chip[1] + '">' + chip[0] + '</span>'
    + '</div>';
}

/* ---------------------------------------------------------- the calendar -- */
let currentTab = 'calendar';
let viewDay = todayStr();
function renderCalendar(){
  const today = todayStr();
  document.getElementById('calTitle').textContent = dayTitle(viewDay);
  const offset = daysBetween(today, viewDay);
  document.getElementById('calRel').innerHTML = offset === 0 ? '<span class="cal-today-word">Today</span>'
    : escapeHtml(offset === 1 ? 'Tomorrow' : offset === -1 ? 'Yesterday' : offset > 0 ? 'In ' + offset + ' days' : Math.abs(offset) + ' days ago')
      + ' \u00b7 <button type="button" class="link" onclick="Cal.goDay(todayStr())">Today</button>';
  const ws = weekStart(viewDay);
  const cell = (d, peek) => {
    const cls = ['cal-d'];
    if(peek) cls.push('peek');
    if(d === viewDay) cls.push('sel');
    else if(d === today) cls.push('today');
    return '<button type="button" class="' + cls.join(' ') + '" onclick="Cal.goDay(' + jsArg(d) + ')">'
      + dateOf(d).toLocaleDateString('en-IN', { weekday:'narrow' }) + '<b>' + dateOf(d).getDate() + '</b></button>';
  };
  document.getElementById('calStrip').innerHTML = cell(addDays(ws, -1), true)
    + Array.from({ length: 7 }, (_, i) => cell(addDays(ws, i), false)).join('')
    + cell(addDays(ws, 7), true);
  document.getElementById('calRange').textContent = shortDate(ws) + ' \u2013 ' + shortDate(addDays(ws, 6));
  const list = document.getElementById('calList');
  const rows = rowsFor(viewDay);
  if(rows === null){
    list.innerHTML = '<div class="cal-skel"></div><div class="cal-skel"></div><div class="cal-skel"></div>';
  } else if(!rows.length){
    list.innerHTML = '<div class="empty-state">' + (viewDay < today ? 'Nobody booked or came' : 'Nothing booked yet') + '</div>';
  } else {
    list.innerHTML = rows.map(r => rowHtml(r, viewDay)).join('');
  }
  paintFreshness();
  paintAdminExtras();
}
function goDay(d){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(d || ''))) return;
  viewDay = d;
  renderCalendar();          // from the phone, now
  ensureWeek(d, false);       // and the relay behind it
}
function openDatePicker(){
  const inp = document.getElementById('calPicker');
  inp.value = viewDay;
  try{ if(inp.showPicker){ inp.showPicker(); return; } }catch(e){}
  inp.focus(); inp.click();
}
function wireStripSwipe(){
  const el = document.getElementById('calStrip');
  let x0 = null, y0 = null;
  el.addEventListener('touchstart', e => { if(e.touches.length === 1){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } }, { passive: true });
  el.addEventListener('touchend', e => {
    if(x0 === null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) goDay(addDays(viewDay, dx < 0 ? 7 : -7));
  }, { passive: true });
}

let drawerCtx = null;
function openDrawer(day, kind, id){

  if(!r) return;
  drawerCtx = { day, kind, id, patientId: r.patientId };
  lastDrawer = { day, kind, id };
  const chip = STATUS_CHIP[r.status] || STATUS_CHIP.booked;
  const as = r.patientId ? ageSexOf(r.patientId) : '';
  let h = '<div class="dr-grip"></div>'
    + '<div class="dr-head"><div><b>' + escapeHtml(r.name) + '</b>'
      + (r.patientId ? ' <span>' + escapeHtml(String(r.patientId)) + (as ? ' \u00b7 ' + escapeHtml(as) : '') + '</span>' : '') + '</div>'
      + '<button type="button" class="dr-x" onclick="Cal.closeDrawer()" aria-label="Close">\u2715</button></div>'
    + '<div class="dr-line">' + escapeHtml([dayTitle(day), r.kind === 'walkin' ? 'walk-in ' + clock(r.mins) : clock(r.mins), doctorLabel(r.doctor)].filter(Boolean).join(' \u00b7 '))
      + ' <span class="cal-chip ' + chip[1] + '">' + chip[0] + '</span></div>';

      + (mine.length ? mine.map(x => '<div class="dr-rx">' + escapeHtml(rxWhat(x)) + '<span>' + escapeHtml(rxMedCount(x)) + '</span></div>' + rxDetailHtml(x)).join('')
                     : '<div class="muted">None written</div>')
      + '</div>';
  } else {
    const row = (k, v) => v ? '<div class="dr-kv"><span>' + k + '</span><span>' + escapeHtml(v) + '</span></div>' : '';
    h += '<div class="dr-kvs">'
      + row('When', [dayTitle(day), Number.isFinite(r.mins) ? clock(r.mins) : '', r.len ? r.len + ' min' : ''].filter(Boolean).join(' \u00b7 '))
      + row('Doctor', doctorLabel(r.doctor))
      + row('For', r.reason)
      + row('Booked', r.bookedAt ? shortDate(String(r.bookedAt).slice(0, 10)) : '')
      + '</div>';
  }
  if(r.patientId && hooks.adminOn() && r.visitId){
    h += '<div class="dr-pair"><div class="dr-panel" id="drBill"><div class="rxs-k">Bill ' + (day === todayStr() ? 'today' : 'that day') + '</div><div class="muted">Reading\u2026</div></div>'
      + '<div class="dr-panel" id="drPending"><div class="rxs-k">Pending</div><div class="muted">Reading\u2026</div></div></div>';
  }
  if(r.patientId){
    h += '<div class="dr-btns"><button type="button" class="btn ghost dr-btn" onclick="Cal.openPrevRx(' + jsArg(r.patientId) + ')">\uD83D\uDCDC Previous prescriptions</button>'
      + (hooks.adminOn() ? '<button type="button" class="btn ghost dr-btn" onclick="Cal.fullHistory(' + jsArg(r.patientId) + ')">\uD83D\uDDC2\uFE0F Full history</button>' : '')
      + '</div>';
  }
  const sheet = document.getElementById('drawer');
  sheet.innerHTML = h;
  document.getElementById('drawerWrap').classList.remove('hidden');
  if(r.patientId && hooks.adminOn() && r.visitId) fillMoney(r.patientId, day);
}
function closeDrawer(){
  document.getElementById('drawerWrap').classList.add('hidden');
  drawerCtx = null;
}
function wireDrawer(){
  const wrap = document.getElementById('drawerWrap');
  wrap.addEventListener('click', e => { if(e.target === wrap) closeDrawer(); });
  const sheet = document.getElementById('drawer');
  let y0 = null;
  sheet.addEventListener('touchstart', e => { if(sheet.scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive: true });
  sheet.addEventListener('touchend', e => { if(y0 !== null && e.changedTouches[0].clientY - y0 > 80) closeDrawer(); y0 = null; }, { passive: true });
}

/* -------------------------------------------------- admin-only extras -- */
const hooks = { adminOn: () => false, money: null, fullHistory: null };
function fmtRs(n){ return '\u20b9' + Math.round(Number(n) || 0).toLocaleString('en-IN'); }
async function fillMoney(pid, day){

   No Google sign-in. The phone reads through the clinic relay with the key
   its setup link carried. It opens LOCKED - the lite view, which is all the
   relay gives this key without a session. Admin + the 4-digit PIN (set in
   Nexus) opens a session; closing the app or locking the phone drops it. */
const K_RELAY = 'echoAdmin_relay', K_KEY = 'echoAdmin_key';

  const h = String(location.hash || '').replace(/^#/, '');

  const p = new URLSearchParams(h);
  const r = p.get('relay'), k = p.get('key');
  if(r && k){ try{ localStorage.setItem(K_RELAY, r); localStorage.setItem(K_KEY, k); }catch(e){} }

function relayUrl(){ try{ return localStorage.getItem(K_RELAY) || ''; }catch(e){ return ''; } }

async function relay(params){

  Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
  let res;
  try{ res = await fetch(url.toString(), { redirect: 'follow', cache: 'no-store' }); }
  catch(e){ throw new RelayError('offline'); }
  let body = null;
  try{ body = await res.json(); }catch(e){ throw new RelayError('unreadable'); }
  if(!body || !body.ok){
    if(body && body.error === 'bad key'){
      document.getElementById('setupMsg').textContent = 'This phone\u2019s link is no longer valid. Open the new admin setup link.';
      showSetup();
    }
    if(body && body.error === 'session ended') lockAdmin();

/* ---- Drive, as the lifted loaders know it, answered by the relay ----
   A folder is 'dir:<name>'; a file is 'file:<folder>/<name>'. The relay is
   asked only when a file is READ, and it is told the last modified time this
   phone holds, so an unchanged file comes back as "not modified" without
   its contents. */
const relayHeld = {};   // 'folder/name' -> { modified, value }
async function driveFindChild(parentId, name, isFolder){
  if(!parentId) return null;
  if(isFolder || parentId === 'root') return isFolder ? 'dir:' + name : 'file:settings/' + name;
  if(String(parentId).indexOf('dir:') === 0) return 'file:' + parentId.slice(4) + '/' + name;
  return null;
}
async function driveFindChildFresh(parentId, name, isFolder){ return driveFindChild(parentId, name, isFolder); }
let lastFoundModifiedTime = null;
async function driveReadJson(fileId){
  const m = /^file:([a-z-]+)\/(.+)$/.exec(String(fileId || ''));
  if(!m) return null;
  const folder = m[1], name = m[2], key = folder + '/' + name;
  const held = relayHeld[key];
  const q = folder === 'settings' ? { action: 'settings', name }
    : (['data', 'visits', 'appointments'].indexOf(folder) !== -1 && /^\d{4}-\d{2}-\d{2}\.json$/.test(name))
      ? { action: 'day', folder, date: name.slice(0, 10) }
      : { action: 'file', folder, name };
  if(held && held.modified) q.since = held.modified;
  const r = await relay(q);
  if(r.notModified && held) return held.value;
  relayHeld[key] = { modified: r.modified || null, value: r.value };
  return r.value;
}
async function driveListChildren(parentId){
  const folder = String(parentId || '').replace(/^dir:/, '');

async function loadEntriesIndex(){

async function loadBills(){

    if(Array.isArray(held)) return (cachedBills = held);

  try{

async function loadAllEntries(){
  if(!accessToken){
    const held = cacheRead('echoAdmin_entries');

  const out = idx ? Object.keys(idx).map(d => idx[d]) : [];
  const have = new Set(out.filter(Boolean).map(e => e.date));
  const today = todayStr();

  /* Walk back from today until the index takes over, so the newest days —
     the ones that matter most — are always fetched first. */
  const missing = [];
  let cursor = today;
  for(let i = 0; i < CATCHUP_DAY_LIMIT; i++){
    if(have.has(cursor)) break;
    missing.push(cursor);
    cursor = addDays(cursor, -1);
  }
  /* One listing tells us which of these days exist and where they are, so
     the seven lookups are gone. The reads that remain run TOGETHER rather
     than one after another — they are independent, and waiting for each in
     turn was most of the cold-open delay. */

    try{
      const fileId = list
        ? (Object.prototype.hasOwnProperty.call(list, d) ? list[d].id : null)
        : await driveFindChild(cachedDataFolderId, d + '.json', false);

         the same distinction as above. */

  if(!iso) return null;
  const d = new Date(iso);

  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());

function reversalExcludesFromDayTotals(it){
  if(!it || !it.reversal) return false;
  if(!it.time) return true;   // no timestamp to compare — be conservative
  return localDateOf(it.reversal.reversedAt) === localDateOf(it.time);

function computeItemTotals(items){
  const t = { cash:0, upi:0, card:0, bank:0 };
  (items||[]).forEach(it=>{
    if(isVoidedItem(it)) return;                       // cancelled — counts as nothing
    if(it.method === 'refund'){ t.cash -= (Number(it.amount)||0); return; }  // money leaving the drawer
    if(it.method === 'writeoff') return;               // no money changed hands
    if(reversalExcludesFromDayTotals(it)) return;      // reversed same day
    if(Object.prototype.hasOwnProperty.call(t, it.method)) t[it.method] += (Number(it.amount)||0);
    else t.cash += (Number(it.amount)||0);             // unknown method folds into cash, never vanishes
  });

}
function entryModeTotals(e){
  if(!e) return { cash:0, upi:0, card:0, bank:0 };
  const stored = {
    cash: Number(e.cash)||0, upi: Number(e.upi)||0,
    card: Number(e.card)||0, bank: Number(e.bank)||0
  };
  if(!(e.items && e.items.length)) return stored;
  const derived = computeItemTotals(e.items);
  // Whichever source accounts for more money, taken WHOLE — so the split
  // always sums to the figure beside it, and a day can never quietly shrink.
  const storedSum  = stored.cash + stored.upi + stored.card + stored.bank;
  const derivedSum = derived.cash + derived.upi + derived.card + derived.bank;
  return derivedSum >= storedSum ? derived : stored;
}

  n = Number(n) || 0;

/* KEPT ON THE DEVICE (a2.7). Opening one patient's record read twelve
   indexes, and ten of them went to Drive every time — on a phone, over
   whatever signal it had, before a single line appeared.

   These are the small, slow-changing ones: who is who, who is on long
   treatment, the notes, the lab, the calls, the fixtures. They are answered
   from the phone at once and re-read behind the paint, so the record opens
   immediately and corrects itself a moment later if the desk has moved on.

   The two big ones — bills and payments — are deliberately NOT here. They
   are the largest files the clinic has, they change all day, and filling
   the phone's storage with them would evict the very things that make this
   fast. They keep their own revalidating in-memory cache instead. */
const PT_CACHE_PREFIX = 'echoAdmin_pt_';
/* How old a kept answer may be before it is worth asking again. These files
   change a few times a day at most; re-reading all ten every time a record is
   opened spent the phone's signal on answers that had not moved. */
const PT_STALE_MS = 10 * 60 * 1000;
const ptRefreshed = {};
async function deviceCached(name, fetcher){
  const key = PT_CACHE_PREFIX + name;
  const held = cacheRead(key);
  if(held !== null && held !== undefined){
    const last = Number(localStorage.getItem(key + ':at') || 0);
    const stale = !last || (Date.now() - last) > PT_STALE_MS;
    /* Answer now. Catch up behind only if the copy has had time to go out of
       date, and only once per name per session. */
    if(stale && !ptRefreshed[name]){
      ptRefreshed[name] = true;
      setTimeout(() => {
        Promise.resolve(fetcher()).then(fresh => {
          if(fresh === null || fresh === undefined) return;
          try{ localStorage.setItem(key + ':at', String(Date.now())); }catch(e){}
          if(JSON.stringify(fresh) !== JSON.stringify(held)){ cacheWrite(key, fresh); repaint(); }
        }).catch(() => {});
      }, 0);
    }
    return held;
  }
  const fresh = await fetcher();
  if(fresh !== null && fresh !== undefined){
    cacheWrite(key, fresh);
    try{ localStorage.setItem(key + ':at', String(Date.now())); }catch(e){}
  }
  return fresh;
}

function computePendingFromData(bills, entries){
  const map = {};
  const ensure = (id) => (map[id] || (map[id] = { totalBilled:0, totalPayments:0, name:'' }));
  (bills||[]).forEach(b=>{
    if(!billCountsAsMoney(b) || !b.patientId) return;
    const rec = ensure(b.patientId);
    rec.totalBilled += Number(b.grandTotal) || 0;
    if(b.patientName) rec.name = b.patientName;
  });
  (entries||[]).forEach(e=>{
    (Array.isArray(e.items) ? e.items : []).forEach(it=>{
      if(!it || !it.patientId) return;
      if(isVoidedItem(it)) return;
      if(isReversedItem(it)) return;
      if(it.method === 'writeoff'){        // reduces the balance, no cash moves
        const rec = ensure(it.patientId);
        rec.totalPayments += Number(it.amount) || 0;
        if(it.patientName) rec.name = it.patientName;
        return;
      }
      const rec = ensure(it.patientId);
      rec.totalPayments += (it.method === 'refund' ? -1 : 1) * (Number(it.amount) || 0);
      if(it.patientName) rec.name = it.patientName;
    });
  });
  Object.keys(map).forEach(id => { map[id].pending = map[id].totalBilled - map[id].totalPayments; });
  return map;
}
