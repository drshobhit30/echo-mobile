   who read it have no reason to see any of that. And it writes nothing: the
   Drive scope is drive.readonly, so there is no path from this app back to
   the clinic's files even if one were coded by mistake.
   ========================================================================== */
/* The build, on screen. When somebody says it is behaving oddly, the first
   question is which copy they are holding — a phone can sit on a cached one
   for days. */
/* Its own line of versions, starting where lite's leaves off in spirit but
   numbered from a1 so the two can never be mistaken for each other in a
   screenshot. */
/* The letter is already in the mark beside it — "Nexus A a2.0" said it
   twice. The number alone, and bumped for the loader repairs. */
const ADMIN_VERSION = '4.1';
let currentTab = 'calendar';
let openRx = null;
/* Which patient, if any, has had their older prescriptions unfolded. */
let openAllFor = null;
/* Which prescription inside the open card is expanded. null means "the
   newest one", which is what a freshly opened card shows. */
let openLine = null;
function showAllFor(pid){ openAllFor = String(pid); repaint(); }
function toggleLine(k){ openLine = (openLine === k) ? '' : k; repaint(); }

/* WHOSE APP THIS IS. The name is kept on the device, so the same file greets
   whoever is holding it — the associate by name, reception by theirs. Tapping
   the greeting sets it; until then it says "Doctor", which is true of the
   person it was built for and harmless for anyone else. */
const CACHE_KEY_NAME = 'echoAdmin_name';
function greetingWord(){
  const h = new Date().getHours();
  if(h < 12) return 'Good morning,';
  if(h < 17) return 'Good afternoon,';
  return 'Good evening,';
}
function paintGreeting(){
  const g = document.getElementById('hdGreet'), n = document.getElementById('hdWho');
  if(g) g.textContent = greetingWord();
  if(n) n.textContent = (localStorage.getItem(CACHE_KEY_NAME) || 'Doctor');
}
function askName(){
  const now = localStorage.getItem(CACHE_KEY_NAME) || '';
  const v = window.prompt('Name to greet you by', now);
  if(v === null) return;                       // cancelled: leave it alone
  const clean = String(v).trim().slice(0, 28);
  try{
    if(clean) localStorage.setItem(CACHE_KEY_NAME, clean);
    else localStorage.removeItem(CACHE_KEY_NAME);
  }catch(e){}
  paintGreeting();
}

/* PULL TO REFRESH (v2.2). The refresh button is gone, so the gesture has to
   do what it did: clear what the device holds and read Drive again. The
   browser's own pull would reload the page and keep the cache, which is the
   opposite of what somebody pulling down wants.

   It arms only at the very top of the page, so a pull halfway down a long
   list scrolls as normal. */
let pullStartY = null, pullDist = 0, pullArmed = false, pullBusy = false;
const PULL_TRIGGER = 70;
function pullSetText(t){ const el = document.getElementById('pullText'); if(el) el.textContent = t; }
function pullShow(px){
  const cue = document.getElementById('pullCue');
  if(!cue) return;
  cue.style.height = Math.min(px, 64) + 'px';
  cue.style.opacity = Math.min(px / PULL_TRIGGER, 1);
}
function pullReset(){
  pullStartY = null; pullDist = 0; pullArmed = false; pullBusy = false;
  const cue = document.getElementById('pullCue');
  if(cue){ cue.style.height = '0px'; cue.style.opacity = '0'; }
  pullSetText('Pull to refresh');
}
function wirePull(){
  document.addEventListener('touchstart', e => {
    if(pullBusy || window.scrollY > 0 || !e.touches || e.touches.length !== 1) return;
    pullStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if(pullStartY === null || pullBusy) return;
    pullDist = e.touches[0].clientY - pullStartY;
    if(pullDist <= 0){ pullReset(); return; }
    pullShow(pullDist * 0.5);
    const armed = pullDist > PULL_TRIGGER;
    if(armed !== pullArmed){ pullArmed = armed; pullSetText(armed ? 'Release to refresh' : 'Pull to refresh'); }
  }, { passive: true });
  document.addEventListener('touchend', () => {
    if(pullStartY === null || pullBusy) return;
    if(!pullArmed){ pullReset(); return; }
    pullBusy = true; pullSetText('Reading\u2026');
    doRefresh().then(pullReset).catch(pullReset);
  }, { passive: true });
}
/* Exactly what the button did: drop every layer the device holds, then read. */
async function doRefresh(){
  directoryCache = null; directoryTried = false;
  rxIndexCache = null; rxIndexTried = false;
  cachedRxFolderId = null; cachedSettingsFolderId = null;
  contactsCache = null; contactsTried = false;
  rxVerifyDone = false; refreshScheduled = false;
  openRx = null; openLine = null; openAllFor = null;
  cacheClear(); forgetIds();
  try{
    const doomed = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(PT_CACHE_PREFIX) === 0) doomed.push(k);
    }
    doomed.forEach(k => localStorage.removeItem(k));
  }catch(e){}
  crmTried = createdTried = orthoTried = notesTried = false;
  labCasesTried = followupsTriedD = implantLogTriedM = visitsIdxTried = false;
  cachedBills = null; cachedEntriesIndex = null; entriesIndexTried = false;
  try{ localStorage.removeItem('echoAdmin_bills');
       localStorage.removeItem('echoAdmin_entries'); }catch(e){}
  billsRevalidate = true; entriesRevalidate = true;
  setTab(currentTab);
  await new Promise(r => setTimeout(r, 400));
}

/* THE MENU'S OWN MARKS (a2.6). Six word-tabs would not fit a phone: "Follow-
   ups" wrapped onto two lines and shoved the row out of shape. A drawn mark
   above a short word fits, and reads faster than either alone.

   Drawn, not fetched: each is a handful of bytes of SVG, sharp at any size,
   and there is no second request for a picture of a wallet. */
function svgIcon(paths, extra){
  return '<svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
    + ' stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"'
    + (extra || '') + '>' + paths + '</svg>';
}
const ICON = {
  calendar: svgIcon('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/>'),
  payment:  svgIcon('<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/>'),
  billing:  svgIcon('<path d="M6 2h12v20l-3-2-3 2-3-2-3 2Z"/><path d="M9 7h6M9 11h6M9 15h4"/>'),
  lab:      svgIcon('<path d="M12 3c3 0 4 1.6 4 4 0 2-.7 3.2-1 5.5-.3 2.4-.4 6.5-1.7 6.5-1 0-.9-3-1.3-4.6-.4 1.6-.3 4.6-1.3 4.6-1.3 0-1.4-4.1-1.7-6.5C8.7 10.2 8 9 8 7c0-2.4 1-4 4-4Z"/>'),
  followups:svgIcon('<path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2.2 2A16 16 0 0 1 3 6.2 2 2 0 0 1 5 4Z"/>'),
  patients: svgIcon('<circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>'),
  tel:      svgIcon('<path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2.2 2A16 16 0 0 1 3 6.2 2 2 0 0 1 5 4Z"/>',
                    ' style="width:15px;height:15px;vertical-align:-2px;margin-right:5px"')
};
const ADMIN_VIEWS = { calendar:'viewCalendar', payment:'viewPayment', billing:'viewBilling',
                      lab:'viewLab', followups:'viewFollowups', patients:'viewPatients', litepatients:'viewLitePatients' };
/* The desk's own words. "Calls" was shorter and fitted better, and that is
   not a good enough reason for the phone to call a thing by a different name
   than the screen it is read beside. The label is made to fit instead. */
/* Locked: lite's two. Unlocked: the six, with "Flw-Up" so all six labels
   stay on one line (owner's call, 4.0). */
const ADMIN_TABS_UNLOCKED = [
  ['calendar','Calendar'], ['payment','Payment'], ['billing','Billing'],
  ['lab','Lab'], ['followups','Flw-Up'], ['patients','Patients']
];
const ADMIN_TABS_LOCKED = [ ['calendar','Calendar'], ['litepatients','Patients'] ];
const ADMIN_ONLY_TABS = ['payment', 'billing', 'lab', 'followups'];
function adminTabs(){ return adminOn() ? ADMIN_TABS_UNLOCKED : ADMIN_TABS_LOCKED; }
function paintTabs(){
  const bar = document.querySelector('.tabbar');
  if(!bar) return;
  bar.classList.toggle('locked', !adminOn());
  bar.innerHTML = adminTabs().map(([k, label]) =>
    '<button type="button" class="tab-btn' + (currentTab === k ? ' active' : '') + '"'
    + ' data-tab="' + k + '" onclick="setTab(\'' + k + '\')">'
    + (ICON[k === 'litepatients' ? 'patients' : k] || '') + '<span>' + label + '</span></button>').join('');
}
function setTab(t){
  /* Money is never shown locked, whatever asked for it. */
  if(!adminOn() && (ADMIN_ONLY_TABS.indexOf(t) !== -1 || t === 'patients')) t = (t === 'patients' ? 'litepatients' : 'calendar');
  if(adminOn() && t === 'litepatients') t = 'patients';
  currentTab = t;
  try{ Cal.closeDrawer(); Cal.closePrevRx(); }catch(e){}
  paintTabs();
  Object.keys(ADMIN_VIEWS).forEach(k =>
    document.getElementById(ADMIN_VIEWS[k]).classList.toggle('hidden', k !== t));
  closeRx();
  renderCurrent();
}
/* NOTHING IS READ FOR A TAB THAT IS NOT OPEN (a2.0). The bills and payments
   indexes are the largest files the clinic has; reading them on boot would
   slow down every open for the sake of a page that may never be looked at.
   Each tab fetches what it needs the moment it is shown, and not before. */
function renderCurrent(){
  if(currentTab === 'payment')   return renderPayment();
  if(currentTab === 'billing')   return renderBilling();
  if(currentTab === 'lab')       return renderLab();
  if(currentTab === 'followups') return renderFollowups();
  if(currentTab === 'patients')  return renderPatientsTab();
  if(currentTab === 'litepatients') return Cal.renderPatients();
  return Cal.renderCalendar();
}

/* HOW LONG AGO, in the words a person would use. The desktop says "2 days
   ago" and "3 months ago" rather than a date nobody subtracts in their head;
   this says the same, with the date underneath for anyone who wants it. */
function agoWords(dateStr){
  const d = String(dateStr || '').slice(0, 10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return '';
  const [y, m, dd] = d.split('-').map(Number);
  const then = new Date(y, m - 1, dd), now = new Date();
  const days = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - then) / 86400000);
  if(days < 0) return 'later today';
  if(days === 0) return 'today';
  if(days === 1) return 'yesterday';
  if(days < 7) return days + ' days ago';
  if(days < 14) return 'last week';
  if(days < 31) return Math.floor(days / 7) + ' weeks ago';
  const months = Math.round(days / 30.4);
  if(months < 12) return months + (months === 1 ? ' month ago' : ' months ago');
  const years = Math.floor(days / 365);
  const rem = Math.round((days - years * 365) / 30.4);
  return years + (years === 1 ? ' year' : ' years') + (rem ? ' ' + rem + 'm' : '') + ' ago';
}

/* One cache, not two. This used to keep its own copy on top of the loader's,
   so Refresh cleared the outer one and got the stale inner one back. */
async function getRxIndex(){
  try{ return await loadPrescriptions(); }
  catch(err){
    if(err && err.name === 'TokenExpiredError') throw err;
    return null;
  }
}
/* WHAT THE PHONE KEEPS (v1.4). Every open re-read the whole patient
   directory and prescriptions index before showing anything, over whatever
   signal the phone had. Both are now kept on the device: the page paints
   from what is already there and re-reads behind it, so a second open is
   immediate and a slow signal delays only the update, not the answer.

   Kept deliberately small in consequence: nothing is written that was not
   already on screen, and Refresh still clears it. If the browser refuses the
   write — the index can be large and storage is capped — the app carries on
   reading over the wire, which is exactly what it did before. */
const CACHE_KEY_DIR = 'echoAdmin_dir', CACHE_KEY_RX = 'echoAdmin_rx', CACHE_KEY_AT = 'echoAdmin_at';
function cacheRead(key){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function cacheWrite(key, value){
  try{
    localStorage.setItem(key, JSON.stringify(value));
    localStorage.setItem(CACHE_KEY_AT, String(Date.now()));
    return true;
  }catch(e){
    /* Out of room: drop the biggest first and keep the small ones, rather
       than lose everything. Bills and payments are the largest by far, and
       losing them costs one read; losing the names costs every page. */
    try{
      localStorage.removeItem('echoAdmin_entries');
      localStorage.removeItem('echoAdmin_bills');
    }catch(e2){}
    return false;
  }
}
function cacheClear(){
  [CACHE_KEY_DIR, CACHE_KEY_RX, CACHE_KEY_AT, CACHE_KEY_CON, 'echoAdmin_verified']
    .forEach(k => { try{ localStorage.removeItem(k); }catch(e){} });
  /* And every day that was kept, or Refresh could not correct one. */
  try{
    const doomed = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('echoAdmin_day_') === 0) doomed.push(k);
    }
    doomed.forEach(k => localStorage.removeItem(k));
  }catch(e){}
}
async function getDirectory(){
  try{ return (await loadPatientDirectory()) || {}; }catch(e){ return {}; }
}

/* EVERY LOOKUP, REMEMBERED (v1.5). A Drive id never changes, but the app was
   asking for the same ones on every open: which folder is 'settings', which
   file is 'patients.json', which is today's day file. Each question is a
   round trip. They are resolved once and kept on the device, so a second
   open spends its network on the data itself rather than on finding it
   again. An id that has gone stale simply fails to read, and the entry is
   dropped and asked for afresh. */
/* The cached pair, if the device has them. Used to paint; never trusted as
   the last word — a re-read always follows. */
function cachedDirectory(){ return cacheRead(CACHE_KEY_DIR); }
function cachedRxIndex(){ return cacheRead(CACHE_KEY_RX); }
/* Both loaders ask for the catch-up read; it should happen once a session,
   not once per loader. */
let refreshScheduled = false;
function scheduleRefreshBehind(){
  if(refreshScheduled) return;
  refreshScheduled = true;
  setTimeout(refreshBehind, 0);
}
let refreshingInBackground = false;
/* Straight to Drive, deliberately NOT through the loaders above — they would
   hand back the very cache this exists to replace. Only a real difference
   repaints, so a background check on unchanged data is invisible. */
async function refreshBehind(){
  if(refreshingInBackground) return;
  refreshingInBackground = true;
  try{
    const settingsId = await getSettingsFolderId();
    if(!settingsId) return;
    let changed = false;

    const dirId = await driveFindChild(settingsId, 'patients.json', false);
    if(dirId){
      const dir = await driveReadJson(dirId);
      if(dir && typeof dir === 'object' && Object.keys(dir).length
         && JSON.stringify(dir) !== JSON.stringify(cachedDirectory())){
        directoryCache = dir; cacheWrite(CACHE_KEY_DIR, dir); changed = true;
      }
    }

    const conId = await driveFindChild(settingsId, 'patient-contacts.json', false);
    if(conId){
      const con = await driveReadJson(conId);
      if(con && typeof con === 'object' && Object.keys(con).length
         && JSON.stringify(con) !== JSON.stringify(cacheRead(CACHE_KEY_CON))){
        contactsCache = con; cacheWrite(CACHE_KEY_CON, con); changed = true;
      }
    }

    const rxId = await driveFindChild(settingsId, 'prescriptions-index.json', false);
    if(rxId){
      const idx = await driveReadJson(rxId);
      if(idx && Array.isArray(idx.list)){
        const held = cachedRxIndex();
        if(!held || held.length !== idx.list.length
           || JSON.stringify(held[0] || null) !== JSON.stringify(idx.list[0] || null)){
          rxIndexCache = idx.list; cacheWrite(CACHE_KEY_RX, idx.list); changed = true;
        }
        verifyRxIndexLater(idx);
      }
    }
    if(changed) repaint();
  }catch(e){ /* offline or expired: what is on screen stays */ }
  finally{ refreshingInBackground = false; }
}
function rxFor(all, patientId){
  const byDate = (a, b) => String(b.date || b.createdAt || '').localeCompare(String(a.date || a.createdAt || ''));
  return (all || [])
    .filter(r => r && String(r.patientId) === String(patientId))
    /* Struck ones sink rather than vanish — the desk strikes, it does not
       erase, and a reader who cannot see the correction cannot trust it. */
    .sort((a, b) => (rxIsStruck(a) ? 1 : 0) - (rxIsStruck(b) ? 1 : 0) || byDate(a, b));
}

/* THE WHOLE PRESCRIPTION, opened where it was tapped rather than in a sheet
   that covers the list: on a phone the thing you were reading should still
   be on screen when you close what you opened. */
/* The contents of one prescription, with no box of its own — the card it
   sits in provides that. */
function rxDetailHtml(rec){
  const row = (k, v) => v ? '<div class="rxs-k">' + k + '</div><div class="rxs-v">' + escapeHtml(v) + '</div>' : '';
  const meds = ((rec.medicines) || []).filter(m => m && m.name);
  return '<div class="rx-detail">'
    + (rxIsStruck(rec) ? '<div class="muted" style="font-size:0.8rem;">Struck'
        + (rec.struckReason ? ' \u00b7 ' + escapeHtml(rec.struckReason) : '') + '</div>' : '')
    + row('Complaints', rec.complaints)
    + row('Investigations', rec.investigations)
    + row('Treatment', rec.treatment)
    + (meds.length
        ? '<div class="rxs-k">Medicines</div>' + meds.map(m =>
            '<div class="rxs-med">' + escapeHtml(m.name)
            + '<div class="rxs-dose">'
            + escapeHtml([m.dose, m.duration, m.food ? m.food + ' food' : ''].filter(Boolean).join(' \u00b7 ') || '\u2014')
            + '</div></div>').join('')
        : '')
    + row('Advice', rec.advice)
    + (!meds.length && !rec.treatment && !rec.advice && !rec.complaints && !rec.investigations
        ? '<div class="muted" style="font-size:0.86rem;">Nothing was written on this one.</div>' : '')
    + '</div>';
}
/* The Patients page still shows one prescription at a time in its own box. */
function toggleRx(key){
  openRx = (openRx === key) ? null : key;
  openAllFor = null;          // closing a patient folds their history again
  openLine = null;            // and the next one opens on its newest again
  repaint();
}
function closeRx(){ openRx = null; repaint(); }
function repaint(){ renderCurrent(); }

/* ---------------------------- VISITS ------------------------------------ */
/* WHICH DAY IS BEING READ. Today when the app opens; the arrows walk back a
   day at a time and the picker jumps. Never forward of today, because there
   are no visits in the future and a blank page is a worse answer than a
   control that will not go there. */
let moneyPeriod = 'day';                 // day | month | year
let moneyDay = todayStr();
function moneyKey(){
  return moneyPeriod === 'day' ? moneyDay
       : moneyPeriod === 'month' ? moneyDay.slice(0, 7)
       : moneyDay.slice(0, 4);
}
function moneyLabelText(){
  if(moneyPeriod === 'day')  return shortDateMobile(moneyDay) + (moneyDay === todayStr() ? ' \u00b7 Today' : '');
  if(moneyPeriod === 'month'){
    const [y, m] = moneyDay.split('-').map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString('en-IN', { month:'long', year:'numeric' });
  }
  return moneyDay.slice(0, 4);
}
function setMoneyPeriod(p){ moneyPeriod = p; openBill = null; renderCurrent(); }
function stepMoney(delta){
  const [y, m, d] = moneyDay.split('-').map(Number);
  let dt;
  if(moneyPeriod === 'day')        dt = new Date(y, m - 1, d + delta);
  else if(moneyPeriod === 'month') dt = new Date(y, m - 1 + delta, 1);
  else                             dt = new Date(y + delta, 0, 1);
  const cand = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0')
             + '-' + String(dt.getDate()).padStart(2, '0');
  /* Never past today: there is no money in the future, and an empty page is
     a worse answer than a control that will not go there. */
  if(cand.slice(0, moneyPeriod === 'day' ? 10 : moneyPeriod === 'month' ? 7 : 4)
     > todayStr().slice(0, moneyPeriod === 'day' ? 10 : moneyPeriod === 'month' ? 7 : 4)) return;
  moneyDay = cand; openBill = null;
  renderCurrent();
}
/* Every page that shows a period draws its control through here. Three
   copies of the same three buttons is how one of them ends up stale. */
function paintPeriod(rowId, labelId, nextBtnId){
  const chips = document.getElementById(rowId);
  if(chips) chips.innerHTML = periodChipsHtml();
  const lab = document.getElementById(labelId);
  if(lab) lab.textContent = moneyLabelText();
  const nb = document.getElementById(nextBtnId);
  if(nb) nb.style.visibility = atLatestPeriod() ? 'hidden' : 'visible';
}
function periodChipsHtml(){
  return ['day','month','year'].map(p =>
    '<button type="button" class="per-chip' + (moneyPeriod === p ? ' on' : '') + '"'
    + ' onclick="setMoneyPeriod(\'' + p + '\')">' + p[0].toUpperCase() + p.slice(1) + '</button>').join('');
}
function inPeriod(dateStr){
  const d = String(dateStr || '');
  const k = moneyKey();
  return d.slice(0, k.length) === k;
}
/* THE FIGURE IS THE PAGE (a2.3). Four tiles in a row meant the money did not
   fit its own box: ₹20,65,... told you nothing, and it was the total — the
   one number the page exists for — that got cut. The total now has the width
   to itself and is never abbreviated; the split is a tap away, which is where
   it belongs, because you look at a split after you have read the total. */
let splitOpen = false;
function toggleSplit(){ splitOpen = !splitOpen; renderCurrent(); }
function totalBlock(label, value, parts, note){
  const shown = (parts || []).filter(p => p[1]);
  return '<div class="tot' + (splitOpen ? ' tot-open' : '') + '"'
      + (shown.length ? ' onclick="toggleSplit()"' : '') + '>'
    + '<div class="tot-row">'
      + '<div><div class="tot-v">' + value + '</div>'
        + '<div class="tot-k">' + label + (note ? ' \u00b7 ' + note : '') + '</div></div>'
      + (shown.length ? '<div class="tot-chev">' + (splitOpen ? '\u2013' : '+') + '</div>' : '')
    + '</div>'
    + (splitOpen && shown.length
        ? '<div class="tot-split">' + shown.map(p =>
            '<div class="tot-s"><span class="tot-sv">' + p[1] + '</span>'
            + '<span class="tot-sk">' + p[0] + '</span></div>').join('') + '</div>'
        : '')
    + '</div>';
}

/* ---------------------------- PAYMENT ---------------------------------- */
async function renderPayment(){
  paintPeriod('payPeriod', 'moneyLabel', 'moneyNextBtn');

  const list = document.getElementById('payList');
  const entries = await loadAllEntries().catch(() => null);
  if(entries === null){
    list.innerHTML = nothingHere();
    document.getElementById('moneyTotals').innerHTML = '';
    return;
  }
  const dir = await getDirectory();
  /* One row per payment, not per entry: an entry is a day's book and holds
     many. A refund counts against the day, as the desk counts it. */
  /* THE DESK'S OWN ARITHMETIC (a2.2). This used to add the amounts up by
     hand, which quietly disagreed with the clinic PC in four ways: a
     write-off is not money, an item reversed on the same day never counted,
     an unknown method silently vanished instead of folding into cash, and a
     day whose stored totals exceed its items is taken at its stored figure.
     entryModeTotals is the function the desk itself uses; it is used here so
     the two cannot drift apart. */
  const byMode = { cash:0, upi:0, card:0, bank:0 };
  let total = 0;
  const rows = [];
  (entries || []).forEach(e => {
    if(!e || !inPeriod(e.date)) return;
    const t = entryModeTotals(e);
    ['cash','upi','card','bank'].forEach(m => { byMode[m] += t[m]; total += t[m]; });
    /* The list below is what made up that figure, so it follows the same
       rules — anything the totals ignore is not listed either. */
    (e.items || []).forEach(it => {
      if(!it || isVoidedItem(it)) return;
      if(it.method === 'writeoff') return;
      if(reversalExcludesFromDayTotals(it)) return;
      const amt = (it.method === 'refund' ? -1 : 1) * (Number(it.amount) || 0);
      rows.push({ date: e.date, pid: String(it.patientId || ''), amt,
                  mode: String(it.method || 'cash').toLowerCase(),
                  name: (dir && dir[String(it.patientId)]) || it.patientName || 'Unknown patient' });
    });
  });
  /* Every method, not the top three: a split that hides one of its own parts
     does not add up to the figure above it. */
  document.getElementById('moneyTotals').innerHTML = totalBlock('collected', fmtINR(total),
    ['cash','upi','card','bank'].map(m => [m, byMode[m] ? fmtINR(byMode[m]) : '']), '');
  rollOrSet('payCount', rows.length);
  if(!rows.length){
    /* A day can carry a total without carrying the payments that made it —
       the desk allows a lump sum to be entered on its own. Saying "nothing
       taken" under a figure of two lakh is the page contradicting itself. */
    list.innerHTML = '<div class="empty-state">'
      + (total ? 'Entered as a day total, without the individual payments' : 'Nothing taken')
      + '</div>';
    return;
  }
  rows.sort((a, b) => String(b.date).localeCompare(String(a.date)) || b.amt - a.amt);
  list.innerHTML = rows.slice(0, 200).map(r =>
      '<div class="pt-card"><div class="pt-top"><div class="pt-main">'
    + '<div class="pt-name">' + escapeHtml(r.name) + '</div>'
    + '<div class="pt-sub">' + escapeHtml(r.pid) + ' \u00b7 ' + escapeHtml(r.mode)
      + (moneyPeriod === 'day' ? '' : ' \u00b7 ' + escapeHtml(shortDateMobile(r.date))) + '</div>'
    + '</div><div class="pt-side"><div class="pt-amt' + (r.amt < 0 ? ' neg' : '') + '">'
      + fmtINR(r.amt) + '</div></div></div></div>').join('')
    + (rows.length > 200 ? '<div class="empty-state">' + (rows.length - 200) + ' more \u2014 narrow the period</div>' : '');
}
function atLatestPeriod(){
  const k = moneyKey(), t = todayStr();
  return k === (moneyPeriod === 'day' ? t : moneyPeriod === 'month' ? t.slice(0, 7) : t.slice(0, 4));

function billLinesHtml(b){
  const items = (b.items || b.lines || []).filter(Boolean);
  const money = n => fmtINR(Number(n) || 0);
  let h = '<div class="pt-body bill-body">';
  if(items.length){
    h += items.map(it => {
      const qty = Number(it.qty || it.quantity || 1) || 1;
      const rate = Number(it.rate || it.price || 0) || 0;
      const amt  = it.amount != null ? Number(it.amount) : qty * rate;
      return '<div class="bl-row"><div class="bl-name">' + escapeHtml(String(it.name || it.item || it.description || 'Item'))
        + (qty > 1 ? ' <span class="muted">\u00d7' + qty + '</span>' : '')
        + (it.discount ? ' <span class="muted">\u2212' + escapeHtml(String(it.discount)) + '%</span>' : '')
        + '</div><div class="bl-amt">' + money(amt) + '</div></div>';
    }).join('');
  } else {
    h += '<div class="muted" style="font-size:0.84rem;">No lines recorded on this bill.</div>';
  }
  /* Only the figures the bill actually carries: a zero discount printed on
     every bill is noise, and a total invented here could disagree with the
     one above it. */
  const foot = [];
  if(b.subTotal != null) foot.push(['Sub-total', money(b.subTotal)]);
  if(Number(b.discountAmount)) foot.push(['Discount', '\u2212' + money(b.discountAmount)]);
  if(Number(b.taxAmount)) foot.push(['Tax', money(b.taxAmount)]);
  foot.push(['Total', money(b.grandTotal)]);
  h += '<div class="bl-foot">' + foot.map(f =>
      '<div class="bl-row"><div class="bl-name">' + f[0] + '</div><div class="bl-amt">' + f[1] + '</div></div>'
    ).join('') + '</div>';
  return h + '</div>';
}

async function renderMoneyMoved(){
  /* THE CONTROL WAS ONLY DRAWN BY THE OTHER BRANCH (a3.0). Money moved
     updated its label and its list when the period changed, but never
     redrew the Day/Month/Year chips — so the highlight stayed where the
     bills page had left it. The period WAS changing; the control simply
     never said so, which reads as a dead button. */
  paintPeriod('billPeriod', 'billLabel', 'billNextBtn');
  document.getElementById('billSecTitle').textContent = 'Taken out of the books';
  const list = document.getElementById('billList');
  const [bills, entries] = await Promise.all([
    loadBills().catch(() => null), loadAllEntries().catch(() => null)
  ]);
  if(bills === null || entries === null){
    list.innerHTML = nothingHere();
    document.getElementById('billTotals').innerHTML = '';
    return;
  }
  const k = moneyKey();
  const from = k.length === 10 ? k : k.length === 7 ? k + '-01' : k + '-01-01';
  const to   = k.length === 10 ? k : k.length === 7 ? k + '-31' : k + '-12-31';
  const rows = moneyMovedRows(bills, entries, from, to);
  const cash = rows.filter(r => r.kind !== 'Written off');
  const total = cash.reduce((t, r) => t + Math.abs(r.amount || 0), 0);
  const off   = rows.filter(r => r.kind === 'Written off')
                    .reduce((t, r) => t + Math.abs(r.amount || 0), 0);
  const byKind = {};
  rows.forEach(r => { byKind[r.kind] = (byKind[r.kind] || 0) + 1; });
  document.getElementById('billTotals').innerHTML = totalBlock('taken out of the books',
    fmtINR(total), Object.keys(byKind).map(k2 => [k2, String(byKind[k2])]),
    off ? fmtINR(off) + ' written off' : '');
  rollOrSet('billCount', rows.length);
  if(!rows.length){ list.innerHTML = '<div class="empty-state">Nothing was taken out</div>'; return; }
  list.innerHTML = rows.slice(0, 200).map(r =>
      '<div class="pt-card"><div class="pt-top"><div class="pt-main">'
    + '<div class="pt-name">' + escapeHtml(r.who) + '</div>'
    + '<div class="pt-sub">' + escapeHtml(shortDateMobile(r.date))
      + (r.ref ? ' \u00b7 ' + escapeHtml(String(r.ref)) : '')
      + (r.by ? ' \u00b7 by ' + escapeHtml(r.by) : '') + '</div>'
    + '<div class="pt-tag pt-tag-wait">' + escapeHtml(r.kind) + '</div>'
    /* The reason is the point of the screen: an act with no reason given is
       said to have none, rather than left blank as though none was asked. */
    + '<div class="mm-why">' + escapeHtml(r.reason || 'no reason recorded') + '</div>'
    + '</div><div class="pt-side"><div class="pt-amt neg">'
      + (r.amount == null ? '\u2014' : fmtINR(Math.abs(r.amount))) + '</div></div>'
    + '</div></div>').join('');

/* ======================= MONEY MOVED ====================================
   Every cancellation, reversal and write-off in one place.

   These acts are permanent by design, and what keeps that safe is not a
   second lock but visibility: one place an owner can see who took money out
   of the books, when, and why. Scattered across the bills, the day entries
   and the stock log, they are findable only by somebody who already suspects
   something.

   The desk's own rule throughout, including the one that matters most: an
   act is dated by WHEN IT HAPPENED, not when the bill was raised. A bill
   from March cancelled in August belongs to August.

   It lives under Billing rather than as a tile of its own, and follows the
   same period — the old phone showed today only, which answered "what moved
   today" and never "what moved last month". */
function moneyMovedRows(bills, entries, from, to){
  const rows = [];
  const inRange = d => d && d >= from && d <= to;

  (bills || []).forEach(b => {
    if(!b || !isCancelledBill(b)) return;
    const when = b.cancellation.cancelledAt ? localDateOf(b.cancellation.cancelledAt) : b.date;
    if(!inRange(when)) return;
    rows.push({ date: when,
      kind: isCreditNote(b) ? 'Credit note cancelled' : 'Bill cancelled',
      who: (b.patientName || '\u2014') + (b.patientId ? ' (' + b.patientId + ')' : ''),
      amount: -(Number(b.grandTotal) || 0),
      reason: b.cancellation.reason || '',
      by: b.cancellation.cancelledBy || '',
      ref: b.billNumber || b.billNo || '' });
  });

  (entries || []).forEach(e => {
    (Array.isArray(e.items) ? e.items : []).forEach(it => {
      if(!it) return;
      const who = (it.patientName || '\u2014') + (it.patientId ? ' (' + it.patientId + ')' : '');
      const amt = Number(it.amount) || 0;
      if(isVoidedItem(it)){
        const when = it.voidedAt ? localDateOf(it.voidedAt) : e.date;
        if(inRange(when)) rows.push({ date: when, kind:'Payment cancelled', who,
          amount:-amt, reason:'', by:'', ref:e.date });
      } else if(it.reversal){
        const when = it.reversal.reversedAt ? localDateOf(it.reversal.reversedAt) : e.date;
        if(inRange(when)) rows.push({ date: when, kind:'Payment reversed', who,
          amount:-amt, reason: it.reversal.reason || '',
          by: it.reversal.reversedBy || '', ref:e.date });
      } else if(it.method === 'writeoff'){
        /* Not cash: the balance was forgiven, no rupee left a till. It is
           still money out of the books and belongs on this screen. */
        if(inRange(e.date)) rows.push({ date:e.date, kind:'Written off', who,
          amount:-amt, reason: it.note || '', by: it.by || '', ref:e.date });
      }
    });
  });
  return rows.sort((a, b) => String(b.date).localeCompare(String(a.date)));
}

/* ------------------------------- LAB ------------------------------------ */
async function renderLab(){
  const list = document.getElementById('labList');
  const cases = await deviceCached('labs', () => loadLabCases()).catch(() => null);
  if(cases === null){ list.innerHTML = nothingHere(); return; }
  const dir = await getDirectory();
  const live = (cases || []).filter(c => c && !c.struckAt && !labCaseIsVoid(c));
  /* The desk's own three stages, and its own thresholds, so the phone and
     the desk never disagree about what is late. */
  /* labStageOf returns an OBJECT with a .key, and its key for a case at the
     lab is 'sent'. Matching the returned object against a string quietly put
     every case in no group at all. */
  /* The desk's own words for its own stages — labStageOf already carries
     them, so the phone stops inventing synonyms for them. */
  const groups = [
    ['sent',     'Sent to lab',      7],
    ['received', 'Received',         7],
    ['logged',   'Waiting pick-up',  2]
  ];
  const today = todayStr();
  const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
  let html = '';
  groups.forEach(([stage, title, limit]) => {
    const mine = live.filter(c => (labStageOf(c) || {}).key === stage);
    html += '<div class="sec-head"><span class="sec-title">' + title + '</span>'
          + '<span class="count-badge">' + mine.length + '</span></div>';
    if(!mine.length){ html += '<div class="empty-state">None</div>'; return; }
    mine.sort((a, b) => String(a.dateSent || a.dateLogged || '').localeCompare(String(b.dateSent || b.dateLogged || '')));
    html += mine.map(c => {
      /* Waiting since the stage began, not since the case was first logged:
         a crown that came back yesterday has been waiting a day, whatever
         date it was sent. */
      const since = stage === 'received' ? (c.dateReceived || c.dateSent || c.dateLogged)
                  : stage === 'sent'     ? (c.dateSent || c.dateLogged)
                  : (c.dateLogged || '');
      const age = since ? daysBetween(since, today) : null;
      const late = age !== null && age > limit;
      const name = (dir && dir[String(c.patientId)]) || c.patientName || 'Unknown patient';
      return '<div class="pt-card"><div class="pt-top"><div class="pt-main">'
        + '<div class="pt-name">' + escapeHtml(name) + '</div>'
        + '<div class="pt-sub">' + escapeHtml(String(c.patientId || ''))
          /* The desk's own field names: workType and lab. */
          + (c.workType ? ' \u00b7 ' + escapeHtml(c.workType) : '')
          /* labName is the desk's field; 'lab' was never written, so no
             card showed its lab until a3.5. */
          + (c.labName ? ' \u00b7 ' + escapeHtml(c.labName) : '') + '</div>'
        + (late ? '<div class="pt-tag pt-tag-wait">' + age + ' days \u2014 overdue</div>' : '')
        + '</div><div class="pt-side"><div class="pt-f"><b>' + (age === null ? '\u2014' : age + 'd')
          + '</b><span>waiting</span></div></div></div></div>';
    }).join('');
  });
  list.innerHTML = html;
}

/* ---------------------------- FOLLOW-UPS -------------------------------- */
/* A FOLLOW-UP HAS A STATUS, NOT A DUE DATE (a2.4). This page looked for a
   dueDate the desk does not write, found none, and reported "Nobody to call"
   on a list that was never empty. The desk keeps four open statuses and two
   that close an entry; these are its own definitions, copied. */
const FU_DEFS = {
  pending:           { label:'Pending',            tone:'pend',   priority:0, resolved:false },
  needs_doctor_call: { label:'Needs Doctor Call',  tone:'urgent', priority:0, resolved:false },
  not_received:      { label:'Call Not Received',  tone:'warn',   priority:1, resolved:false },
  discomfort:        { label:'Slight Discomfort',  tone:'watch',  priority:2, resolved:false },
  all_ok:            { label:'All OK',             tone:'ok',     priority:3, resolved:true  },
  not_needed:        { label:'Not Needed',         tone:'neutral',priority:3, resolved:true  }
};
const FU_ALIASES = { call_done: 'all_ok' };
function fuKey(f){ const raw = f && f.status; return (raw && FU_ALIASES[raw]) || raw; }
function fuDef(f){ return FU_DEFS[fuKey(f)] || FU_DEFS.pending; }
let fuFilter = null;
function setFuFilter(k){ fuFilter = (fuFilter === k) ? null : k; renderFollowups(); }

async function renderFollowups(){
  const list = document.getElementById('fuList');
  const all = await deviceCached('fups', () => loadFollowupsD()).catch(() => null);
  if(all === null){ list.innerHTML = nothingHere(); return; }
  const dir = await getDirectory();
  const today = todayStr();
  /* Open entries, plus anything closed TODAY — so a call made this morning
     does not vanish the moment it is marked, and the day's work stays
     visible. Ordered as the desk orders it: by priority, then by who has
     been waiting longest. */
  const active = (all || [])
    .filter(f => f && (!fuDef(f).resolved || String(f.updatedAt || '').slice(0, 10) === today))
    .sort((a, b) => {
      const ra = fuDef(a).resolved, rb = fuDef(b).resolved;
      if(ra !== rb) return ra ? 1 : -1;
      const pa = fuDef(a).priority, pb = fuDef(b).priority;
      if(pa !== pb) return pa - pb;
      return String(a.sourceDate || '').localeCompare(String(b.sourceDate || ''));
    });
  const openOnes = active.filter(f => !fuDef(f).resolved);
  rollOrSet('fuCount', openOnes.length);

  /* One chip per status, counting only what is still open. Tapping filters;
     tapping again clears. */
  const counts = {};
  openOnes.forEach(f => { const k = fuKey(f) || 'pending'; counts[k] = (counts[k] || 0) + 1; });
  const chipKeys = ['needs_doctor_call','discomfort','not_received','pending'];
  const chips = chipKeys.filter(k => counts[k]).map(k =>
    '<button type="button" class="fu-chip fu-' + FU_DEFS[k].tone + (fuFilter === k ? ' on' : '') + '"'
    + ' onclick="setFuFilter(\'' + k + '\')"><b>' + counts[k] + '</b> '
    + escapeHtml(FU_DEFS[k].label) + '</button>').join('');
  const strip = chips ? '<div class="fu-strip">' + chips + '</div>' : '';

  const shown = fuFilter ? active.filter(f => fuKey(f) === fuFilter && !fuDef(f).resolved) : active;
  if(!shown.length){
    list.innerHTML = strip + '<div class="empty-state">'
      + (fuFilter ? 'None with that status' : 'Nobody waiting on a call') + '</div>';
    return;
  }
  list.innerHTML = strip + shown.map(f => {
    const def = fuDef(f);
    const name = (dir && dir[String(f.patientId)]) || f.patientName || 'Unknown patient';
    const since = String(f.sourceDate || '').slice(0, 10);
    const waited = since ? agoWords(since).replace(' ago', '') : '\u2014';
    return '<div class="pt-card' + (def.resolved ? ' struck' : '') + '">'
      + '<div class="pt-top"><div class="pt-main">'
      + '<div class="pt-name">' + escapeHtml(name) + '</div>'
      + '<div class="pt-sub">' + escapeHtml(String(f.patientId || ''))
        + (f.reason ? ' \u00b7 ' + escapeHtml(f.reason) : '')
        + (since ? ' \u00b7 ' + escapeHtml(shortDateMobile(since)) : '') + '</div>'
      + '<div class="pt-tag fu-tag fu-' + def.tone + '">' + escapeHtml(def.label) + '</div>'
      + '</div><div class="pt-side"><div class="pt-f"><b>' + escapeHtml(waited)
        + '</b><span>waiting</span></div></div></div></div>';
  }).join('');
}


/* ========================= PATIENTS ====================================
   Four ways in — by name, by what is owed, by what is held in advance, and
   by the implants placed — then one record. Read only throughout.

   The sub-pages each read only what they need, and only when opened: a name
   search costs the directory alone, and the two money lists are the only
   ones that touch bills and payments. */
let ptSub = 'search';                 // search | pending | advance | implants
let ptQuery = '';

const PT_SUBS = [['search','Search'], ['pending','Pending'], ['advance','Advance'], ['implants','Implants']];

function ptSearch(v){

async function renderPatientsTab(){
  const row = document.getElementById('ptSubRow');
  const body = document.getElementById('ptBody');
  /* Rewriting the chips on every keystroke is wasted work and, on a phone,
     a visible flicker beside the field being typed into. */
  const wantChips = PT_SUBS.map(x =>
    '<button type="button" class="per-chip' + (ptSub === x[0] ? ' on' : '') + '"'
    + ' onclick="setPtSub(\'' + x[0] + '\')">' + x[1] + '</button>').join('');
  if(row.innerHTML !== wantChips) row.innerHTML = wantChips;
  if(ptOpen) return renderPtRecord(body, ptOpen);
  if(ptSub === 'search')   return renderPtSearch(body);
  if(ptSub === 'implants') return renderPtImplants(body);
  return renderPtMoneyList(body, ptSub);          // pending | advance
}

/* ---- by name ---- */
/* THE BOX MUST SURVIVE THE TYPING (a2.8). Every keystroke re-rendered the
   whole page, and rewriting innerHTML destroys the input element inside it —
   so the field lost focus and the caret mid-word, and you had to tap back in
   to carry on. The box is written once; only the results beneath it are
   replaced. */
async function renderPtSearch(body){
  if(!document.getElementById('ptInput')){
    body.innerHTML = '<input type="text" class="search-input" id="ptInput"'
      + ' placeholder="Search a name or patient ID" autocomplete="off"'
      + ' oninput="ptSearch(this.value)">'
      + '<div id="ptResults"></div>';
    const el = document.getElementById('ptInput');
    el.value = ptQuery;
    /* Coming back to the tab puts the cursor where it was, rather than at
       the start of what is already typed. */
    el.focus({ preventScroll:true });
    el.setSelectionRange(ptQuery.length, ptQuery.length);
  }
  const out = document.getElementById('ptResults');
  const dir = await getDirectory();
  const con = await loadPatientContacts().catch(() => null);
  const q = ptQuery.toLowerCase();
  if(q.length < 2){ out.innerHTML = '<div class="empty-state">Type a name or an ID</div>'; return; }
  const hits = Object.keys(dir || {})
    .filter(pid => String(dir[pid] || '').toLowerCase().includes(q) || String(pid).toLowerCase().includes(q))
    .sort((a, b) => {
      const na = String(dir[a]||'').toLowerCase(), nb = String(dir[b]||'').toLowerCase();
      return (na.startsWith(q) ? 0 : 1) - (nb.startsWith(q) ? 0 : 1) || na.localeCompare(nb);
    });
  if(!hits.length){ out.innerHTML = '<div class="empty-state">No one by that name</div>'; return; }
  const shown = hits.slice(0, 30);
  out.innerHTML = shown.map(pid => ptRowHtml(pid, dir[pid], whoLine(con, pid), '')).join('')
    + (hits.length > shown.length
        ? '<div class="empty-state">' + (hits.length - shown.length) + ' more \u2014 type a little further</div>' : '');
}
function ptRowHtml(pid, name, sub, right){
  return '<div class="pt-card tappable" onclick="openPt(' + JSON.stringify(String(pid)).replace(/"/g,'&quot;') + ')">'
    + '<div class="pt-top"><div class="pt-main">'
    + '<div class="pt-name">' + escapeHtml(name || 'Unknown patient') + '</div>'
    + '<div class="pt-sub">' + escapeHtml(String(pid)) + (sub ? ' \u00b7 ' + escapeHtml(sub) : '') + '</div>'
    + '</div>' + (right ? '<div class="pt-side">' + right + '</div>' : '') + '</div></div>';
}

/* ---- what is owed, and what is held ----
   Pending and Advance are the same arithmetic read from either end: billed
   minus paid. A negative balance is money the clinic is holding. */
async function renderPtMoneyList(body, which){
  body.innerHTML = '<div class="spin">Reading&hellip;</div>';
  const [bills, entries, dir] = await Promise.all([
    loadBills().catch(() => null), loadAllEntries().catch(() => null), getDirectory()
  ]);
  if(bills === null || entries === null){
    body.innerHTML = nothingHere(); return;
  }
  const map = computePendingFromData(bills, entries);
  const rows = Object.keys(map)
    .map(pid => ({ pid, ...map[pid] }))
    .filter(r => which === 'pending' ? r.pending > 0.5 : r.pending < -0.5)
    .sort((a, b) => which === 'pending' ? b.pending - a.pending : a.pending - b.pending);
  const total = rows.reduce((t, r) => t + Math.abs(r.pending), 0);
  const head = totalBlock(which === 'pending' ? 'pending' : 'held in advance', fmtINR(total),
    [['patients', String(rows.length)]], '');
  if(!rows.length){
    body.innerHTML = head + '<div class="empty-state">'
      + (which === 'pending' ? 'Nothing outstanding' : 'Nothing held in advance') + '</div>';
    return;
  }
  body.innerHTML = head + rows.slice(0, 200).map(r =>
    ptRowHtml(r.pid, (dir && dir[r.pid]) || r.name, 'billed ' + fmtINR(r.totalBilled)
      + ' \u00b7 paid ' + fmtINR(r.totalPayments),
      '<div class="pt-amt' + (which === 'advance' ? ' adv' : ' neg') + '">'
        + fmtINR(Math.abs(r.pending)) + '</div>')).join('');
}

/* ---- the implants placed ---- */
async function renderPtImplants(body){
  body.innerHTML = '<div class="spin">Reading&hellip;</div>';
  const [log, dir] = await Promise.all([
    deviceCached('implants', () => loadImplantLog()).catch(() => null), getDirectory()]);
  if(log === null){ body.innerHTML = nothingHere(); return; }
  const live = (log || []).filter(e => e && !e.removedAt)
    .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
  if(!live.length){ body.innerHTML = '<div class="empty-state">None on record</div>'; return; }
  /* WHERE IT WAS PLACED (a2.7). The log holds fixtures the owner placed at
     other clinics as well as here, and a count that mixes them answers
     neither question. An entry carries a clinic name only when it was placed
     somewhere else; no name means this clinic. */
  const here = live.filter(e => !String(e.placedAt || '').trim());
  const away = live.filter(e => String(e.placedAt || '').trim());
  const byCo = {};
  live.forEach(e => { const c = String(e.company || 'Unknown').trim(); (byCo[c] = byCo[c] || []).push(e); });
  const cos = Object.keys(byCo).sort((a, b) => byCo[b].length - byCo[a].length);
  body.innerHTML = totalBlock('implants placed', String(live.length),
      [['at this clinic', String(here.length)], ['elsewhere', String(away.length)]]
        .concat(cos.slice(0, 5).map(c => [c, String(byCo[c].length)])), '')
    + '<div class="imp-split">'
      + '<div class="imp-s"><b>' + here.length + '</b><span>at this clinic</span></div>'
      + '<div class="imp-s"><b>' + away.length + '</b><span>elsewhere</span></div>'
    + '</div>'
    + live.slice(0, 200).map(e => {
      const size = [e.dia, e.len].filter(v => v != null && v !== '').join(' \u00d7 ');
      return ptRowHtml(e.patientId, (dir && dir[String(e.patientId)]) || e.patientName,
        String(e.tooth || '\u2014') + (e.company ? ' \u00b7 ' + e.company : '') + (size ? ' \u00b7 ' + size : '')
          + (e.placedAt ? ' \u00b7 at ' + e.placedAt : ''),
        '<div class="pt-f"><b>' + escapeHtml(e.date ? shortDateMobile(e.date) : '\u2014') + '</b>'
          + '<span>placed</span></div>');
    }).join('')
    + (live.length > 200 ? '<div class="empty-state">' + (live.length - 200) + ' more</div>' : '');
}


/* ---- one patient's record -------------------------------------------
   The header carries what the desk's header carries: who they are, how to
   reach them, what they owe, and the tags the desk gives them. Below it the
   timeline BY TYPE — the desk's own grouping and its own order, with every
   row opening to the thing behind it. */
const PT_TYPES = [
  ['prescription', '\u211e',       'Prescriptions'],
  ['visit',        '\uD83D\uDCC5', 'Visits'],
  ['bill',         '\uD83E\uDDFE', 'Bills'],
  ['payment',      '\uD83D\uDCB3', 'Payments'],
  ['labcase',      '\uD83E\uDDB7', 'Lab cases'],
  ['implant',      '\uD83E\uDDB7', 'Implants'],
  ['followup',     '\uD83D\uDCDE', 'Follow-ups'],
  ['note',         '\uD83D\uDCDD', 'Notes']
];
let expandedType = null;            // which group is unfolded past its first few
let ptRowOpen = null;               // which single row is opened
const PT_FIRST_PAGE = 4;
function togglePtType(t){ expandedType = (expandedType === t) ? null : t; renderPatientsTab(); }
function togglePtRow(k){ ptRowOpen = (ptRowOpen === k) ? null : k; renderPatientsTab(); }

async function renderPtRecord(body, pid){
  body.innerHTML = '<div class="spin">Reading&hellip;</div>';
  const [dir, con, crm, created, ortho, notes, rx, bills, entries, labs, fups, implants] =
    await Promise.all([
      getDirectory(),
      loadPatientContacts().catch(()=>null),
      deviceCached('crm',     () => loadPatientCrm()).catch(()=>({})),
      deviceCached('created', () => loadPatientCreated()).catch(()=>({})),
      orthoIdsCachedM().catch(()=>new Set()),
      deviceCached('notes',   () => loadPatientNotes()).catch(()=>[]),
      getRxIndex(),
      loadBills().catch(()=>[]),
      loadAllEntries().catch(()=>[]),
      deviceCached('labs',    () => loadLabCases()).catch(()=>[]),
      deviceCached('fups',    () => loadFollowupsD()).catch(()=>[]),
      deviceCached('implants',() => loadImplantLog()).catch(()=>[]),
    ]);
  if(ptOpen !== pid) return;                    // they went back while it read
  const P = String(pid);
  const name = (dir && dir[P]) || 'Unknown patient';
  const money = computePendingFromData(bills || [], entries || []);
  const bal = (money[P] || { pending:0, totalBilled:0, totalPayments:0 });

  /* ---- header ---- */
  const who = whoLine(con, P);
  /* A NUMBER IS A RECORD, NOT A STRING (a2.6). primaryNumber returns the
     whole entry — number, label, whether it is the primary — and printing it
     straight into the page rendered "[object Object]". The dialable form is
     .e164; the readable form is what fmtPhoneMobile makes of it. */
  const phoneRec = primaryNumber(con, P);
  const phone = phoneRec && phoneRec.e164 ? String(phoneRec.e164) : '';
  const madeOn = created && created[P] ? String(created[P]).slice(0, 10) : '';
  const crmRow = (crm && crm[P]) || {};
  const chips = [];
  if(ortho && ortho.has && ortho.has(P)) chips.push(['ortho', 'Long treatment']);
  if(crmRow.status) chips.push(['crm', String(crmRow.status)]);
  const balTone = bal.pending > 0.5 ? 'neg' : bal.pending < -0.5 ? 'adv' : '';
  const balWord = bal.pending > 0.5 ? 'pending' : bal.pending < -0.5 ? 'in advance' : 'settled';
  let h = '<button type="button" class="btn ghost" onclick="closePt()" style="margin:4px 0 12px;">&lsaquo; Back</button>'
    + '<div class="ptr-head">'
      + '<div class="ptr-name">' + escapeHtml(name) + '</div>'
      + '<div class="ptr-sub">' + escapeHtml(P) + (who ? ' \u00b7 ' + escapeHtml(who) : '') + '</div>'
      + (phone ? '<a class="ptr-tel" href="tel:' + escapeHtml(phone) + '">'
                 + ICON.tel + escapeHtml(fmtPhoneMobile(phone))
                 + (phoneRec.label ? ' <span class="ptr-tellabel">' + escapeHtml(phoneRec.label) + '</span>' : '')
                 + '</a>' : '<div class="ptr-nonum">No number on file</div>')
      + (chips.length ? '<div class="ptr-chips">' + chips.map(c =>
            '<span class="ptr-chip ptr-' + c[0] + '">' + escapeHtml(c[1]) + '</span>').join('') + '</div>' : '')
      + '<div class="ptr-money">'
        + '<div class="ptr-m"><b class="' + balTone + '">' + fmtINR(Math.abs(bal.pending)) + '</b><span>' + balWord + '</span></div>'
        + '<div class="ptr-m"><b>' + fmtINR(bal.totalBilled) + '</b><span>billed</span></div>'
        + '<div class="ptr-m"><b>' + fmtINR(bal.totalPayments) + '</b><span>paid</span></div>'
        + (madeOn ? '<div class="ptr-m"><b>' + escapeHtml(shortDateMobile(madeOn)) + '</b><span>on record</span></div>' : '')
      + '</div>'
    + '</div>';

  /* ---- everything this patient has, as typed events ---- */
  const mine = { prescription:[], visit:[], bill:[], payment:[], labcase:[], implant:[], followup:[], note:[] };
  (rx || []).filter(r => r && String(r.patientId) === P).forEach(r =>
    mine.prescription.push({ when:String(r.date || r.createdAt || '').slice(0,10),
      what: rxWhat(r), struck: rxIsStruck(r), body: () => rxDetailHtml(r) }));
  (bills || []).filter(b => b && String(b.patientId) === P).forEach(b =>
    mine.bill.push({ when:String(b.date || '').slice(0,10),
      what: (b.billNo ? '#' + b.billNo + ' \u00b7 ' : '') + fmtINR(Number(b.grandTotal)||0)
            + (isCreditNote(b) ? ' \u00b7 credit note' : ''),
      struck: isCancelledBill(b), body: () => billLinesHtml(b) }));
  (entries || []).forEach(e => (e.items || []).forEach(it => {
    if(!it || String(it.patientId) !== P || isVoidedItem(it)) return;
    mine.payment.push({ when:String(e.date || '').slice(0,10),
      what: fmtINR((it.method === 'refund' ? -1 : 1) * (Number(it.amount)||0)) + ' \u00b7 ' + (it.method || 'cash'),
      struck: isReversedItem(it) });
  }));
  (labs || []).filter(c => c && String(c.patientId) === P).forEach(c =>
    mine.labcase.push({ when:String(c.dateSent || c.dateLogged || '').slice(0,10),
      what: [c.workType, c.labName, labCaseIsVoid(c) ? 'Void' : (labStageOf(c)||{}).label].filter(Boolean).join(' \u00b7 '),
      struck: !!c.struckAt || labCaseIsVoid(c) }));
  (implants || []).filter(e => e && String(e.patientId) === P && !e.removedAt).forEach(e =>
    mine.implant.push({ when:String(e.date || '').slice(0,10),
      what: [e.tooth, e.company, [e.dia, e.len].filter(v=>v!=null&&v!=='').join(' \u00d7 '), e.placedAt]
              .filter(Boolean).join(' \u00b7 ') }));
  (fups || []).filter(f => f && String(f.patientId) === P).forEach(f =>
    mine.followup.push({ when:String(f.sourceDate || '').slice(0,10),
      what: fuDef(f).label + (f.reason ? ' \u00b7 ' + f.reason : ''), struck: fuDef(f).resolved }));
  (notes || []).filter(n => n && String(n.patientId) === P).forEach(n =>
    mine.note.push({ when:String(n.date || n.createdAt || '').slice(0,10),
      what: String(n.text || n.note || ''), struck: !!n.struckAt }));

  /* Visits come from the index, which holds only the dates. */
  const vIdx = await deviceCached('vidx', () => loadVisitsIndex()).catch(()=>null);
  if(vIdx && typeof vIdx === 'object'){
    (Array.isArray(vIdx[P]) ? vIdx[P] : []).forEach(dt =>
      mine.visit.push({ when:String(dt).slice(0,10), what:'Visited' }));
  }

  let any = false;
  PT_TYPES.forEach(([t, icon, label]) => {
    const rows = (mine[t] || []).sort((a, b) => String(b.when).localeCompare(String(a.when)));
    /* A type this patient has nothing of is not a card — an empty "0 lab
       cases" panel is noise on every record in the clinic. */
    if(!rows.length) return;
    any = true;
    const open = expandedType === t;
    const shown = open ? rows : rows.slice(0, PT_FIRST_PAGE);
    const hidden = rows.length - shown.length;
    h += '<div class="tc"><div class="tc-head">'
      + '<span class="tc-icon">' + icon + '</span>'
      + '<span class="tc-label">' + escapeHtml(label) + '</span>'
      + '<span class="tc-count">' + rows.length + '</span></div>'
      + shown.map((ev, i) => {
          const key = t + ':' + i;
          const isOpen = ptRowOpen === key && ev.body;
          return '<div class="tc-row' + (ev.struck ? ' struck' : '') + (ev.body ? ' tappable' : '') + '"'
            + (ev.body ? ' onclick="togglePtRow(\'' + key + '\')"' : '') + '>'
            + '<span class="tc-when">' + escapeHtml(ev.when ? shortDateMobile(ev.when) : '\u2014') + '</span>'
            + '<span class="tc-what">' + escapeHtml(ev.what || '') + '</span>'
            + (ev.body ? '<span class="tc-chev">' + (isOpen ? '\u2013' : '+') + '</span>' : '')
            + '</div>'
            + (isOpen ? '<div class="tc-body">' + ev.body() + '</div>' : '');
        }).join('')
      + (hidden > 0 ? '<button type="button" class="pt-more" onclick="togglePtType(\'' + t + '\')">'
                      + hidden + ' more</button>'
         : (open && rows.length > PT_FIRST_PAGE
            ? '<button type="button" class="pt-more" onclick="togglePtType(\'' + t + '\')">Show fewer</button>' : ''))
      + '</div>';
  });
  if(!any) h += '<div class="empty-state">Nothing on record for this patient</div>';
  body.innerHTML = h;
}

/* ---- boot (4.0) ---------------------------------------------------------
   One gate: a relay link on this phone. Opens locked, drawn from the phone. */
let booted = false;
function showApp(){
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
}
function showSetup(){
  document.getElementById('setupScreen').classList.remove('hidden');
  document.getElementById('appScreen').classList.add('hidden');
}
async function boot(){
  takeSetupFromLink();
  if(!isSetUp()){ showSetup(); return; }
  showApp();
  if(!booted){ booted = true; Cal.wireStripSwipe(); Cal.wireDrawer(); wirePull(); }
  Cal.hooks.adminOn = adminOn;
  Cal.hooks.money = async (pid, day) => {
    const [bills, entries] = await Promise.all([loadBills(), loadAllEntries()]);
    const mine = (bills || []).filter(b => billCountsAsMoney(b) && String(b.patientId) === String(pid));
    const billToday = mine.filter(b => String(b.date || '').slice(0, 10) === day).reduce((t, b) => t + (Number(b.grandTotal) || 0), 0);
    const map = computePendingFromData(bills || [], entries || []);
    return { billToday, pending: (map[String(pid)] || {}).pending || 0 };
  };
  Cal.hooks.fullHistory = (pid, back) => {
    ptReturnToCalendar = back || null;
    setTab('patients');
    ptSub = 'search';
    openPt(pid);
  };
  paintLock(); paintTabs();
  await Cal.hydrate();
  setTab('calendar');
  Cal.refreshSettings(true);
  Cal.ensureWeek(Cal.getViewDay(), true);
}
window.addEventListener('load', () => {
  const ver = document.getElementById('appVer');
  if(ver) ver.textContent = ADMIN_VERSION;
  paintGreeting();
  boot();
});
window.addEventListener('hashchange', () => { if(/relay=/.test(location.hash)) boot(); });

/* PASTED, NOT OPENED (iPhone). An app added to the Home Screen does not share
   storage with Safari, so a link opened in Safari never reaches it. The same
   link pasted here does. */
function pasteSetupLink(){
  const raw = String((document.getElementById('setupPaste') || {}).value || '').trim();
  const msg = document.getElementById('setupPasteMsg');
  const i = raw.indexOf('#');
  const p = new URLSearchParams(i === -1 ? '' : raw.slice(i + 1));
  if(!p.get('relay') || !p.get('key')){ if(msg) msg.textContent = 'That is not a setup link \u2014 copy the whole link, from https to the end.'; return; }
  location.hash = raw.slice(i + 1);
  if(typeof boot === 'function') boot();
}
/* THE SAVED COPY OF THIS PAGE (v48 service worker). Registered here so the
   page itself opens with no network wait, not only its data. */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
